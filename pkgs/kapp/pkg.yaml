schema: 3
name: kapp
description: Deployment tool focused on the concept of a Kubernetes application
homepage: https://carvel.dev/kapp
license: Apache-2.0

versionDiscovery:
  github:
    repo: carvel-dev/kapp
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/carvel-dev/kapp/releases/download/v{{.Version}}/kapp-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kapp", mode: 0o755}

bins: ["bin"]

test:
  - run: kapp version | grep -q "$NEM_VERSION"

