schema: 3
name: git-bug
description: Distributed, offline-first bug tracker embedded in git
homepage: https://github.com/git-bug/git-bug
license: GPL-3.0

platforms: [darwin/arm64, darwin/amd64, linux/amd64]

versionDiscovery:
  github:
    repo: git-bug/git-bug
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/git-bug/git-bug/releases/download/v{{.Version}}/git-bug_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/git-bug", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.12.0
    sha256:
      darwin/arm64: "2969a3d4f862294c6528578c68e7b18704a8cdf84aa512d3ff8940ed49643b03"
      darwin/amd64: "1a78508f4be8704f9661bac489d4db1e0d68d3fcd826b57d57826a07c5ffc3ef"
      linux/amd64: "ff243821d70445df0bbbcd77d99ef65108fc3d632659a95e79c640ac0db57994"
  - version: 0.11.0
    sha256:
      darwin/arm64: "c4ba361eaae0507ad1b7c40efadd458538d9d9226a1388b47f187a63ac492be3"
      darwin/amd64: "b04725711beabc54119cb727c9bba83c2b7e7ee6a867964babe0c492ad6f7a82"
      linux/amd64: "431199b5997ec8e6de9fa7e2caab13fe222268b0110d0c85a4354907197e7ce9"
  - version: 0.10.1
    sha256:
      darwin/arm64: "b4d1532d36fc1ba0bc9c40d45e496e73d73f3a0b15c4f3a92930bfef5eca32a2"
      darwin/amd64: "5e70f02eefffc0aa9c3280985a5dda1dc15374c18f065b3bb3b386174ca92e03"
      linux/amd64: "3ba2f8b41e526fef1b6e825d5030823be65bb6521a287b1139bd609fed0d54a1"

test:
  - run: git-bug version | grep -q "$NEM_VERSION"
