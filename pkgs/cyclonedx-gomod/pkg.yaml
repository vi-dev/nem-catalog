schema: 2
name: cyclonedx-gomod
description: Generate CycloneDX SBOMs from Go modules
homepage: https://cyclonedx.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: CycloneDX/cyclonedx-gomod
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v{{.Version}}/cyclonedx-gomod_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cyclonedx-gomod", dst: "bin/cyclonedx-gomod", mode: 0o755}

bins: ["bin"]

test:
  - run: cyclonedx-gomod version 2>&1 | grep -q "$NEM_VERSION"

versions:
