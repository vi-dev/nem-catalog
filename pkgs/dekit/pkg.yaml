schema: 3
name: dekit
description: Process manager for dev and prod (formerly mprocs)
homepage: https://github.com/pvolok/dekit
license: MIT

versionDiscovery:
  github:
    repo: pvolok/dekit
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pvolok/dekit/releases/download/v{{.Version}}/dekit-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dekit", dst: "bin/dekit", mode: 0o755}

bins: ["bin"]

