schema: 2
name: addlicense
description: Add license headers to source files
homepage: https://github.com/google/addlicense
license: Apache-2.0

versionDiscovery:
  github:
    repo: google/addlicense
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/google/addlicense/releases/download/v{{.Version}}/addlicense_v{{.Version}}_{{replace (replace .OS \"darwin\" \"macOS\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "addlicense", dst: "bin/addlicense", mode: 0o755}

bins: ["bin"]

test:
  - run: addlicense -h 2>&1 | grep -q Usage

versions:
  - version: 1.2.0
    sha256:
      darwin/arm64: "0597305c619f7349748e830e38322dbe7d13cf86cf415b289c70f5cecbb4bf63"
