schemaVersion: 1
name: bat
description: Cat clone with syntax highlighting and Git integration
homepage: https://github.com/sharkdp/bat
license: Apache-2.0 OR MIT

archive:
  fetch:
    github_release:
      repo: sharkdp/bat
      assetName: 'bat-{{.Version}}-{{.Arch}}-{{if eq .OS "darwin"}}apple-darwin{{else}}unknown-linux-gnu{{end}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        amd64: x86_64
        arm64: aarch64
  # bat publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/bat"
      to: "{{.InstallDir}}/bin/bat"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/bat", "--version"]
