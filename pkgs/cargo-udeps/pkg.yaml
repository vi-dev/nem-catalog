schema: 2
name: cargo-udeps
description: Find unused dependencies in Cargo.toml
homepage: https://github.com/est31/cargo-udeps
license: MIT OR Apache-2.0

versionDiscovery:
  github:
    repo: est31/cargo-udeps
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/est31/cargo-udeps/releases/download/v{{.Version}}/cargo-udeps-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-udeps", dst: "bin/cargo-udeps", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-udeps udeps --version 2>&1 | grep -q "$NEM_VERSION"

versions:
