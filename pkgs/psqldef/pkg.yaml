schema: 3
name: psqldef
description: Idempotent schema management for PostgreSQL
homepage: https://sqldef.github.io
license: MIT

versionDiscovery:
  github:
    repo: sqldef/sqldef
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sqldef/sqldef/releases/download/v{{.Version}}/psqldef_{{.OS}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "psqldef", dst: "bin/psqldef", mode: 0o755}

bins: ["bin"]

