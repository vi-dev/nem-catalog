schema: 2
name: psqldef
description: Idempotent schema management for PostgreSQL
homepage: https://sqldef.github.io
license: MIT

versionDiscovery:
  github:
    repo: sqldef/sqldef
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
