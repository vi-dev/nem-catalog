schema: 3

name: libgpg-error
description: Error codes and runtime support shared by the GnuPG components
homepage: https://www.gnupg.org/software/libgpg-error/
license: LGPL-2.1-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

libs: [lib]

versionDiscovery:
  http:
    url: https://gnupg.org/ftp/gcrypt/libgpg-error/
    filter: 'libgpg-error-(\d+\.\d+)\.tar\.bz2'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.61
    sourceSha256: "7a85413f2bc354f4f8aa832b718af122e48965e9e0eb9012ee659c13c6385c93"
  - version: "1.51"
    sourceSha256: "be0f1b2db6b93eed55369cdf79f19f72750c8c7c39fc20b577e724545427e6b2"

build:
  source:
    url: 'https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-{{.Version}}.tar.bz2'
  output: out
  steps:
    - run: ./configure --prefix=/ --libdir=/lib --disable-dependency-tracking --enable-shared --disable-static --disable-doc --disable-nls --disable-tests && make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)" && make install DESTDIR="$NEM_OUTPUT"

test:
  - run: gpg-error --version | grep -q "(libgpg-error) $NEM_VERSION"
  - run: gpgrt-config --version | grep -qx "$NEM_VERSION"
  - run: gpg-error 1 | grep -q GPG_ERR_GENERAL
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/gpg-error.h" ]
      ls "$NEM_PREFIX"/lib/libgpg-error.* >/dev/null
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/gpg-error.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <gpg-error.h>
      #include <stdio.h>
      int main(void) {
        puts(gpg_error_check_version(NULL));
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -lgpg-error -o probe
      [ "$(./probe)" = "$NEM_VERSION" ]
