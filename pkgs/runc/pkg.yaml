schema: 2
name: runc
description: CLI for spawning and running containers per the OCI spec
homepage: https://github.com/opencontainers/runc
license: Apache-2.0

platforms: [linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: opencontainers/runc
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/opencontainers/runc/releases/download/v{{.Version}}/runc.{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/runc", mode: 0o755}

bins: ["bin"]

