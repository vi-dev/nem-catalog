schema: 2
name: mongodb-exporter
description: Prometheus exporter for MongoDB
homepage: https://github.com/percona/mongodb_exporter
license: Apache-2.0

versionDiscovery:
  github:
    repo: percona/mongodb_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/percona/mongodb_exporter/releases/download/v{{.Version}}/mongodb_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "mongodb_exporter", dst: "bin/mongodb_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: mongodb_exporter --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.53.0
    sha256:
      darwin/arm64: "a626c36d6da92efe3a314c78df6721f58be58b5e626e5012248c34bbdfef722e"
