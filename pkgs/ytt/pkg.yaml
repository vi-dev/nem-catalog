schema: 2
name: ytt
description: Carvel YAML templating and overlay tool
homepage: https://carvel.dev/ytt
license: Apache-2.0

versionDiscovery:
  github:
    repo: carvel-dev/ytt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/carvel-dev/ytt/releases/download/v{{.Version}}/ytt-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/ytt", mode: 0o755}

bins: ["bin"]

