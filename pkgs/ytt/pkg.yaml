schemaVersion: 1
name: ytt
description: Template and patch YAML configuration with overlays and data values
homepage: https://carvel.dev/ytt
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: carvel-dev/ytt
      # Assets are raw per-platform binaries: ytt-<os>-<arch> (.OS/.Arch match).
      assetName: 'ytt-{{.OS}}-{{.Arch}}'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: checksums.txt

install:
  # The asset is the executable itself; copy it straight into bin/.
  - copy:
      from: "{{.Archive}}"
      to: "{{.InstallDir}}/bin/ytt"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/ytt", "version"]
