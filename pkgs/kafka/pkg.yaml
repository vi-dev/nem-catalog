schema: 2
name: kafka
description: Distributed event streaming platform
homepage: https://kafka.apache.org
license: Apache-2.0

deps:
  - jdk25

versionDiscovery:
  http:
    url: https://archive.apache.org/dist/kafka/
    filter: 'href="(\d+\.\d+\.\d+)/"'

artifact:
  url: "https://archive.apache.org/dist/kafka/{{.Version}}/kafka_2.13-{{.Version}}.tgz"

install:
  - extract: {strip: 1}

bins: ["bin"]

test:
  - run: kafka-topics.sh --version 2>&1 | grep -q "$NEM_VERSION"

