schema: 3
name: dart-sass
description: Reference implementation of the Sass compiler
homepage: https://sass-lang.com
license: MIT

versionDiscovery:
  github:
    repo: sass/dart-sass
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/sass/dart-sass/releases/download/{{.Version}}/dart-sass-{{.Version}}-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 1}

# sass is a shell wrapper that resolves src/dart and src/sass.snapshot relative
# to itself, so the SDK tree stays at the package root instead of moving to bin/.
bins: ["."]

