schema: 2
name: vhs
description: Terminal GIF recorder driven by a script file
homepage: https://github.com/charmbracelet/vhs
license: MIT

versionDiscovery:
  github:
    repo: charmbracelet/vhs
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/charmbracelet/vhs/releases/download/v{{.Version}}/vhs_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "vhs", dst: "bin/vhs", mode: 0o755}

bins: ["bin"]

