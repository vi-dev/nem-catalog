schema: 2
name: pushgateway
description: Prometheus push acceptor for ephemeral and batch jobs
homepage: https://prometheus.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: prometheus/pushgateway
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/prometheus/pushgateway/releases/download/v{{.Version}}/pushgateway-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "pushgateway", dst: "bin/pushgateway", mode: 0o755}

bins: ["bin"]

test:
  - run: pushgateway --version 2>&1 | grep -q "$NEM_VERSION"

versions:
