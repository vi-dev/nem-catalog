description: Terminal UI for managing and querying Postgres databases
homepage: https://github.com/achristmascarl/rainfrog
license: MIT

versionDiscovery:
  github:
    repo: achristmascarl/rainfrog
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/achristmascarl/rainfrog/releases/download/v{{.Version}}/rainfrog-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "rainfrog", dst: "bin/rainfrog", mode: 0o755}

bins: ["bin"]

