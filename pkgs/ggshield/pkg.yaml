schema: 2
name: ggshield
description: Detect hardcoded secrets with GitGuardian
homepage: https://gitguardian.com
license: MIT

versionDiscovery:
  github:
    repo: GitGuardian/ggshield
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/GitGuardian/ggshield/releases/download/v{{.Version}}/ggshield-{{.Version}}-{{if eq .OS \"darwin\"}}{{replace .Arch \"amd64\" \"x86_64\"}}-apple-darwin{{else}}{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-unknown-linux-gnu{{end}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["."]

test:
  - run: ggshield --version 2>&1 | grep -q "$NEM_VERSION"

