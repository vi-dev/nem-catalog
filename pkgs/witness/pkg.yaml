schema: 2
name: witness
description: Attest and verify software supply chain provenance
homepage: https://witness.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: in-toto/witness
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/in-toto/witness/releases/download/v{{.Version}}/witness_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "witness", dst: "bin/witness", mode: 0o755}

bins: ["bin"]

test:
  - run: witness version 2>&1 | grep -q "$NEM_VERSION"

versions:
