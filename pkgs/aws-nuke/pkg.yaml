schema: 3
name: aws-nuke
description: Remove all resources from an AWS account
homepage: https://aws-nuke.ekristen.dev
license: MIT

versionDiscovery:
  github:
    repo: ekristen/aws-nuke
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ekristen/aws-nuke/releases/download/v{{.Version}}/aws-nuke-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "aws-nuke", dst: "bin/aws-nuke", mode: 0o755}

bins: ["bin"]

test:
  - run: aws-nuke version | grep -q "$NEM_VERSION"

