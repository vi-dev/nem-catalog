schema: 3
name: release-plz
description: Publish Rust crates from CI with a release PR
homepage: https://release-plz.dev
license: Apache-2.0
platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: release-plz/release-plz
    filter: '^release-plz-v\d+\.\d+\.\d+$'
    prefix: "release-plz-v"

artifact:
  url: "https://github.com/release-plz/release-plz/releases/download/release-plz-v{{.Version}}/release-plz-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "release-plz", dst: "bin/release-plz", mode: 0o755}

bins: ["bin"]

test:
  - run: release-plz --version 2>&1 | grep -q "$NEM_VERSION"

