schema: 3
name: dnote
description: Command line notebook for capturing notes
homepage: https://github.com/dnote/dnote
license: Apache-2.0

versionDiscovery:
  github:
    repo: dnote/dnote
    filter: '^cli-v\d+\.\d+\.\d+$'
    prefix: "cli-v"

artifact:
  url: "https://github.com/dnote/dnote/releases/download/cli-v{{.Version}}/dnote_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dnote", dst: "bin/dnote", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.17.0
    sha256:
      darwin/arm64: "5061aa3f1b957a19bc1a36d27e5cc8c20460ef439c638e4d95ffe31f9832a055"
      darwin/amd64: "c1c4a8cd54a415fbd43c3bad85e965d08e825b5c8fd4cc280adeab3c7a8ca83c"
      linux/arm64: "4ae7b46de86a17c8b5611b2062004e34b6b6cfde7aa0779858b852c60a7d71bd"
      linux/amd64: "e128cda61b966524607aca27b72696c7c4bbac45ecb54a309bea098fff7a9bda"
  - version: 0.16.0
    sha256:
      darwin/arm64: "bc263c0dd15416323e85c10c4b7a2543138279982cd9ddeed0744569ccaaec71"
      darwin/amd64: "893531d29a401443e3660efb59b96302904fa158ba0f5fc92906f6f174424f1e"
      linux/arm64: "8f56d2a9c93e9dcd2f4b9f8a3f747f9689983abb4ba7ba331d364f8fca1d6680"
      linux/amd64: "a81ce7c5d8aface2272ceded700ba8524bc5c2e7457d751b5aa5a831611075d6"

test:
  - run: dnote version | grep -q "$NEM_VERSION"
