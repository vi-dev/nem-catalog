schemaVersion: 1
name: ruff
description: Extremely fast Python linter and code formatter, written in Rust
homepage: https://docs.astral.sh/ruff
license: MIT

archive:
  fetch:
    github_release:
      repo: astral-sh/ruff
      # Rust target-triple assets; the OS key carries the whole triple suffix.
      assetName: 'ruff-{{.Arch}}-{{.OS}}.tar.gz'
      releaseFilter: '^(\d+\.\d+\.\d+)$'
      versionTemplate: "{{.Capture}}"
      templateOverrides:
        darwin: apple-darwin
        linux: unknown-linux-gnu
        amd64: x86_64
        arm64: aarch64
  verify:
    checksumGitHubAsset: 'ruff-{{.Arch}}-{{.OS}}.tar.gz.sha256'

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/ruff"
      to: "{{.InstallDir}}/bin/ruff"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/ruff", "--version"]
