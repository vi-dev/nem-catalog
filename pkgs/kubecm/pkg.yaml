schema: 2
name: kubecm
description: Manage kubeconfig files more easily
homepage: https://kubecm.cloud
license: Apache-2.0

versionDiscovery:
  github:
    repo: sunny0826/kubecm
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sunny0826/kubecm/releases/download/v{{.Version}}/kubecm_v{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubecm", dst: "bin/kubecm", mode: 0o755}

bins: ["bin"]

test:
  - run: kubecm version | grep -q "$NEM_VERSION"

