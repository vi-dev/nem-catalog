schema: 2
name: gotty
description: Share a terminal as a web application
homepage: https://github.com/sorenisanerd/gotty
license: MIT

versionDiscovery:
  github:
    repo: sorenisanerd/gotty
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sorenisanerd/gotty/releases/download/v{{.Version}}/gotty_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gotty", dst: "bin/gotty", mode: 0o755}

bins: ["bin"]

test:
  - run: gotty --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 1.8.0
    sha256:
      darwin/arm64: "e771f0f604acba752195410b5854bb06ae38fb91886d262b8e45874c60f8a4a2"
