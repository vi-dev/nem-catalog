schema: 2
name: tfplugindocs
description: Generate and validate Terraform provider documentation
homepage: https://github.com/hashicorp/terraform-plugin-docs
license: MPL-2.0

versionDiscovery:
  github:
    repo: hashicorp/terraform-plugin-docs
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/hashicorp/terraform-plugin-docs/releases/download/v{{.Version}}/tfplugindocs_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "tfplugindocs", dst: "bin/tfplugindocs", mode: 0o755}

bins: ["bin"]

test:
  - run: tfplugindocs --version 2>&1 | grep -q "$NEM_VERSION"

versions:
