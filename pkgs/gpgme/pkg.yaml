schemaVersion: 1
name: gpgme
description: Library wrapper providing a high-level API to GnuPG
homepage: https://www.gnupg.org/software/gpgme/index.html
license: LGPL-2.1-or-later

buildFromSource: true
dependsOn:
  - libgpg-error
  - libassuan
  - gnupg           # spawned at runtime; configure also probes gpg/gpgconf at build

buildDependsOn:
  - libgpg-error
  - libassuan
  - gnupg

source:
  fetch:
    http:
      url: 'https://gnupg.org/ftp/gcrypt/gpgme/gpgme-{{.Version}}.tar.bz2'
      versionsFrom:
        github_tag:
          repo: gpg/gpgme
          tagFilter: '^gpgme-(\d+\.\d+\.\d+)$'

versions:
  - version: "2.1.1"
    source:
      verify:
        checksum: 6d7ee12b209d7dce75468db53f72a90e1ad3d21f4c304ef2c002612a52f5333a

build:
  - extract:
      from: "{{.Source}}"
      as: src
      stripComponents: 1
  - mkdir:
      path: "{{.StagingDir}}/.tmp"
  # C library only; the empty --enable-languages= skips the cpp/qt/python bindings.
  - run:
      cwd: "{{.Var.src}}"
      env:
        TMPDIR: "{{.StagingDir}}/.tmp"
      # Serial make: gpgme's parallel build has an intermittent ordering race.
      script: |
        ./configure --prefix="$NEM_INSTALL_DIR" \
          --disable-nls --disable-doc --enable-languages= --disable-gpg-test
        make
        make install DESTDIR="$NEM_STAGING_DIR"

test:
  # gpgme 2.x dropped gpgme-config; exercise the library through gpgme-json's
  # version op, falling back to confirming the shared lib + pkg-config metadata
  # committed. Functional linkage is also covered by the skopeo dependent.
  - run:
      script: |
        out=$(printf '{"op":"version"}' | "$NEM_INSTALL_DIR/bin/gpgme-json" 2>/dev/null || true)
        case "$out" in
          *gpgme*) exit 0 ;;
        esac
        ls "$NEM_INSTALL_DIR"/lib/libgpgme.* >/dev/null && test -f "$NEM_INSTALL_DIR/lib/pkgconfig/gpgme.pc"
