schemaVersion: 1
name: topgrade
description: Detect which tools you use and upgrade them all with one command
homepage: https://github.com/topgrade-rs/topgrade
license: GPL-3.0

archive:
  fetch:
    github_release:
      repo: topgrade-rs/topgrade
      # Rust target-triple assets: simple naming, so overrides alone suffice.
      assetName: 'topgrade-{{.Version}}-{{.Arch}}-{{.OS}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: apple-darwin
        linux: unknown-linux-gnu
        amd64: x86_64
        arm64: aarch64
  # topgrade publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  # The archive holds the bare `topgrade` binary at its root (no leading dir).
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/topgrade"
      to: "{{.InstallDir}}/bin/topgrade"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/topgrade", "--version"]
