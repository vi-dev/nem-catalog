schema: 2
name: buck2
description: Fast multi-language build system by Meta
homepage: https://buck2.build
license: Apache-2.0

versionDiscovery:
  github:
    repo: facebook/buck2
    filter: '^\d{4}-\d{2}-\d{2}$'

artifact:
  url: "https://github.com/facebook/buck2/releases/download/{{.Version}}/buck2-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.zst"

install:
  - extract: {strip: 0}
  - copy: {src: "buck2-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}", dst: "bin/buck2", mode: 0o755}

bins: ["bin"]

test:
  - run: buck2 --version 2>&1 | grep -q buck2

