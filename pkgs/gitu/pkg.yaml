schema: 3
name: gitu
description: TUI Git client inspired by Magit
homepage: https://github.com/altsem/gitu
license: MIT

platforms: [darwin/arm64, darwin/amd64, linux/amd64]

versionDiscovery:
  github:
    repo: altsem/gitu
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/altsem/gitu/releases/download/v{{.Version}}/gitu-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "gitu", dst: "bin/gitu", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.44.0
    sha256:
      darwin/arm64: "34bd3845beab9f2471a224c27493b2bdf98c7ce3ef7afa3e54b8fcbd230fd593"
      darwin/amd64: "603c2831454a1898bd49c184c33a20e2a59e431e74370fae660e5ae1b1d8fdb8"
      linux/amd64: "71c7f1178a67fb7ff02a6efd2ab3a16cca4ca9acc49bc9101726bc13fb6f297e"
  - version: 0.43.0
    sha256:
      darwin/arm64: "19fa3fbaf79736f07eefc1fd9b163a47f40111ba4f6fe256796006cc62cdd70f"
      darwin/amd64: "abf5ae48f991c3d8ae1dc98ba03bb8d5827b954ff56352008cf90b1c5eeac6d0"
      linux/amd64: "52c39e94e232d126d1ed37943de943b7e91df5f3749a2f86253e467d226d3741"

test:
  - run: gitu --version | grep -q "$NEM_VERSION"
