schema: 2
name: mongodb-atlas-cli
description: Manage MongoDB Atlas from the command line
homepage: https://www.mongodb.com/docs/atlas/cli/stable/
license: Apache-2.0

versionDiscovery:
  github:
    repo: mongodb/mongodb-atlas-cli
    filter: '^atlascli/v\d+\.\d+\.\d+$'
    prefix: "atlascli/v"

artifact:
  url: "https://github.com/mongodb/mongodb-atlas-cli/releases/download/atlascli/v{{.Version}}/mongodb-atlas-cli_{{.Version}}_{{if eq .OS \"darwin\"}}macos{{else}}linux{{end}}_{{replace .Arch \"amd64\" \"x86_64\"}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 1}
    platforms: ["darwin/arm64", "darwin/amd64"]
  - extract: {strip: 2}
    platforms: ["linux/arm64", "linux/amd64"]
  - copy: {src: "atlas", dst: "bin/atlas", mode: 0o755}

bins: ["bin"]

test:
  - run: atlas --version 2>&1 | grep -q "$NEM_VERSION"

