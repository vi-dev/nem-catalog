schema: 3

name: libxml2
description: XML parsing library and xmllint tool
homepage: https://gitlab.gnome.org/GNOME/libxml2
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

deps:
  - name: zlib
    kind: link
    compat: "1"
  - name: xz
    kind: link
    compat: "5"

bins: [bin]
libs: [lib]

# The url and discovery dir track the major.minor series; bumps update both.
versionDiscovery:
  http:
    url: https://download.gnome.org/sources/libxml2/2.15/
    filter: 'libxml2-(\d+\.\d+\.\d+)\.tar\.xz'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 2.15.4
    sourceSha256: "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"
  - version: 2.15.3
    sourceSha256: "78262a6e7ac170d6528ebfe2efccdf220191a5af6a6cd61ea4a9a9a5042c7a07"
  - version: 2.13.9
    sourceSha256: "a2c9ae7b770da34860050c309f903221c67830c86e4a7e760692b803df95143a"

build:
  deps:
    - pkgconf
    - name: zlib
      kind: link
      compat: "1"
    - name: xz
      kind: link
      compat: "5"
  source:
    url: 'https://download.gnome.org/sources/libxml2/2.15/libxml2-{{.Version}}.tar.xz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --libdir=/lib --disable-static --disable-dependency-tracking \
          --without-python --without-icu --with-zlib --with-lzma
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la

test:
  - run: xml2-config --version | grep -qx "$NEM_VERSION"
  - run: |
      set -e
      printf '<a><b/></a>' > ok.xml
      xmllint --noout ok.xml
      printf '<a>' > bad.xml
      ! xmllint --noout bad.xml 2>/dev/null
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/libxml2/libxml/parser.h" ]
      ls "$NEM_PREFIX"/lib/libxml2.* >/dev/null
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libxml-2.0.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <libxml/parser.h>
      #include <stdio.h>
      int main(void) {
        xmlDocPtr doc = xmlReadMemory("<a><b/></a>", 11, "probe.xml", NULL, 0);
        if (!doc) return 1;
        xmlFreeDoc(doc);
        puts(LIBXML_DOTTED_VERSION);
        return 0;
      }
      CEOF
      cc -I"$NEM_PREFIX/include/libxml2" $CPPFLAGS probe.c $LDFLAGS -lxml2 -o probe
      [ "$(./probe)" = "$NEM_VERSION" ]
