schema: 2
name: graphite-exporter
description: Prometheus exporter accepting Graphite protocol metrics
homepage: https://github.com/prometheus/graphite_exporter
license: Apache-2.0

versionDiscovery:
  github:
    repo: prometheus/graphite_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/prometheus/graphite_exporter/releases/download/v{{.Version}}/graphite_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "graphite_exporter", dst: "bin/graphite_exporter", mode: 0o755}
  - copy: {src: "getool", dst: "bin/getool", mode: 0o755}

bins: ["bin"]

test:
  - run: graphite_exporter --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.17.0
    sha256:
      darwin/arm64: "e59aae0aa4d3b42002bbd9023442866ad9f1beb9c33f28598539155c43947db7"
      darwin/amd64: "753fc6b0668aa8ca1c64020150dee49a51e95b3f87518d6b1f21b983cbc54680"
      linux/arm64: "95d49e7fa0117eb6a87d2e55409aa57e82ee6161154a6c63a9a3cfc603c3f435"
