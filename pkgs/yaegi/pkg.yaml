schema: 3
name: yaegi
description: Go interpreter and REPL
homepage: https://github.com/traefik/yaegi
license: Apache-2.0

versionDiscovery:
  github:
    repo: traefik/yaegi
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/traefik/yaegi/releases/download/v{{.Version}}/yaegi_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "yaegi", dst: "bin/yaegi", mode: 0o755}

bins: ["bin"]

