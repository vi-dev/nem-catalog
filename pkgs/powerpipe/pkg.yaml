schema: 2
name: powerpipe
description: Dashboards and benchmarks for DevOps
homepage: https://powerpipe.io
license: AGPL-3.0

versionDiscovery:
  github:
    repo: turbot/powerpipe
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/turbot/powerpipe/releases/download/v{{.Version}}/powerpipe.{{.OS}}.{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "powerpipe", dst: "bin/powerpipe", mode: 0o755}

bins: ["bin"]

test:
  - run: powerpipe --version | grep -q "$NEM_VERSION"

versions:
