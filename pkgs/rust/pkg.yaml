schema: 3

name: rust
description: Rust toolchain — rustc, cargo, and the standard library
homepage: https://www.rust-lang.org
license: Apache-2.0 OR MIT

platforms: [darwin/arm64, darwin/amd64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: rust-lang/rust
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://static.rust-lang.org/dist/rust-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

# The dist tarball holds per-component trees; rustc's rustlib has only bin/
# and rust-std's only lib/, so one move assembles the sysroot.
install:
  - extract: {strip: 1}
  - move:
      src: "rust-std-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}/lib/rustlib/{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}/lib"
      dst: "rustc/lib/rustlib/{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}/lib"

bins: ["rustc/bin", "cargo/bin"]

