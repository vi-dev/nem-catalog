schema: 2
name: sbt
description: Build tool for Scala and Java
homepage: https://www.scala-sbt.org
license: Apache-2.0

deps:
  - jdk25

versionDiscovery:
  github:
    repo: sbt/sbt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sbt/sbt/releases/download/v{{.Version}}/sbt-{{.Version}}.tgz"

install:
  - extract: {strip: 1}

bins: ["bin"]

