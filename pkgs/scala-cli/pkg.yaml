schema: 2
name: scala-cli
description: Command-line tool to interact with the Scala language
homepage: https://scala-cli.virtuslab.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: VirtusLab/scala-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/VirtusLab/scala-cli/releases/download/v{{.Version}}/scala-cli-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"pc-linux\"}}.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "scala-cli-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"pc-linux\"}}", dst: "bin/scala-cli", mode: 0o755}

bins: ["bin"]

