schemaVersion: 1
name: grex
description: Generate regular expressions from user-provided test cases
homepage: https://github.com/pemistahl/grex
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: pemistahl/grex
      # Rust target triples: darwin is apple-darwin, linux is musl on both arches.
      assetName: 'grex-{{.Version}}-{{.Arch}}-{{if eq .OS "darwin"}}apple-darwin{{else}}unknown-linux-musl{{end}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        amd64: x86_64
        arm64: aarch64
  # grex publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/grex"
      to: "{{.InstallDir}}/bin/grex"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/grex", "--version"]
