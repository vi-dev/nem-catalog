      linux/arm64: "8dc0b6b193bcc0a1f151efad3e033a3d934ddbba94744d676c60c9d3200e45f5"
      linux/amd64: "2e7d0b9b44c6391b8cad90a87d1b3be5ea2a52dd9c5562bd05fe2183d9e5b714"
  - version: 0.9.2
    sha256:
      darwin/arm64: "c11295888ab2478633e91ba82a9552da3d1ca7e946f9b7f1bcbeb81605ae5b45"
      darwin/amd64: "4f1696247d5b18067a12ada4c043f0a128ba4d67bce665ce4bf2cac1a357e14c"
      linux/arm64: "776d8d201bba9724597534de6e0d7ad3c60913fd8e23caafeff07918009df44d"
