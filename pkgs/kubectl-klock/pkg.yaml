schema: 3
name: kubectl-klock
description: Watch Kubernetes resources in a live table
homepage: https://github.com/applejag/kubectl-klock
license: GPL-3.0-only

versionDiscovery:
  github:
    repo: applejag/kubectl-klock
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/applejag/kubectl-klock/releases/download/v{{.Version}}/kubectl-klock_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-klock", dst: "bin/kubectl-klock", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.9.3
    sha256:
      darwin/arm64: "0ad3da052ac415940397a8b036c2cf06ea745e7ae14925d22590d9736ae8c1a3"
