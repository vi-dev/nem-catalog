schema: 3
name: kn
description: Knative CLI
homepage: https://knative.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: knative/client
    filter: '^knative-v\d+\.\d+\.\d+$'
    prefix: "knative-v"

artifact:
  url: "https://github.com/knative/client/releases/download/knative-v{{.Version}}/kn-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kn", mode: 0o755}

bins: ["bin"]

test:
  - run: kn version | grep -q "$NEM_VERSION"

