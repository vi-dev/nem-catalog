schema: 2
name: docker-cli
description: Docker command-line client
homepage: https://www.docker.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: docker/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://download.docker.com/{{if eq .OS \"darwin\"}}mac{{else}}linux{{end}}/static/stable/{{replace (replace .Arch \"amd64\" \"x86_64\") \"arm64\" \"aarch64\"}}/docker-{{.Version}}.tgz"

install:
  - extract: {strip: 0}
  # the linux bundle also ships the engine; only the CLI is packaged
  - copy: {src: "docker/docker", dst: "bin/docker", mode: 0o755}

bins: ["bin"]

