schema: 2
name: bearer
description: Static code security scanner for risks and privacy issues
homepage: https://docs.bearer.com
license: Elastic-2.0

versionDiscovery:
  github:
    repo: Bearer/bearer
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Bearer/bearer/releases/download/v{{.Version}}/bearer_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "bearer", dst: "bin/bearer", mode: 0o755}

bins: ["bin"]

test:
  - run: bearer version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 2.1.1
    sha256:
      darwin/arm64: "96fb52d993111c633e7b8a906b7abbba4f0745b56bc0e28894fd09123e8d6c32"
      darwin/amd64: "6aec6ce257bc45bb6305b5f0f2d3bcfd64bde5e3cbf159f36ad6e5c18b0a9dc5"
      linux/arm64: "ef05756d374aeb179534e1bb441cd2c3bd56b8fcf21c693d71078859c6721916"
      linux/amd64: "6b79d315577fea8305dfe08577bea6ad53852a929cd24de9211d39750a194bbb"
