schema: 3
name: bearer
description: Static code security scanner for risks and privacy issues
homepage: https://docs.bearer.com
license: Elastic-2.0

versionDiscovery:
  github:
    repo: Bearer/bearer
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Bearer/bearer/releases/download/v{{.Version}}/bearer_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "bearer", dst: "bin/bearer", mode: 0o755}

bins: ["bin"]

test:
  - run: bearer version 2>&1 | grep -q "$NEM_VERSION"

