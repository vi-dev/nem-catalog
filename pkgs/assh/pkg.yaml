schema: 2
name: assh
description: Advanced SSH config manager and gateway
homepage: https://manfred.life/assh
license: MIT

versionDiscovery:
  github:
    repo: moul/assh
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/moul/assh/releases/download/v{{.Version}}/assh_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "assh", dst: "bin/assh", mode: 0o755}

bins: ["bin"]

test:
  - run: assh --version 2>&1 | grep -q "$NEM_VERSION"

versions:
