schema: 2
name: tailwindcss
description: Standalone CLI for the Tailwind CSS framework
homepage: https://tailwindcss.com
license: MIT

versionDiscovery:
  github:
    repo: tailwindlabs/tailwindcss
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/tailwindlabs/tailwindcss/releases/download/v{{.Version}}/tailwindcss-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/tailwindcss", mode: 0o755}

bins: ["bin"]

test:
  - run: tailwindcss --help 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 4.3.3
    sha256:
      darwin/arm64: "cdf646702987a743464dff4d9c60fd4480d1c1e73dd819a9a67f1078815dce9d"
      darwin/amd64: "7922e0953f2110c05976e3bf58f14e643d90427575e766b7d433f5f80cbee7e1"
      linux/arm64: "55fd0b241214eff3de1e8ee4f22796662f2d2e7a49bcfca7477cfd0bac398195"
      linux/amd64: "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a"
