schema: 3
name: tailwindcss
description: Standalone CLI for the Tailwind CSS framework
homepage: https://tailwindcss.com
license: MIT

versionDiscovery:
  github:
    repo: tailwindlabs/tailwindcss
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/tailwindlabs/tailwindcss/releases/download/v{{.Version}}/tailwindcss-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/tailwindcss", mode: 0o755}

bins: ["bin"]

test:
  - run: tailwindcss --help 2>&1 | grep -q "$NEM_VERSION"

