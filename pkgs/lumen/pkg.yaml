schema: 2
name: lumen
description: Git diff viewer and AI commit generator
homepage: https://github.com/jnsahaj/lumen
license: MIT

versionDiscovery:
  github:
    repo: jnsahaj/lumen
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/jnsahaj/lumen/releases/download/v{{.Version}}/lumen-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "lumen", dst: "bin/lumen", mode: 0o755}

bins: ["bin"]

test:
  - run: lumen --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 2.32.0
    sha256:
      darwin/arm64: "45377ec96f28f9b9c1831cb52fd5d21e3f8bc58c2f1dd8abb79ba44d3ef33537"
