schema: 2
name: kube-burner
description: Kubernetes performance and scale test orchestration
homepage: https://kube-burner.github.io/kube-burner/
license: Apache-2.0

versionDiscovery:
  github:
    repo: kube-burner/kube-burner
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kube-burner/kube-burner/releases/download/v{{.Version}}/kube-burner-V{{.Version}}-{{.OS}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kube-burner", dst: "bin/kube-burner", mode: 0o755}

bins: ["bin"]

test:
  - run: kube-burner version | grep -q "$NEM_VERSION"

versions:
