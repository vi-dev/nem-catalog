schema: 3
name: sql-exporter
description: Database-agnostic SQL exporter for Prometheus
homepage: https://github.com/burningalchemist/sql_exporter
license: MIT

versionDiscovery:
  github:
    repo: burningalchemist/sql_exporter
    filter: '^\d+\.\d+\.\d+$'
    prefix: ""

artifact:
  url: "https://github.com/burningalchemist/sql_exporter/releases/download/{{.Version}}/sql_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "sql_exporter", dst: "bin/sql_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: sql_exporter --version 2>&1 | grep -q "$NEM_VERSION"

