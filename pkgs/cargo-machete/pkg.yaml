schema: 2
name: cargo-machete
description: Remove unused Rust dependencies
homepage: https://github.com/bnjbvr/cargo-machete
license: MIT

versionDiscovery:
  github:
    repo: bnjbvr/cargo-machete
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/bnjbvr/cargo-machete/releases/download/v{{.Version}}/cargo-machete-v{{.Version}}-{{if eq .OS \"darwin\"}}{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-apple-darwin{{else}}{{if eq .Arch \"arm64\"}}aarch64-unknown-linux-gnu{{else}}x86_64-unknown-linux-musl{{end}}{{end}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-machete", dst: "bin/cargo-machete", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-machete --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.9.2
    sha256:
      darwin/arm64: "63e28fee386d82d33f2d12406c857f98e2d4697f3f7df7f71f34dff07fca0fde"
      darwin/amd64: "3e8cb936c9b820f84d047a2b5be8b229b2be67bf2467014885376a6faffdcac3"
      linux/arm64: "6f96c3e6026a5bdd241b6ae600c6fb86c9197c6e189a894f91371baa01fd10f5"
      linux/amd64: "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9"
