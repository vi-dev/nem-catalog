schema: 2
name: postgresql
description: The PostgreSQL database server and client tools
homepage: https://www.postgresql.org
license: PostgreSQL

versionDiscovery:
  github:
    repo: theseus-rs/postgresql-binaries
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/theseus-rs/postgresql-binaries/releases/download/{{.Version}}/postgresql-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["bin"]

test:
  - run: psql --version | grep -q "${NEM_VERSION%.*}"
  - run: initdb --version | grep -q "${NEM_VERSION%.*}"

versions:
  - version: 18.6.0
    sha256:
      darwin/arm64: "a257bcdb8aa3301a13d6a5bcec48f8c9517045b7cbae71e50788b2615539e95b"
      darwin/amd64: "f8918fbe747e0d79bda58ad8f8afcf23ac384b847ff3af18856f0825ba54b031"
