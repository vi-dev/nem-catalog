schema: 2
name: moon
description: Build system and monorepo management tool
homepage: https://moonrepo.dev
license: MIT

versionDiscovery:
  github:
    repo: moonrepo/moon
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/moonrepo/moon/releases/download/v{{.Version}}/moon_cli-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "moon", dst: "bin/moon", mode: 0o755}
  - copy: {src: "moonx", dst: "bin/moonx", mode: 0o755}

bins: ["bin"]

