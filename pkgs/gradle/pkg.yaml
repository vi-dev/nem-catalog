schemaVersion: 1
name: gradle
description: Gradle build automation tool for JVM projects
homepage: https://gradle.org
license: Apache-2.0

dependsOn:
  - temurin21

archive:
  fetch:
    http:
      url: 'https://services.gradle.org/distributions/gradle-{{.Version}}-bin.zip'
      versionsFrom:
        github_tag:
          repo: gradle/gradle
          tagFilter: '^v(\d+\.\d+\.\d+)$'
  verify:
    checksumURL: 'https://services.gradle.org/distributions/gradle-{{.Version}}-bin.zip.sha256'

versions:
  - version: 9.6.1

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}"
      to: "{{.InstallDir}}"

test:
  - run:
      # gradle writes to GRADLE_USER_HOME (default ~/.gradle); point it at a dir
      # under the writable test cwd so the smoke test works where HOME is unset.
      cmd: ["{{.InstallDir}}/bin/gradle", "--version"]
      env:
        GRADLE_USER_HOME: nem-gradle-home
