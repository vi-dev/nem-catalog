schema: 2
name: tfcmt
description: Post Terraform plan and apply results as pull request comments
homepage: https://suzuki-shunsuke.github.io/tfcmt/
license: MIT

versionDiscovery:
  github:
    repo: suzuki-shunsuke/tfcmt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/suzuki-shunsuke/tfcmt/releases/download/v{{.Version}}/tfcmt_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tfcmt", dst: "bin/tfcmt", mode: 0o755}

bins: ["bin"]

test:
  - run: tfcmt --version | grep -q "$NEM_VERSION"

versions:
