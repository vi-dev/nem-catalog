schema: 2
name: doppler
description: Doppler secrets management CLI
homepage: https://www.doppler.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: DopplerHQ/cli
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/DopplerHQ/cli/releases/download/{{.Version}}/doppler_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "doppler", dst: "bin/doppler", mode: 0o755}

bins: ["bin"]

