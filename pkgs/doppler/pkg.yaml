schema: 2
name: doppler
description: Doppler secrets management CLI
homepage: https://www.doppler.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: DopplerHQ/cli
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/DopplerHQ/cli/releases/download/{{.Version}}/doppler_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "doppler", dst: "bin/doppler", mode: 0o755}

bins: ["bin"]

versions:
  - version: 3.76.5
    sha256:
      darwin/arm64: "91c4bab5bbd3b630dea8c96e9c0a39cf9e59bf7772f34ab979bea66ccee9560a"
      darwin/amd64: "0a3c51cefbeb0d15a4ee34925366f9019efe9cb0a330892df8bd103348a4fc81"
      linux/arm64: "567f051c4c334b79a37ee44c9373671c451dd8a4945ed49288a8f3fd0b73ec89"
      linux/amd64: "1b2f412d984920d665daf233ab6c15b364df9339b5c5b5224d5e8ee4e0a70154"

test:
  - run: doppler --version | grep -q "$NEM_VERSION"
