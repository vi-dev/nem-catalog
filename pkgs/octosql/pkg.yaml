schemaVersion: 1
name: octosql
description: SQL query engine for files, databases, and streaming data sources
homepage: https://github.com/cube2222/octosql
license: MPL-2.0

archive:
  fetch:
    github_release:
      repo: cube2222/octosql
      assetName: 'octosql_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'octosql_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # Archive roots at the octosql binary itself (plus LICENSE/README); no leading dir.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/octosql"
      to: "{{.InstallDir}}/bin/octosql"

test:
  - run:
      # octosql creates ~/.octosql on startup; HOME is read-only in the
      # write-confined smoke-test sandbox, so point it at a writable dir under the
      # scratch cwd.
      script: |
        export HOME="$PWD/nem-octosql-home"
        mkdir -p "$HOME"
        "$NEM_INSTALL_DIR/bin/octosql" --version
