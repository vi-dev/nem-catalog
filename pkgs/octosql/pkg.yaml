schema: 2
name: octosql
description: Query multiple data sources with SQL from the command line
homepage: https://github.com/cube2222/octosql
license: MPL-2.0

versionDiscovery:
  github:
    repo: cube2222/octosql
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cube2222/octosql/releases/download/v{{.Version}}/octosql_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "octosql", dst: "bin/octosql", mode: 0o755}

bins: ["bin"]

