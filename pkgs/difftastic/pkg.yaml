schema: 3
name: difftastic
description: Structural diff that understands syntax (difft)
homepage: https://difftastic.wilfred.me.uk
license: MIT

versionDiscovery:
  github:
    repo: Wilfred/difftastic
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/Wilfred/difftastic/releases/download/{{.Version}}/difft-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "difft", dst: "bin/difft", mode: 0o755}

bins: ["bin"]

