schema: 2
name: tfmigrate
description: Terraform and OpenTofu state migration tool for GitOps
homepage: https://github.com/minamijoyo/tfmigrate
license: MIT

versionDiscovery:
  github:
    repo: minamijoyo/tfmigrate
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/minamijoyo/tfmigrate/releases/download/v{{.Version}}/tfmigrate_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tfmigrate", dst: "bin/tfmigrate", mode: 0o755}

bins: ["bin"]

test:
  - run: tfmigrate --version | grep -q "$NEM_VERSION"

versions:
  - version: 0.4.5
    sha256:
      darwin/arm64: "8ee985ee9443940d1702d9069cbd81b05d8a4c039bf5aa2eaf49da04e790d263"
