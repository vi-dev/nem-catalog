schema: 3
name: virtctl
description: KubeVirt CLI for managing virtual machines on Kubernetes
homepage: https://kubevirt.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubevirt/kubevirt
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubevirt/kubevirt/releases/download/v{{.Version}}/virtctl-v{{.Version}}-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/virtctl", mode: 0o755}

bins: ["bin"]

test:
  - run: virtctl version --client | grep -q "$NEM_VERSION"

