schemaVersion: 1
name: osv-scanner
description: Vulnerability scanner that maps dependencies to the OSV database
homepage: https://google.github.io/osv-scanner
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: google/osv-scanner
      # Assets are raw, uncompressed binaries: osv-scanner_<os>_<arch>.
      assetName: 'osv-scanner_{{.OS}}_{{.Arch}}'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'osv-scanner_SHA256SUMS'

install:
  # The asset is the executable itself; no archive to extract.
  - copy:
      from: "{{.Archive}}"
      to: "{{.InstallDir}}/bin/osv-scanner"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/osv-scanner", "--version"]
