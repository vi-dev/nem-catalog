schema: 2
name: op
description: 1Password command-line tool
homepage: https://developer.1password.com/docs/cli
license: LicenseRef-1Password-Commercial

versionDiscovery:
  http:
    url: https://app-updates.agilebits.com/product_history/CLI2
    filter: 'op_linux_amd64_v(\d+\.\d+\.\d+)\.zip'

artifact:
  url: "https://cache.agilebits.com/dist/1P/op2/pkg/v{{.Version}}/op_{{.OS}}_{{.Arch}}_v{{.Version}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "op", dst: "bin/op", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.39.0
    sha256:
      darwin/arm64: "05391d3388a0c0b4f602691bedc1ab368541c487b6f14d2e3399743b4682af67"
      darwin/amd64: "753fbf56b00996426edbb8439d2f3c0be9227b9557cdff468fb144cd3621aa6e"
      linux/arm64: "829baeff1c07e055cfa132031b1d9f2282ccdf5076258e482caf2fda70aea5d0"
      linux/amd64: "6fba7f376b6c6dec49f41b06408930a43ad064cce103c6a2ce5b3d0413a86434"

test:
  - run: op --version | grep -q "$NEM_VERSION"
