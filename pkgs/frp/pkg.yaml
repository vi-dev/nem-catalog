schema: 3
name: frp
description: Reverse proxy exposing local servers behind NAT or a firewall
homepage: https://github.com/fatedier/frp
license: Apache-2.0

platforms: [linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: fatedier/frp
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/fatedier/frp/releases/download/v{{.Version}}/frp_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "frpc", dst: "bin/frpc", mode: 0o755}
  - copy: {src: "frps", dst: "bin/frps", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.71.1
    sha256:
      linux/arm64: "8edf590b0c396fa42f9c147121a76af83cfc2002b08f5aef0ea1008c43482019"
      linux/amd64: "1d9875210972a5d1a62b2dc4c48df45ab0af05d3ca1b5e494a014428259df803"
  - version: 0.71.0
    sha256:
      linux/arm64: "f33c293c275d8fc68c654b6fba8f10b2551d6463d09a9fc9cffb7227eae82266"
      linux/amd64: "84f27e39f11169f7adcef8e8b70c9329de17747b1f14dad9fb95eef5682ea716"

test:
  - run: frpc --version | grep -q "$NEM_VERSION"
  - run: frps --version | grep -q "$NEM_VERSION"
