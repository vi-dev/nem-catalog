schema: 2
name: clickhouse
description: Fast open-source OLAP database (single-binary CLI and server)
homepage: https://clickhouse.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: ClickHouse/ClickHouse
    filter: '^v\d+\.\d+\.\d+\.\d+-stable$'
    prefix: "v"
    suffix: "-stable"

artifact:
  url: "https://github.com/ClickHouse/ClickHouse/releases/download/v{{.Version}}-stable/{{if eq .OS \"darwin\"}}clickhouse-macos{{if eq .Arch \"arm64\"}}-aarch64{{end}}{{else}}clickhouse-common-static-{{.Version}}-{{.Arch}}.tgz{{end}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/clickhouse", mode: 0o755}
    platforms: ["darwin/arm64", "darwin/amd64"]
  - extract: {strip: 1}
    platforms: ["linux/arm64", "linux/amd64"]
  - copy: {src: "usr/bin/clickhouse", dst: "bin/clickhouse", mode: 0o755}
    platforms: ["linux/arm64", "linux/amd64"]

bins: ["bin"]

