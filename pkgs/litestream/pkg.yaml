schema: 3
name: litestream
description: Streaming replication for SQLite
homepage: https://litestream.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: benbjohnson/litestream
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/benbjohnson/litestream/releases/download/v{{.Version}}/litestream-{{.Version}}-{{.OS}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "litestream", dst: "bin/litestream", mode: 0o755}

bins: ["bin"]

