schema: 3
name: databricks
description: Databricks CLI
homepage: https://github.com/databricks/cli
license: LicenseRef-Databricks

versionDiscovery:
  github:
    repo: databricks/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/databricks/cli/releases/download/v{{.Version}}/databricks_cli_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "databricks", dst: "bin/databricks", mode: 0o755}

bins: ["bin"]

test:
  - run: databricks --version 2>&1 | grep -q "$NEM_VERSION"

