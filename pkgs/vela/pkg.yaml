schemaVersion: 1
name: vela
description: KubeVela CLI for application delivery on Kubernetes
homepage: https://kubevela.io
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: kubevela/kubevela
      # Assets keep the leading v in the version: vela-v1.10.9-darwin-arm64.tar.gz
      assetName: 'vela-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'sha256sums.txt'

install:
  # Archive roots at <os>-<arch>/ holding vela, LICENSE, and README.md.
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/vela"
      to: "{{.InstallDir}}/bin/vela"

test:
  - run:
      # vela aborts with "InitDir err $HOME is not defined" when HOME is unset;
      # point it at a relative dir under the writable scratch cwd.
      cmd: ["{{.InstallDir}}/bin/vela", "version"]
      env:
        HOME: nem-vela-home
