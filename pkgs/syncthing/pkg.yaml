schema: 2
name: syncthing
description: Continuous file synchronization between devices
homepage: https://syncthing.net
license: MPL-2.0

versionDiscovery:
  github:
    repo: syncthing/syncthing
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/syncthing/syncthing/releases/download/v{{.Version}}/syncthing-{{if eq .OS \"darwin\"}}macos{{else}}linux{{end}}-{{.Arch}}-v{{.Version}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 1}
  - copy: {src: "syncthing", dst: "bin/syncthing", mode: 0o755}

bins: ["bin"]

