schemaVersion: 1
name: caddy
description: Fast and extensible web server with automatic HTTPS
homepage: https://caddyserver.com
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: caddyserver/caddy
      # macOS assets are named `mac`, not `darwin`; Linux keeps `linux`.
      assetName: 'caddy_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: mac
  # goreleaser checksums file lists exact asset filenames; hashes are SHA-512.
  verify:
    checksumGitHubAsset: 'caddy_{{.Version | trimPrefix "v"}}_checksums.txt'
    algorithm: sha512

install:
  # Archive roots at LICENSE/README.md/caddy — the binary sits at the top, no strip.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/caddy"
      to: "{{.InstallDir}}/bin/caddy"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/caddy", "version"]
