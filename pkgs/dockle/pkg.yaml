schemaVersion: 1
name: dockle
description: Container image linter for security, helping build best-practice Docker images
homepage: https://github.com/goodwithtech/dockle
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: goodwithtech/dockle
      assetName: 'dockle_{{.Version | trimPrefix "v"}}_{{.OS}}-{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: macOS
        linux: Linux
        amd64: 64bit
        arm64: ARM64
  verify:
    checksumGitHubAsset: 'dockle_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # Archive roots at LICENSE + README.md + the dockle binary (no leading dir).
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/dockle"
      to: "{{.InstallDir}}/bin/dockle"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/dockle", "--version"]
