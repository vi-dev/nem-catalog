schema: 3
name: pandoc
description: Universal markup document converter
homepage: https://pandoc.org
license: GPL-2.0

versionDiscovery:
  github:
    repo: jgm/pandoc
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/jgm/pandoc/releases/download/{{.Version}}/pandoc-{{.Version}}-{{if eq .OS \"darwin\"}}{{replace .Arch \"amd64\" \"x86_64\"}}-macOS.zip{{else}}linux-{{.Arch}}.tar.gz{{end}}"

