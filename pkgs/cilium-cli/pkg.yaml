schema: 2
name: cilium-cli
description: CLI for installing and managing Cilium on Kubernetes
homepage: https://github.com/cilium/cilium-cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: cilium/cilium-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cilium/cilium-cli/releases/download/v{{.Version}}/cilium-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cilium", dst: "bin/cilium", mode: 0o755}

bins: ["bin"]

