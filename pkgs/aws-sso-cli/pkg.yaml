schema: 2
name: aws-sso-cli
description: AWS Identity Center credentials for the CLI and console
homepage: https://synfinatic.github.io/aws-sso-cli/latest/
license: GPL-3.0

versionDiscovery:
  github:
    repo: synfinatic/aws-sso-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/synfinatic/aws-sso-cli/releases/download/v{{.Version}}/aws-sso-{{.Version}}-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/aws-sso", mode: 0o755}

bins: ["bin"]

test:
  - run: aws-sso version 2>&1 | grep -q "$NEM_VERSION"

versions:
