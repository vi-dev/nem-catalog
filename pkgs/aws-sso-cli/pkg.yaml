      linux/arm64: "c1c336a75e2ca82631a2a32b09c185b1d961d8efcaf949fd82baf4f82dd82fc3"
      linux/amd64: "0347a91f65680db4ab5f6bde85afc4265e677389581ac920bb2536bd05a6f5de"
