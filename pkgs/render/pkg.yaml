schema: 2
name: render
description: Render CLI
homepage: https://render.com/docs/cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: render-oss/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/render-oss/cli/releases/download/v{{.Version}}/cli_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "cli_v{{.Version}}", dst: "bin/render", mode: 0o755}

bins: ["bin"]

test:
  - run: render --version 2>&1 | grep -q "$NEM_VERSION"

versions:
