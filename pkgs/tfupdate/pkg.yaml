schema: 3
name: tfupdate
description: Update version constraints in Terraform and OpenTofu configurations
homepage: https://github.com/minamijoyo/tfupdate
license: MIT

versionDiscovery:
  github:
    repo: minamijoyo/tfupdate
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/minamijoyo/tfupdate/releases/download/v{{.Version}}/tfupdate_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tfupdate", dst: "bin/tfupdate", mode: 0o755}

bins: ["bin"]

test:
  - run: tfupdate --version | grep -q "$NEM_VERSION"

