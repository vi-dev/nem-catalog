schema: 2
name: tf-summarize
description: Print a summary of a Terraform plan
homepage: https://github.com/dineshba/tf-summarize
license: MIT

versionDiscovery:
  github:
    repo: dineshba/tf-summarize
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dineshba/tf-summarize/releases/download/v{{.Version}}/tf-summarize_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tf-summarize", dst: "bin/tf-summarize", mode: 0o755}

bins: ["bin"]

test:
  - run: tf-summarize -v | grep -q "$NEM_VERSION"

versions:
  - version: 0.3.20
    sha256:
      darwin/arm64: "5ed7dd89adf37c93daec96d8c0ea9a05c1d8d27d1be87c4a2ceab69cbf81ca49"
