schemaVersion: 1
name: typst
description: Markup-based typesetting system for the sciences
homepage: https://typst.app
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: typst/typst
      # Rust target-triple naming: aarch64/x86_64 + apple-darwin/unknown-linux-musl.
      assetName: 'typst-{{.Arch}}-{{.OS}}.tar.xz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        amd64: x86_64
        arm64: aarch64
        darwin: apple-darwin
        linux: unknown-linux-musl
  # typst publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/typst"
      to: "{{.InstallDir}}/bin/typst"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/typst", "--version"]
