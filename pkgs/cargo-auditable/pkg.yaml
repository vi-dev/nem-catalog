schema: 3
name: cargo-auditable
description: Make production Rust binaries auditable
homepage: https://github.com/rust-secure-code/cargo-auditable
license: Apache-2.0

versionDiscovery:
  github:
    repo: rust-secure-code/cargo-auditable
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/rust-secure-code/cargo-auditable/releases/download/v{{.Version}}/cargo-auditable-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-auditable", dst: "bin/cargo-auditable", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-auditable 2>&1 | grep -q Cargo

