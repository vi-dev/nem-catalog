schema: 2
name: ghq
description: Remote repository management and local clone organizer
homepage: https://github.com/x-motemen/ghq
license: MIT

versionDiscovery:
  github:
    repo: x-motemen/ghq
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/x-motemen/ghq/releases/download/v{{.Version}}/ghq_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "ghq", dst: "bin/ghq", mode: 0o755}

bins: ["bin"]

