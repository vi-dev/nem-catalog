schema: 3
name: google-java-format
description: Reformats Java source to Google Java Style
homepage: https://github.com/google/google-java-format
license: Apache-2.0

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: google/google-java-format
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/google/google-java-format/releases/download/v{{.Version}}/google-java-format_{{.OS}}-{{replace .Arch \"amd64\" \"x86-64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/google-java-format", mode: 0o755}

bins: ["bin"]

