schema: 2
name: mysqldef
description: Idempotent schema management for MySQL
homepage: https://github.com/sqldef/sqldef
license: MIT

versionDiscovery:
  github:
    repo: sqldef/sqldef
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sqldef/sqldef/releases/download/v{{.Version}}/mysqldef_{{.OS}}_{{.Arch}}.{{replace (replace .OS \"darwin\" \"zip\") \"linux\" \"tar.gz\"}}"

install:
  - extract: {strip: 0}
  - copy: {src: "mysqldef", dst: "bin/mysqldef", mode: 0o755}

bins: ["bin"]

test:
  - run: mysqldef --version | grep -q "$NEM_VERSION"

