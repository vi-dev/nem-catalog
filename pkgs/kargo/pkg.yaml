schema: 2
name: kargo
description: Multi-stage application lifecycle orchestration for GitOps
homepage: https://kargo.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: akuity/kargo
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/akuity/kargo/releases/download/v{{.Version}}/kargo-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kargo", mode: 0o755}

bins: ["bin"]

test:
  - run: kargo version --client | grep -q "$NEM_VERSION"

versions:
