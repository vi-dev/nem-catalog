schema: 3
name: dust
description: More intuitive du, showing disk usage as a tree
homepage: https://github.com/bootandy/dust
license: Apache-2.0

versionDiscovery:
  github:
    repo: bootandy/dust
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/bootandy/dust/releases/download/v{{.Version}}/dust-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "dust", dst: "bin/dust", mode: 0o755}

bins: ["bin"]

