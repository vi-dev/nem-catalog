schemaVersion: 1
name: timoni
description: Package manager for Kubernetes, powered by CUE
homepage: https://timoni.sh
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: stefanprodan/timoni
      assetName: 'timoni_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'timoni_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # The tarball roots the binary alongside LICENSE, no leading dir.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/timoni"
      to: "{{.InstallDir}}/bin/timoni"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/timoni", "version"]
