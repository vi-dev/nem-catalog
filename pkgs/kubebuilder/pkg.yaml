schema: 2
name: kubebuilder
description: SDK for building Kubernetes APIs and controllers
homepage: https://kubebuilder.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubernetes-sigs/kubebuilder
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v{{.Version}}/kubebuilder_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kubebuilder", mode: 0o755}

bins: ["bin"]

