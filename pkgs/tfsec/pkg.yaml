schemaVersion: 1
name: tfsec
description: Static analysis security scanner for Terraform code
homepage: https://github.com/aquasecurity/tfsec
license: MIT

archive:
  fetch:
    github_release:
      repo: aquasecurity/tfsec
      assetName: 'tfsec_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'tfsec_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # Tarball roots at the top level (tfsec, tfsec-checkgen, LICENSE, README.md).
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/tfsec"
      to: "{{.InstallDir}}/bin/tfsec"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/tfsec", "--version"]
