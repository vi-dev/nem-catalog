      linux/arm64: "ecd737fcca418026514ed45a6ad06ecc2e02997e1b75ed6e7100ac8cc69eee54"
      linux/amd64: "d99098c61002f9b8a5337977d527dbe8ee29453f2a62c531038ea2749ea738eb"
  - version: 0.3.3
    sha256:
      darwin/arm64: "d05b51825604d608da8757e549a1f5322549a350f8336c593429f3f2cd507927"
      darwin/amd64: "39934f6a8d6a0413c52324ccdbd3a0867371785b6c066005ea063a78279487ef"
