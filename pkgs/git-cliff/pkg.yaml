schemaVersion: 1
name: git-cliff
description: Highly customizable changelog generator following Conventional Commits
homepage: https://git-cliff.org
license: MIT OR Apache-2.0

archive:
  fetch:
    github_release:
      repo: orhun/git-cliff
      # Rust target triples: apple-darwin on macOS, statically-linked
      # unknown-linux-musl on Linux (both arches ship a musl build).
      assetName: 'git-cliff-{{.Version | trimPrefix "v"}}-{{.Arch}}-{{if eq .OS "darwin"}}apple-darwin{{else}}unknown-linux-musl{{end}}.tar.gz'
      templateOverrides:
        amd64: x86_64
        arm64: aarch64
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    # Releases publish a per-asset sha512sum file alongside each tarball.
    algorithm: sha512
    checksumGitHubAsset: 'git-cliff-{{.Version | trimPrefix "v"}}-{{.Arch}}-{{if eq .OS "darwin"}}apple-darwin{{else}}unknown-linux-musl{{end}}.tar.gz.sha512'

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/git-cliff"
      to: "{{.InstallDir}}/bin/git-cliff"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/git-cliff", "--version"]
