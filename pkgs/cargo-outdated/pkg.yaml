schema: 2
name: cargo-outdated
description: Show out-of-date Rust dependencies
homepage: https://github.com/kbknapp/cargo-outdated
license: MIT

versionDiscovery:
  github:
    repo: kbknapp/cargo-outdated
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kbknapp/cargo-outdated/releases/download/v{{.Version}}/cargo-outdated-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cargo-outdated", dst: "bin/cargo-outdated", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-outdated outdated --version 2>&1 | grep -q "$NEM_VERSION"

versions:
