schemaVersion: 1
name: vale
description: Syntax-aware linter for prose built with speed and extensibility in mind
homepage: https://vale.sh
license: MIT

archive:
  fetch:
    github_release:
      # errata-ai/vale was renamed to vale-cli/vale; use the canonical name.
      repo: vale-cli/vale
      # Assets: vale_<ver>_<OS>_<arch>.tar.gz with OS Linux/macOS and arch 64-bit/arm64.
      assetName: 'vale_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: macOS
        linux: Linux
        amd64: 64-bit
  verify:
    checksumGitHubAsset: 'vale_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # Tarball roots the vale binary directly (alongside LICENSE + README.md),
  # so no stripComponents.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/vale"
      to: "{{.InstallDir}}/bin/vale"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/vale", "--version"]
