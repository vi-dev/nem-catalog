schema: 3
name: ollama
description: Run large language models locally
homepage: https://ollama.com
license: MIT

versionDiscovery:
  github:
    repo: ollama/ollama
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# darwin ships one universal archive with no arch in its name; linux ships
# per-arch zstd tarballs.
artifact:
  url: "https://github.com/ollama/ollama/releases/download/v{{.Version}}/ollama-{{replace (replace (replace .OS \"darwin\" \"darwin.tgz\") \"linux\" \"linux-ARCH.tar.zst\") \"ARCH\" .Arch}}"

# The binary loads its GPU/CPU runner libraries from paths relative to itself,
# so the upstream layout is kept as-is: darwin puts everything at the root,
# linux uses bin/ plus lib/ollama.
install:
  - extract: {strip: 0}

bins: ["bin", "."]

