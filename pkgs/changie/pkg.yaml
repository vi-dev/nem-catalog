schema: 2
name: changie
description: Automated changelog tool for preparing releases
homepage: https://changie.dev
license: MIT

versionDiscovery:
  github:
    repo: miniscruff/changie
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/miniscruff/changie/releases/download/v{{.Version}}/changie_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "changie", dst: "bin/changie", mode: 0o755}

bins: ["bin"]

test:
  - run: changie --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 1.26.0
    sha256:
      darwin/arm64: "ba1a14e0eb220fb9c7d4dc90af462e7f7178a313cdb1299a17aafbb37838a458"
