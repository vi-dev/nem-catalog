schema: 2
name: hcledit
description: Command line editor for HCL
homepage: https://github.com/minamijoyo/hcledit
license: MIT

versionDiscovery:
  github:
    repo: minamijoyo/hcledit
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/minamijoyo/hcledit/releases/download/v{{.Version}}/hcledit_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "hcledit", dst: "bin/hcledit", mode: 0o755}

bins: ["bin"]

test:
  - run: hcledit version | grep -q "$NEM_VERSION"

versions:
