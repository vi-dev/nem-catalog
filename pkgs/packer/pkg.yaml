schemaVersion: 1
name: packer
description: Tool for building automated machine images from a single source configuration
homepage: https://www.packer.io
license: BUSL-1.1

archive:
  fetch:
    http:
      url: 'https://releases.hashicorp.com/packer/{{.Version | trimPrefix "v"}}/packer_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.zip'
      versionsFrom:
        github_release:
          repo: hashicorp/packer
          releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    sha256URL: 'https://releases.hashicorp.com/packer/{{.Version | trimPrefix "v"}}/packer_{{.Version | trimPrefix "v"}}_SHA256SUMS'

install:
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/packer"
      to: "{{.InstallDir}}/bin/packer"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/packer", "version"]
      # packer refuses to start without a config directory; with HOME unset in the
      # sandbox, point it at a writable dir under the scratch cwd (relative path).
      env:
        HOME: nem-packer-home
