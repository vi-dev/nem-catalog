schema: 2
name: kubelogin
description: kubectl plugin for Kubernetes OpenID Connect authentication
homepage: https://github.com/int128/kubelogin
license: Apache-2.0

versionDiscovery:
  github:
    repo: int128/kubelogin
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/int128/kubelogin/releases/download/v{{.Version}}/kubelogin_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "kubelogin", dst: "bin/kubectl-oidc_login", mode: 0o755}

bins: ["bin"]

