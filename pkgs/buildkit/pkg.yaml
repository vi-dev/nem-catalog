schema: 2
name: buildkit
description: BuildKit build daemon and its buildctl client
homepage: https://github.com/moby/buildkit
license: Apache-2.0

versionDiscovery:
  github:
    repo: moby/buildkit
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/moby/buildkit/releases/download/v{{.Version}}/buildkit-v{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

# darwin ships buildctl alone; linux adds buildkitd plus the buildkit-runc,
# CNI and qemu helpers it resolves through PATH, so the archive's own bin/ is
# exposed whole rather than lifting single binaries out of it.
install:
  - extract: {strip: 0}

bins: ["bin"]

