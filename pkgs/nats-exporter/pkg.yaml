schema: 2
name: nats-exporter
description: Prometheus exporter for NATS metrics
homepage: https://github.com/nats-io/prometheus-nats-exporter
license: Apache-2.0

versionDiscovery:
  github:
    repo: nats-io/prometheus-nats-exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/nats-io/prometheus-nats-exporter/releases/download/v{{.Version}}/prometheus-nats-exporter-v{{.Version}}-{{.OS}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "prometheus-nats-exporter", dst: "bin/prometheus-nats-exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: prometheus-nats-exporter -version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.20.2
    sha256:
      darwin/arm64: "72cc5cb78f8d2d88d81ab544f1a491d770ae1c642c428a5e8fd6f72a3e5a9129"
