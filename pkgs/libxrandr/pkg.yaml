schema: 3
name: libxrandr
description: X Resize, Rotate and Reflect extension client library
homepage: https://gitlab.freedesktop.org/xorg/lib/libxrandr
license: MIT

platforms: [linux/arm64, linux/amd64]

# compat "1" floats within 1.x; releases share the libXrandr.so.2 soname.
deps:
  - name: libx11
    kind: link
    compat: "1"
  - name: libxext
    kind: link
    compat: "1"
  - name: libxrender
    kind: link
    compat: "0.9"
  - name: xorgproto
    kind: link

libs: [lib]

versionDiscovery:
  git:
    url: https://gitlab.freedesktop.org/xorg/lib/libxrandr.git
    filter: '^libXrandr-\d+\.\d+\.\d+$'
    prefix: "libXrandr-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.5.5
    sourceSha256: "72b922c2e765434e9e9f0960148070bd4504b288263e2868a4ccce1b7cf2767a"

build:
  deps:
    - pkgconf
    - name: xorgproto
      kind: link
    - name: libx11
      kind: link
      compat: "1"
    - name: libxext
      kind: link
      compat: "1"
    - name: libxrender
      kind: link
      compat: "0.9"
  source:
    url: 'https://xorg.freedesktop.org/archive/individual/lib/libXrandr-{{.Version}}.tar.xz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --disable-static --disable-dependency-tracking
        make -j"$(nproc)"
        make install DESTDIR="$NEM_OUTPUT"

test:
  - run: |
      set -e
      grep -q "^Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/xrandr.pc"
      ls "$NEM_PREFIX"/lib/libXrandr.so.2 >/dev/null
