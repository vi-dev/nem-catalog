schema: 2
name: llamafile
description: Distribute and run LLMs with a single portable executable
homepage: https://github.com/Mozilla-Ocho/llamafile
license: Apache-2.0

versionDiscovery:
  github:
    repo: Mozilla-Ocho/llamafile
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/Mozilla-Ocho/llamafile/releases/download/{{.Version}}/llamafile-{{.Version}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/llamafile", mode: 0o755}

bins: ["bin"]

test:
  - run: llamafile --version | grep -q "$NEM_VERSION"

versions:
