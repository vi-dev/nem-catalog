schema: 3

name: libgcrypt
description: GnuPG cryptographic library
homepage: https://gnupg.org/software/libgcrypt/
license: LGPL-2.1-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat "1" floats within 1.x; all versions share the libgcrypt.20 soname.
deps:
  - name: libgpg-error
    kind: link
    compat: "1"

bins: [bin]
libs: [lib]

versionDiscovery:
  http:
    url: https://gnupg.org/ftp/gcrypt/libgcrypt/
    filter: 'libgcrypt-(\d+\.\d+\.\d+)\.tar\.bz2'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.12.4
    sourceSha256: "d77f68f48879510e79a2f65977ccc68981781ea0923e5bdffac2a193ea3d660e"
  - version: 1.12.3
    sourceSha256: "98d1b0b3202d2b03fa754a35aa3cbbfcf526a3260d8d2ee213748001b1043006"
  - version: 1.12.2
    sourceSha256: "7ce33c2492221a0436f96a8500215e9f3e3dcb5fd26a757cd415e7a843babd5e"

build:
  deps:
    - name: libgpg-error
      kind: link
      compat: "1"
  source:
    url: 'https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-{{.Version}}.tar.bz2'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        asm_flags=
        case "$(uname -s)" in Darwin) asm_flags=--disable-asm ;; esac
        ./configure --prefix=/ --libdir=/lib --disable-static --disable-dependency-tracking --disable-doc $asm_flags
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la

test:
  - run: dumpsexp --version | grep -q "(Libgcrypt) $NEM_VERSION"
  - run: |
      set -e
      [ "$(printf nem | hmac256 key)" = dbe03eb9a6662e76db60130f31729c59e4654e73ca4ae016093b2cc951406f9f ]
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/gcrypt.h" ]
      ls "$NEM_PREFIX"/lib/libgcrypt.* >/dev/null
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libgcrypt.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <gcrypt.h>
      #include <stdio.h>
      int main(void) {
        puts(gcry_check_version(NULL));
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -lgcrypt -lgpg-error -o probe
      [ "$(./probe)" = "$NEM_VERSION" ]
