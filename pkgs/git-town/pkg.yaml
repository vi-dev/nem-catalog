schema: 2
name: git-town
description: Git workflow automation for branch-based development
homepage: https://www.git-town.com
license: MIT

versionDiscovery:
  github:
    repo: git-town/git-town
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/git-town/git-town/releases/download/v{{.Version}}/git-town_{{replace .OS \"darwin\" \"macos\"}}_{{replace (replace .Arch \"arm64\" \"arm_64\") \"amd64\" \"intel_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "git-town", dst: "bin/git-town", mode: 0o755}

bins: ["bin"]

