schema: 2
name: dependabot-cli
description: Run Dependabot update jobs locally
homepage: https://github.com/dependabot/cli
license: MIT

versionDiscovery:
  github:
    repo: dependabot/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/dependabot/cli/releases/download/v{{.Version}}/dependabot-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dependabot", dst: "bin/dependabot", mode: 0o755}

bins: ["bin"]

test:
  - run: dependabot --version 2>&1 | grep -q "$NEM_VERSION"

versions:
