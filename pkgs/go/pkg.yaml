schemaVersion: 1
name: go
description: The Go programming language toolchain
homepage: https://go.dev
license: BSD-3-Clause

binPaths:
  - go/bin

env:
  # go self-locates GOROOT from its own binary; exported here for external
  # tooling (gopls, editors) that reads GOROOT to find this toolchain.
  - name: GOROOT
    value: "{{.InstallDir}}/go"

archive:
  fetch:
    http:
      url: 'https://dl.google.com/go/go{{.Version | trimPrefix "v"}}.{{.OS}}-{{.Arch}}.tar.gz'
      versionsFrom:
        github_tag:
          repo: golang/go
          tagFilter: '^go(\d+\.\d+\.\d+)$'
          versionTemplate: "v{{.Capture}}"
  verify:
    sha256URL: 'https://dl.google.com/go/go{{.Version | trimPrefix "v"}}.{{.OS}}-{{.Arch}}.tar.gz.sha256'

versions:
  - version: v1.26.5
  - version: v1.26.4
  - version: v1.25.11

install:
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/go"
      to: "{{.InstallDir}}/go"

test:
  - run:
      cmd: ["{{.InstallDir}}/go/bin/go", "version"]
