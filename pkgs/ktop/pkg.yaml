schema: 3
name: ktop
description: Top-like tool for Kubernetes cluster metrics
homepage: https://ktop.app
license: Apache-2.0

versionDiscovery:
  github:
    repo: vladimirvivien/ktop
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/vladimirvivien/ktop/releases/download/v{{.Version}}/ktop_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "ktop", dst: "bin/ktop", mode: 0o755}

bins: ["bin"]

test:
  - run: ktop --help | grep -q -- --all-namespaces

