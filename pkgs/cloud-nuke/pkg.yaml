schema: 3
name: cloud-nuke
description: Delete all resources in a cloud account
homepage: https://gruntwork.io
license: MIT

versionDiscovery:
  github:
    repo: gruntwork-io/cloud-nuke
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/gruntwork-io/cloud-nuke/releases/download/v{{.Version}}/cloud-nuke_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/cloud-nuke", mode: 0o755}

bins: ["bin"]

test:
  - run: cloud-nuke --version | grep -q "$NEM_VERSION"

