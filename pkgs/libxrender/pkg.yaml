schema: 3
name: libxrender
description: X Rendering Extension client library
homepage: https://gitlab.freedesktop.org/xorg/lib/libxrender
license: MIT

platforms: [linux/arm64, linux/amd64]

# compat "0.9" floats within 0.9.x; releases share the libXrender.so.1 soname.
deps:
  - name: libx11
    kind: link
    compat: "1"
  - name: xorgproto
    kind: link

libs: [lib]

versionDiscovery:
  git:
    url: https://gitlab.freedesktop.org/xorg/lib/libxrender.git
    filter: '^libXrender-\d+\.\d+\.\d+$'
    prefix: "libXrender-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 0.9.13
    sourceSha256: "3fe88c609df6782e1e7af2e4de36b2563d70cd70ff7dcb1cda561ad64912bb64"
  - version: 0.9.12
    sourceSha256: "b832128da48b39c8d608224481743403ad1691bf4e554e4be9c174df171d1b97"

build:
  deps:
    - pkgconf
    - name: xorgproto
      kind: link
    - name: libx11
      kind: link
      compat: "1"
  source:
    url: 'https://xorg.freedesktop.org/archive/individual/lib/libXrender-{{.Version}}.tar.xz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --disable-static --disable-dependency-tracking
        make -j"$(nproc)"
        make install DESTDIR="$NEM_OUTPUT"

test:
  - run: |
      set -e
      grep -q "^Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/xrender.pc"
      ls "$NEM_PREFIX"/lib/libXrender.so.1 >/dev/null
