schema: 3
name: cargo-binstall
description: Install Rust binaries from prebuilt release artifacts
homepage: https://github.com/cargo-bins/cargo-binstall
license: GPL-3.0-only

versionDiscovery:
  github:
    repo: cargo-bins/cargo-binstall
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cargo-bins/cargo-binstall/releases/download/v{{.Version}}/cargo-binstall-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{if eq .OS \"darwin\"}}apple-darwin.zip{{else}}unknown-linux-musl.tgz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "cargo-binstall", dst: "bin/cargo-binstall", mode: 0o755}

bins: ["bin"]

