schema: 2
name: oxlint
description: Linter for JavaScript and TypeScript written in Rust
homepage: https://oxc.rs
license: MIT

# oxc is a monorepo; the released CLI binaries share the apps_v tag series.
versionDiscovery:
  github:
    repo: oxc-project/oxc
    filter: '^apps_v\d+\.\d+\.\d+$'
    prefix: "apps_v"

artifact:
  url: "https://github.com/oxc-project/oxc/releases/download/apps_v{{.Version}}/oxlint-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

# The tarball holds a single binary named after the target triple.
install:
  - extract: {strip: 0}
  - copy: {src: "oxlint-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}", dst: "bin/oxlint", mode: 0o755}

bins: ["bin"]

