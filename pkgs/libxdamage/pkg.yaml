schema: 3
name: libxdamage
description: X Damage extension client library
homepage: https://gitlab.freedesktop.org/xorg/lib/libxdamage
license: MIT

platforms: [linux/arm64, linux/amd64]

# compat "1" floats within 1.x; releases share the libXdamage.so.1 soname.
deps:
  - name: libx11
    kind: link
    compat: "1"
  - name: libxfixes
    kind: link
    compat: "6"
  - name: xorgproto
    kind: link

libs: [lib]

versionDiscovery:
  git:
    url: https://gitlab.freedesktop.org/xorg/lib/libxdamage.git
    filter: '^libXdamage-\d+\.\d+\.\d+$'
    prefix: "libXdamage-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.1.7
    sourceSha256: "127067f521d3ee467b97bcb145aeba1078e2454d448e8748eb984d5b397bde24"

build:
  deps:
    - pkgconf
    - name: xorgproto
      kind: link
    - name: libx11
      kind: link
      compat: "1"
    - name: libxfixes
      kind: link
      compat: "6"
  source:
    url: 'https://xorg.freedesktop.org/archive/individual/lib/libXdamage-{{.Version}}.tar.xz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --disable-static --disable-dependency-tracking
        make -j"$(nproc)"
        make install DESTDIR="$NEM_OUTPUT"

test:
  - run: |
      set -e
      grep -q "^Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/xdamage.pc"
      ls "$NEM_PREFIX"/lib/libXdamage.so.1 >/dev/null
