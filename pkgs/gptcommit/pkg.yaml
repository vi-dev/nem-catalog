schema: 2
name: gptcommit
description: Git prepare-commit-msg hook that writes commit messages with an LLM
homepage: https://github.com/zurawiki/gptcommit
license: MIT

platforms: [darwin/arm64, darwin/amd64, linux/amd64]

versionDiscovery:
  github:
    repo: zurawiki/gptcommit
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/zurawiki/gptcommit/releases/download/v{{.Version}}/gptcommit-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gptcommit", dst: "bin/gptcommit", mode: 0o755}

bins: ["bin"]

