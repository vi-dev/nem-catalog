schemaVersion: 1
name: slides
description: Terminal based presentation tool
homepage: https://github.com/maaslalani/slides
license: MIT

archive:
  fetch:
    github_release:
      repo: maaslalani/slides
      assetName: 'slides_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'slides_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/slides"
      to: "{{.InstallDir}}/bin/slides"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/slides", "--help"]
