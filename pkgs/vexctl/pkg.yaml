schema: 2
name: vexctl
description: Create, transform and attest OpenVEX metadata
homepage: https://github.com/openvex/vexctl
license: Apache-2.0

versionDiscovery:
  github:
    repo: openvex/vexctl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/openvex/vexctl/releases/download/v{{.Version}}/vexctl-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/vexctl", mode: 0o755}

bins: ["bin"]

test:
  - run: vexctl version 2>&1 | grep -q "$NEM_VERSION"

versions:
