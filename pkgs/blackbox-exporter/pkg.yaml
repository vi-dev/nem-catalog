schema: 3
name: blackbox-exporter
description: Prometheus blackbox prober exporter
homepage: https://prometheus.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: prometheus/blackbox_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{.Version}}/blackbox_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "blackbox_exporter", dst: "bin/blackbox_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: blackbox_exporter --version 2>&1 | grep -q "$NEM_VERSION"

