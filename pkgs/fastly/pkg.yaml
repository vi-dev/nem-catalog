schemaVersion: 1
name: fastly
description: Build, deploy and configure Fastly services from your terminal
homepage: https://fastly.dev/reference/cli/
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: fastly/cli
      # Assets are fastly_v<ver>_<os>-<arch>.tar.gz — version keeps its leading v
      # and os/arch are joined by a hyphen. .OS/.Arch defaults (darwin/linux,
      # amd64/arm64) match the release naming, so no templateOverrides are needed.
      assetName: 'fastly_{{.Version}}_{{.OS}}-{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'fastly_{{.Version}}_SHA256SUMS'

install:
  # The tarball holds a single `fastly` binary at its root, so no stripComponents.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/fastly"
      to: "{{.InstallDir}}/bin/fastly"

test:
  - run:
      # `fastly` resolves its config dir from XDG_CONFIG_HOME before HOME; a CI
      # runner sets XDG_CONFIG_HOME to a read-only ~/.config, so a HOME-only
      # redirect is ignored. Point HOME and the XDG dirs at writable dirs under
      # the scratch cwd and pre-create them.
      script: |
        export HOME="$PWD/nem-fastly-home"
        export XDG_CONFIG_HOME="$HOME/.config"
        export XDG_CACHE_HOME="$HOME/.cache"
        mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
        "$NEM_INSTALL_DIR/bin/fastly" version
