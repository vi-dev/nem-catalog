schema: 2
name: kctrl
description: CLI for kapp-controller package management on Kubernetes
homepage: https://carvel.dev/kapp-controller
license: Apache-2.0

versionDiscovery:
  github:
    repo: carvel-dev/kapp-controller
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/carvel-dev/kapp-controller/releases/download/v{{.Version}}/kctrl-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kctrl", mode: 0o755}

bins: ["bin"]

test:
  - run: kctrl version | grep -q "$NEM_VERSION"

