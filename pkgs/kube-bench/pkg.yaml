schemaVersion: 1
name: kube-bench
description: Checks whether Kubernetes is deployed securely per the CIS Kubernetes Benchmark
homepage: https://github.com/aquasecurity/kube-bench
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: aquasecurity/kube-bench
      assetName: 'kube-bench_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'kube-bench_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # The tarball roots the `kube-bench` binary next to its `cfg/` benchmark tree;
  # only the binary is needed on PATH (cfg is resolved via --config-dir at runtime).
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/kube-bench"
      to: "{{.InstallDir}}/bin/kube-bench"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/kube-bench", "version"]
