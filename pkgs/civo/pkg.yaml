schema: 3
name: civo
description: Civo CLI
homepage: https://github.com/civo/cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: civo/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/civo/cli/releases/download/v{{.Version}}/civo-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "civo", dst: "bin/civo", mode: 0o755}

bins: ["bin"]

test:
  - run: civo version 2>&1 | grep -q "$NEM_VERSION"

