schema: 3
name: templ
description: HTML templating language for Go with a code generator
homepage: https://templ.guide
license: MIT

versionDiscovery:
  github:
    repo: a-h/templ
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/a-h/templ/releases/download/v{{.Version}}/templ_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "templ", dst: "bin/templ", mode: 0o755}

bins: ["bin"]

