schema: 3
name: vacuum
description: OpenAPI, AsyncAPI and JSON Schema linter
homepage: https://quobix.com/vacuum
license: MIT

versionDiscovery:
  github:
    repo: daveshanley/vacuum
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/daveshanley/vacuum/releases/download/v{{.Version}}/vacuum_{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "vacuum", dst: "bin/vacuum", mode: 0o755}

bins: ["bin"]

test:
  - run: vacuum version 2>&1 | grep -q "$NEM_VERSION"

