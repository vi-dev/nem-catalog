schema: 3
name: bicep
description: Declarative language for deploying Azure resources
homepage: https://github.com/Azure/bicep
license: MIT

versionDiscovery:
  github:
    repo: Azure/bicep
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

deps:
  - name: icu
    kind: link
    platforms: [linux/arm64, linux/amd64]

artifact:
  url: "https://github.com/Azure/bicep/releases/download/v{{.Version}}/bicep-{{replace .OS \"darwin\" \"osx\"}}-{{replace .Arch \"amd64\" \"x64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/bicep", mode: 0o755}

bins: ["bin"]

