schemaVersion: 1
name: yamlfmt
description: Extensible command line tool to format YAML files
homepage: https://github.com/google/yamlfmt
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: google/yamlfmt
      assetName: 'yamlfmt_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: Darwin
        linux: Linux
        amd64: x86_64
  verify:
    checksumGitHubAsset: 'checksums.txt'

install:
  # The binary sits at the archive root alongside LICENSE/README, so no stripComponents.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/yamlfmt"
      to: "{{.InstallDir}}/bin/yamlfmt"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/yamlfmt", "--version"]
