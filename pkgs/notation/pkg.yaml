schema: 2
name: notation
description: Sign and verify OCI artifacts with Notary Project
homepage: https://notaryproject.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: notaryproject/notation
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/notaryproject/notation/releases/download/v{{.Version}}/notation_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "notation", dst: "bin/notation", mode: 0o755}

bins: ["bin"]

test:
  - run: notation version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 1.3.2
    sha256:
      darwin/arm64: "054bf6e9fb2619390dab9c74e5d6c511bde7609f3a060ee512c6aead2440c214"
