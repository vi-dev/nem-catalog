schema: 3
name: static-web-server
description: Cross-platform asynchronous web server for static file serving
homepage: https://static-web-server.net
license: Apache-2.0

versionDiscovery:
  github:
    repo: static-web-server/static-web-server
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/static-web-server/static-web-server/releases/download/v{{.Version}}/static-web-server-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "static-web-server", dst: "bin/static-web-server", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.44.1
    sha256:
      darwin/arm64: "7f8dfb36f6902ea72878634438e76e63461300a0d154abe561834ab434a5a7fe"
      darwin/amd64: "cf1e911c44ba8fd7b6e3641532293228d2c70829f13adf9d3664e56bdbc9672c"
      linux/arm64: "28e53e5979735309ec3de685330719a11a0ef339aa06d0f0cd8eff5d973b9dfc"
      linux/amd64: "8f94abd9bc9c6d11240301d7271b95f9ec05b1b3e8509087c86ca8fd0b56fb4e"
  - version: 2.44.0
    sha256:
      darwin/arm64: "5f22e1d0072a0f5bf8bb32468885d6ba7bc9df470d37f16bdd71f9697832964f"
      darwin/amd64: "484708863fa0fa39fbfe1a46d99c3671f46c72862dff724da2b480cdc79ced1b"
      linux/arm64: "e9d6bd0b05dea441028eb4e690249ab585d711b311646bf9f420fcea01449670"
