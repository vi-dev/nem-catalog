schema: 3
name: libxcomposite
description: X Composite extension client library
homepage: https://gitlab.freedesktop.org/xorg/lib/libxcomposite
license: MIT

platforms: [linux/arm64, linux/amd64]

# compat "0.4" floats within 0.4.x; releases share the libXcomposite.so.1 soname.
deps:
  - name: libx11
    kind: link
    compat: "1"
  - name: libxfixes
    kind: link
    compat: "6"
  - name: xorgproto
    kind: link

libs: [lib]

versionDiscovery:
  git:
    url: https://gitlab.freedesktop.org/xorg/lib/libxcomposite.git
    filter: '^libXcomposite-\d+\.\d+\.\d+$'
    prefix: "libXcomposite-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 0.4.7
    sourceSha256: "8bdf310967f484503fa51714cf97bff0723d9b673e0eecbf92b3f97c060c8ccb"

build:
  deps:
    - pkgconf
    - name: xorgproto
      kind: link
    - name: libx11
      kind: link
      compat: "1"
    - name: libxfixes
      kind: link
      compat: "6"
  source:
    url: 'https://xorg.freedesktop.org/archive/individual/lib/libXcomposite-{{.Version}}.tar.xz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --disable-static --disable-dependency-tracking
        make -j"$(nproc)"
        make install DESTDIR="$NEM_OUTPUT"

test:
  - run: |
      set -e
      grep -q "^Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/xcomposite.pc"
      ls "$NEM_PREFIX"/lib/libXcomposite.so.1 >/dev/null
