schema: 3
name: kubevela
description: CLI for the KubeVela application delivery platform
homepage: https://kubevela.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubevela/kubevela
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubevela/kubevela/releases/download/v{{.Version}}/vela-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "vela", dst: "bin/vela", mode: 0o755}

bins: ["bin"]

