schemaVersion: 1
name: gitsign
description: Keyless Git commit signing with Sigstore
homepage: https://github.com/sigstore/gitsign
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: sigstore/gitsign
      # Each platform ships a raw (unarchived) binary named gitsign_<ver>_<os>_<arch>.
      assetName: 'gitsign_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'checksums.txt'

install:
  # The asset is the executable itself; copy it straight into bin/.
  - copy:
      from: "{{.Archive}}"
      to: "{{.InstallDir}}/bin/gitsign"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/gitsign", "--version"]
