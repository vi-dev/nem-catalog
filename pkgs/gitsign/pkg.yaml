schema: 3
name: gitsign
description: Keyless Git commit signing with Sigstore
homepage: https://github.com/sigstore/gitsign
license: Apache-2.0

deps:
  - git

versionDiscovery:
  github:
    repo: sigstore/gitsign
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sigstore/gitsign/releases/download/v{{.Version}}/gitsign_{{.Version}}_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/gitsign", mode: 0o755}

bins: ["bin"]

test:
  - run: gitsign --version 2>&1 | grep -q "$NEM_VERSION"

