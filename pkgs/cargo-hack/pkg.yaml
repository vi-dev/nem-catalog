schema: 2
name: cargo-hack
description: Cargo subcommand for feature-powerset testing and CI
homepage: https://github.com/taiki-e/cargo-hack
license: Apache-2.0

versionDiscovery:
  github:
    repo: taiki-e/cargo-hack
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/taiki-e/cargo-hack/releases/download/v{{.Version}}/cargo-hack-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cargo-hack", dst: "bin/cargo-hack", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-hack hack --version 2>&1 | grep -q "$NEM_VERSION"

versions:
