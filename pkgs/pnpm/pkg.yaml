schema: 2
name: pnpm
description: Fast, disk space efficient package manager for Node.js
homepage: https://pnpm.io
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: pnpm/pnpm
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pnpm/pnpm/releases/download/v{{.Version}}/pnpm-{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

# The archive holds the pnpm launcher with its dist/ payload beside it; the
# launcher resolves dist/pnpm.mjs relative to itself, so the layout must be
# kept intact and the install root itself goes on PATH.
install:
  - extract: {strip: 0}

bins: ["."]

