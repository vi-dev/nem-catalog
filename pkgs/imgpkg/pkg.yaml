schema: 3
name: imgpkg
description: Store application configuration files in OCI registries
homepage: https://carvel.dev/imgpkg
license: Apache-2.0

versionDiscovery:
  github:
    repo: carvel-dev/imgpkg
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/carvel-dev/imgpkg/releases/download/v{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/imgpkg", mode: 0o755}

bins: ["bin"]

test:
  - run: imgpkg version | grep -q "$NEM_VERSION"

