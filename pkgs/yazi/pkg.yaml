schema: 2
name: yazi
description: Terminal file manager with async I/O
homepage: https://yazi-rs.github.io
license: MIT

versionDiscovery:
  github:
    repo: sxyazi/yazi
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sxyazi/yazi/releases/download/v{{.Version}}/yazi-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.zip"

install:
  - extract: {strip: 1}
  - copy: {src: "yazi", dst: "bin/yazi", mode: 0o755}
  - copy: {src: "ya", dst: "bin/ya", mode: 0o755}

bins: ["bin"]

