schema: 2
name: restic
description: Fast, secure, deduplicating backup program
homepage: https://restic.net
license: BSD-2-Clause

versionDiscovery:
  github:
    repo: restic/restic
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/restic/restic/releases/download/v{{.Version}}/restic_{{.Version}}_{{.OS}}_{{.Arch}}.bz2"

install:
  - extract: {strip: 0}
  - copy: {src: "restic_{{.Version}}_{{.OS}}_{{.Arch}}", dst: "bin/restic", mode: 0o755}

bins: ["bin"]

test:
  - run: restic version | grep -q "$NEM_VERSION"

versions:
