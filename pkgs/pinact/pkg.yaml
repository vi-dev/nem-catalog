schema: 2
name: pinact
description: Pin GitHub Actions and reusable workflows to commit hashes
homepage: https://github.com/suzuki-shunsuke/pinact
license: MIT

versionDiscovery:
  github:
    repo: suzuki-shunsuke/pinact
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/suzuki-shunsuke/pinact/releases/download/v{{.Version}}/pinact_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "pinact", dst: "bin/pinact", mode: 0o755}

bins: ["bin"]

test:
  - run: pinact --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 5.0.0
    sha256:
      darwin/arm64: "3437ebfc9db720e431e86fd03ed19173b88dcb80b0f177d11a892126108661b5"
      darwin/amd64: "da5532bd185a9d3a16a1f93774f835574e0c50bc74c2085b9917b9df3e9fbbaa"
      linux/arm64: "d28ca5e9ddd7950da4a808288f8a83f84fc3ca40e86bab970f3adeef33578c0b"
      linux/amd64: "d005bbb85da80dacdc07816f24a5da723a9f6d1e9f3d3e7e73df33f9caa1358f"
