schema: 3
name: pinact
description: Pin GitHub Actions and reusable workflows to commit hashes
homepage: https://github.com/suzuki-shunsuke/pinact
license: MIT

versionDiscovery:
  github:
    repo: suzuki-shunsuke/pinact
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/suzuki-shunsuke/pinact/releases/download/v{{.Version}}/pinact_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "pinact", dst: "bin/pinact", mode: 0o755}

bins: ["bin"]

test:
  - run: pinact --version 2>&1 | grep -q "$NEM_VERSION"

