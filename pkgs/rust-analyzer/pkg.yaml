schema: 2
name: rust-analyzer
description: Rust compiler front-end for IDEs
homepage: https://rust-analyzer.github.io
license: MIT OR Apache-2.0

versionDiscovery:
  github:
    repo: rust-lang/rust-analyzer
    filter: '^\d{4}-\d{2}-\d{2}(\.\d+)?$'

# The standalone assets are bare gzipped binaries, not tars, so the VS Code
# extension package (a zip) is the only extractable asset shipping the server.
artifact:
  url: "https://github.com/rust-lang/rust-analyzer/releases/download/{{.Version}}/rust-analyzer-{{.OS}}-{{replace .Arch \"amd64\" \"x64\"}}.vsix"

install:
  - extract: {strip: 1}
  - mkdir: bin
  - move: {src: "server/rust-analyzer", dst: "bin/rust-analyzer"}

bins: ["bin"]

