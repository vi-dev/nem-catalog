schema: 3
name: ovhcloud
description: OVHcloud CLI
homepage: https://github.com/ovh/ovhcloud-cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: ovh/ovhcloud-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ovh/ovhcloud-cli/releases/download/v{{.Version}}/ovhcloud-cli_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "ovhcloud", dst: "bin/ovhcloud", mode: 0o755}

bins: ["bin"]

test:
  - run: ovhcloud version 2>&1 | grep -q "$NEM_VERSION"

