schema: 2
name: tfschema
description: Schema inspector for Terraform and OpenTofu providers
homepage: https://github.com/minamijoyo/tfschema
license: MIT

versionDiscovery:
  github:
    repo: minamijoyo/tfschema
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/minamijoyo/tfschema/releases/download/v{{.Version}}/tfschema_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tfschema", dst: "bin/tfschema", mode: 0o755}

bins: ["bin"]

test:
  - run: tfschema --version | grep -q "$NEM_VERSION"

versions:
  - version: 0.7.10
    sha256:
      darwin/arm64: "b9c21fc486c083041b97532526bcaa153f7b3282633279555b39d75b2afa310a"
