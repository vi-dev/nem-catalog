schema: 3
name: cargo-about
description: Generate a list of all licenses used by a Rust crate
homepage: https://github.com/EmbarkStudios/cargo-about
license: Apache-2.0
platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: EmbarkStudios/cargo-about
    filter: '^\d+\.\d+\.\d+$'
    prefix: ""

artifact:
  url: "https://github.com/EmbarkStudios/cargo-about/releases/download/{{.Version}}/cargo-about-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-about", dst: "bin/cargo-about", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-about --version 2>&1 | grep -q "$NEM_VERSION"

versions:
