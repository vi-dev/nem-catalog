schema: 3
name: jdk17
description: Eclipse Temurin JDK 17 (LTS)
homepage: https://adoptium.net
license: GPL-2.0-only WITH Classpath-exception-2.0

versionDiscovery:
  github:
    repo: adoptium/temurin17-binaries
    filter: '^jdk-17(\.\d+){1,3}\+\d+(\.\d+)?$'
    prefix: "jdk-"

# Upstream releases are "17.0.20+8", but a version doubles as an OCI tag in
# the catalog's archives repo, where "+" is invalid — it is spelled "_" here
# and mapped back in the URL.
artifact:
  url: "https://api.adoptium.net/v3/binary/version/jdk-{{replace .Version \"_\" \"+\"}}/{{replace .OS \"darwin\" \"mac\"}}/{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x64\"}}/jdk/hotspot/normal/eclipse"

install:
  - extract: {strip: 1}

# Temurin macOS archives nest the JDK under Contents/Home; Linux archives
# don't. The entry absent on a platform contributes a dir that never exists.
bins: ["bin", "Contents/Home/bin"]

env:
  - name: JAVA_HOME
    value: "{{.InstallDir}}"
    platforms: [linux]
  - name: JAVA_HOME
    value: "{{.InstallDir}}/Contents/Home"
    platforms: [darwin]

versions:
  - version: 17.0.21_9
    sha256:
      darwin/arm64: "78b08c7f5a0598242d5719c022e19479cb4a3aa45c37c19726a757a469ed1c15"
      darwin/amd64: "868f5c672b3389fdbe48e44f94ae170f01668b1401360944fc7159d7cc9772cc"
      linux/arm64: "3e4eca7ead088f080af1476007decf010a240a1eb4e1e78c54fa32fbcc347084"
      linux/amd64: "8b9b611d917e3dfd8419d3566b5949226f69b052fed7e109c1368add1dfe8711"
  - version: 17.0.20_8
    sha256:
      darwin/arm64: "524850138c742324fb21fca4ff6ef68ea25f25bf59366a864e45b4a0c45ed0df"
      darwin/amd64: "3710c3131c5d7c090582b357f1310133a90bf701183d065223f1a0b90b9ed5ae"
      linux/arm64: "d143936f473a4cb24e3b0e247d6d0775769d55ec9775c339540e753059a8d77a"
      linux/amd64: "be7668bc030d578b83d6d5ef9221d6d6729bbbca8cf94a7d52e16ac68b5a5a35"

test:
  - run: java --version | grep -q "Temurin-$(printf '%s' "$NEM_VERSION" | tr _ +)"
  - run: |
      set -e
      [ -x "$JAVA_HOME/bin/java" ]
      printf 'public class P { public static void main(String[] a) { System.out.print("ok"); } }\n' > P.java
      [ "$(java P.java)" = ok ]
