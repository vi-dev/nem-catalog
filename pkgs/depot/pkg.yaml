schema: 2
name: depot
description: Depot CLI for cloud container builds
homepage: https://depot.dev
license: MIT

versionDiscovery:
  github:
    repo: depot/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/depot/cli/releases/download/v{{.Version}}/depot_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "depot", dst: "bin/depot", mode: 0o755}

bins: ["bin"]

test:
  - run: depot version 2>&1 | grep -q "$NEM_VERSION"

