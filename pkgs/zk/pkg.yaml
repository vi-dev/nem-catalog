schema: 3
name: zk
description: Plain text note-taking assistant
homepage: https://github.com/zk-org/zk
license: GPL-3.0

versionDiscovery:
  github:
    repo: zk-org/zk
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/zk-org/zk/releases/download/v{{.Version}}/zk-v{{.Version}}-{{if eq .OS \"darwin\"}}macos-{{replace .Arch \"amd64\" \"x86_64\"}}{{else}}linux-{{.Arch}}{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "zk", dst: "bin/zk", mode: 0o755}

bins: ["bin"]

versions:
