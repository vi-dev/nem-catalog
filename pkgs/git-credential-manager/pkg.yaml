schema: 2
name: git-credential-manager
description: Cross-platform Git credential storage and authentication
homepage: https://github.com/git-ecosystem/git-credential-manager
license: MIT

deps:
  - git

versionDiscovery:
  github:
    repo: git-ecosystem/git-credential-manager
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/git-ecosystem/git-credential-manager/releases/download/v{{.Version}}/gcm-{{replace .OS \"darwin\" \"osx\"}}-{{replace .Arch \"amd64\" \"x64\"}}-{{.Version}}.tar.gz"

install:
  - extract: {strip: 0}

bins: ["."]

env:
  - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
    value: "1"
    platforms: [linux]

test:
  - run: git-credential-manager --version 2>&1 | grep -q "$NEM_VERSION"

