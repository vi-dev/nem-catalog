schema: 3
name: protolint
description: Pluggable linter and fixer for Protocol Buffers
homepage: https://github.com/yoheimuta/protolint
license: MIT

versionDiscovery:
  github:
    repo: yoheimuta/protolint
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/yoheimuta/protolint/releases/download/v{{.Version}}/protolint_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "protolint", dst: "bin/protolint", mode: 0o755}
  - copy: {src: "protoc-gen-protolint", dst: "bin/protoc-gen-protolint", mode: 0o755}

bins: ["bin"]

test:
  - run: protolint version 2>&1 | grep -q "$NEM_VERSION"

