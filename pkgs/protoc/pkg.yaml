schema: 3
name: protoc
description: Protocol Buffers compiler
homepage: https://protobuf.dev
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: protocolbuffers/protobuf
    filter: '^v\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/protocolbuffers/protobuf/releases/download/v{{.Version}}/protoc-{{.Version}}-{{replace .OS \"darwin\" \"osx\"}}-{{replace (replace .Arch \"arm64\" \"aarch_64\") \"amd64\" \"x86_64\"}}.zip"

install:
  # keep include/ next to bin/: protoc resolves well-known-type imports from it
  - extract: {strip: 0}

bins: ["bin"]

