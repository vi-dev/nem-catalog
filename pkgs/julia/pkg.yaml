schema: 2
name: julia
description: The Julia programming language
homepage: https://julialang.org
license: MIT

versionDiscovery:
  github:
    repo: JuliaLang/julia
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://julialang-s3.julialang.org/bin/{{replace .OS \"darwin\" \"mac\"}}/{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x64\"}}/{{versionMajorMinor .Version}}/julia-{{.Version}}-{{replace (replace (replace (replace (printf \"%s-%s\" .OS .Arch) \"darwin-arm64\" \"macaarch64\") \"darwin-amd64\" \"mac64\") \"linux-arm64\" \"linux-aarch64\") \"linux-amd64\" \"linux-x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}

