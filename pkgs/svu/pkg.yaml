schema: 3
name: svu
description: Semantic version utility for git tags
homepage: https://github.com/caarlos0/svu
license: MIT

versionDiscovery:
  github:
    repo: caarlos0/svu
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/caarlos0/svu/releases/download/v{{.Version}}/svu_{{.Version}}_{{if eq .OS \"darwin\"}}darwin_all{{else}}linux_{{.Arch}}{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "svu", dst: "bin/svu", mode: 0o755}

bins: ["bin"]

test:
  - run: svu --version 2>&1 | grep -q "$NEM_VERSION"

