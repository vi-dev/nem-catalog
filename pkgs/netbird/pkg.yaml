schema: 2
name: netbird
description: WireGuard-based overlay network client
homepage: https://netbird.io
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: netbirdio/netbird
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/netbirdio/netbird/releases/download/v{{.Version}}/netbird_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "netbird", dst: "bin/netbird", mode: 0o755}

bins: ["bin"]

test:
  - run: netbird version | grep -q "$NEM_VERSION"

