license: Apache-2.0

versionDiscovery:
  github:
    repo: Myriad-Dreamin/tinymist
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Myriad-Dreamin/tinymist/releases/download/v{{.Version}}/tinymist-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "tinymist", dst: "bin/tinymist", mode: 0o755}

bins: ["bin"]

