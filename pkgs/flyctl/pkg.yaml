schema: 2
name: flyctl
description: Command-line tool for the Fly.io platform
homepage: https://fly.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: superfly/flyctl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/superfly/flyctl/releases/download/v{{.Version}}/flyctl_{{.Version}}_{{replace (replace .OS \"darwin\" \"macOS\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "flyctl", dst: "bin/flyctl", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.4.102
    sha256:
      darwin/arm64: "4780d045c38d4ff7e7bc296e2d2f3e0f093b0fcece5f6022afc948ddf94288a8"
      darwin/amd64: "167d9f926f307e4a0799c76267f7b0002174df56a57f69fefd52d8e9a4285f55"
      linux/arm64: "4acd7d16824e8733447a28eaab92bd6d3284044a273ffafec5d5f98bd3453ebb"
      linux/amd64: "94a7219201660d57705d6f92fc4a75199aa0c491c349325fd67dca0b43bc588e"

test:
  - run: flyctl version | grep -q "$NEM_VERSION"
