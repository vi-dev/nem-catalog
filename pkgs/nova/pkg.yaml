schema: 2
name: nova
description: Find outdated or deprecated Helm charts in a cluster
homepage: https://nova.docs.fairwinds.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: FairwindsOps/nova
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/FairwindsOps/nova/releases/download/v{{.Version}}/nova_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "nova", dst: "bin/nova", mode: 0o755}

bins: ["bin"]

test:
  - run: nova version | grep -q "$NEM_VERSION"

versions:
