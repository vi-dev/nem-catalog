schema: 2
name: kbld
description: Image building and pushing for Kubernetes deployment workflows
homepage: https://carvel.dev/kbld
license: Apache-2.0

versionDiscovery:
  github:
    repo: carvel-dev/kbld
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/carvel-dev/kbld/releases/download/v{{.Version}}/kbld-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kbld", mode: 0o755}

bins: ["bin"]

test:
  - run: kbld version | grep -q "$NEM_VERSION"

versions:
