schema: 2
name: nats-server
description: High-performance server for the NATS messaging system
homepage: https://nats.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: nats-io/nats-server
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/nats-io/nats-server/releases/download/v{{.Version}}/nats-server-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "nats-server", dst: "bin/nats-server", mode: 0o755}

bins: ["bin"]

