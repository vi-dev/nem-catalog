schema: 2
name: flowpipe
description: Workflow automation for DevOps
homepage: https://flowpipe.io
license: AGPL-3.0

versionDiscovery:
  github:
    repo: turbot/flowpipe
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/turbot/flowpipe/releases/download/v{{.Version}}/flowpipe.{{.OS}}.{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "flowpipe", dst: "bin/flowpipe", mode: 0o755}

bins: ["bin"]

test:
  - run: flowpipe --version | grep -q "$NEM_VERSION"

versions:
