schema: 2
name: pgbouncer-exporter
description: Prometheus exporter for PgBouncer
homepage: https://github.com/prometheus-community/pgbouncer_exporter
license: MIT

versionDiscovery:
  github:
    repo: prometheus-community/pgbouncer_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/prometheus-community/pgbouncer_exporter/releases/download/v{{.Version}}/pgbouncer_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "pgbouncer_exporter", dst: "bin/pgbouncer_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: pgbouncer_exporter --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.12.1
    sha256:
      darwin/arm64: "9eca132c7668066eef013310bb6df2bff00d0b73b8b40fb48be7f147ca9e1785"
