schema: 2
name: zot
description: OCI-native container image and artifact registry
homepage: https://zotregistry.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: project-zot/zot
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/project-zot/zot/releases/download/v{{.Version}}/zot-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/zot", mode: 0o755}

bins: ["bin"]

