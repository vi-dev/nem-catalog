schema: 2
name: cagent
description: Declarative builder and runtime for multi-agent AI systems
homepage: https://github.com/docker/cagent
license: Apache-2.0

versionDiscovery:
  github:
    repo: docker/cagent
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# Releases ship the binary under the docker-agent name; upstream still calls
# the tool cagent.
artifact:
  url: "https://github.com/docker/cagent/releases/download/v{{.Version}}/docker-agent-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/cagent", mode: 0o755}

bins: ["bin"]

