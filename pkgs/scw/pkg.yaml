schemaVersion: 1
name: scw
description: Command-line interface for the Scaleway cloud platform
homepage: https://github.com/scaleway/scaleway-cli
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: scaleway/scaleway-cli
      # The asset is the raw binary (no archive); OS/arch tokens match nem's
      # defaults (darwin/linux, amd64/arm64) exactly, so no templateOverrides.
      assetName: 'scaleway-cli_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  # Aggregate SHA256SUMS release asset lists each binary by its exact basename.
  verify:
    checksumGitHubAsset: SHA256SUMS

install:
  - copy:
      from: "{{.Archive}}"
      to: "{{.InstallDir}}/bin/scw"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/scw", "version"]
