schema: 2
name: scw
description: Scaleway CLI
homepage: https://cli.scaleway.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: scaleway/scaleway-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/scaleway/scaleway-cli/releases/download/v{{.Version}}/scaleway-cli_{{.Version}}_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/scw", mode: 0o755}

bins: ["bin"]

test:
  - run: scw version 2>&1 | grep -q "$NEM_VERSION"

