schema: 2
name: cyclonedx-cli
description: CycloneDX SBOM analysis, merging, diffing and conversion
homepage: https://cyclonedx.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: CycloneDX/cyclonedx-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v{{.Version}}/cyclonedx-{{replace .OS \"darwin\" \"osx\"}}-{{replace .Arch \"amd64\" \"x64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/cyclonedx", mode: 0o755}

bins: ["bin"]

test:
  - run: cyclonedx --version 2>&1 | grep -q "$NEM_VERSION"

versions:
