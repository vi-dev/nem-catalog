schemaVersion: 1
name: regal
description: Linter and language server for the Rego policy language
homepage: https://github.com/open-policy-agent/regal
license: Apache-2.0

archive:
  fetch:
    github_release:
      # Assets are raw, per-platform binaries named regal_<OS>_<Arch> with the
      # OS capitalized (Darwin/Linux) and amd64 published as x86_64.
      repo: open-policy-agent/regal
      assetName: 'regal_{{.OS}}_{{.Arch}}'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: Darwin
        linux: Linux
        amd64: x86_64
  verify:
    # checksums.txt is a standard sha256sum file listing each asset by its exact
    # name (regal_Darwin_arm64, ...).
    checksumGitHubAsset: 'checksums.txt'

install:
  # The asset is the executable itself, not an archive; copy it into place.
  - copy:
      from: "{{.Archive}}"
      to: "{{.InstallDir}}/bin/regal"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/regal", "version"]
