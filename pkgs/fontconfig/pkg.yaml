schema: 3

name: fontconfig
description: Font configuration and matching library with the fc-* tools
homepage: https://www.freedesktop.org/wiki/Software/fontconfig/
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat "2" floats within 2.x; releases share the libfontconfig.1 soname.
deps:
  - name: freetype
    kind: link
    compat: "2"
  - name: expat
    kind: link
    compat: "2"

bins: [bin]
libs: [lib]

# The baked config path is /etc/fonts; the env var re-roots it to the
# install dir, where fonts.conf and conf.d live.
env:
  - name: FONTCONFIG_PATH
    value: "{{.InstallDir}}/etc/fonts"

# Releases moved from freedesktop.org/software to GitLab package registry
# tarballs after 2.16.
versionDiscovery:
  http:
    url: https://gitlab.freedesktop.org/api/v4/projects/fontconfig%2Ffontconfig/repository/tags?per_page=20
    filter: '"name":"(\d+\.\d+\.\d+)"'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 2.18.3
    sourceSha256: "4f7b554a38cdf78c033f666c8871f3749e14a094f65a07f630c91ed0b43d35e3"

build:
  deps:
    - meson
    - ninja
    - pkgconf
    - python
    - name: freetype
      kind: link
      compat: "2"
    - name: expat
      kind: link
      compat: "2"
  source:
    url: 'https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/{{.Version}}/fontconfig-{{.Version}}.tar.xz'
  output: out
  steps:
    # cache-build would run fc-cache against the builder's fonts at install;
    # the default font dirs are the platform's system font locations.
    - run: |
        set -e
        meson setup build --prefix=/ --libdir=lib --sysconfdir=/etc --localstatedir=/var \
          --buildtype=release \
          -Dxml-backend=expat -Dtools=enabled -Dcache-build=disabled \
          -Ddoc=disabled -Dnls=disabled -Dtests=disabled -Diconv=disabled -Dfontations=disabled
        ninja -C build
        DESTDIR="$NEM_OUTPUT" ninja -C build install

test:
  - run: fc-list --version 2>&1 | grep -q "fontconfig version $NEM_VERSION"
  - run: |
      set -e
      [ -f "$NEM_PREFIX/etc/fonts/fonts.conf" ]
      [ -f "$NEM_PREFIX/etc/fonts/conf.d/50-user.conf" ]
      fc-conflist | grep -q "^+ $NEM_PREFIX/etc/fonts/fonts.conf"
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/fontconfig/fontconfig.h" ]
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/fontconfig.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <fontconfig/fontconfig.h>
      #include <stdio.h>
      int main(void) {
        int v = FcGetVersion();
        printf("%d.%d.%d\n", v / 10000, (v / 100) % 100, v % 100);
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -lfontconfig -o probe
      [ "$(./probe)" = "$NEM_VERSION" ]
