schemaVersion: 1
name: gobuster
description: Directory, DNS, vhost and S3 busting tool written in Go
homepage: https://github.com/OJ/gobuster
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: OJ/gobuster
      assetName: 'gobuster_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: Darwin
        linux: Linux
        amd64: x86_64
  verify:
    checksumGitHubAsset: 'gobuster_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # The binary sits at the archive root alongside LICENSE/README, so no stripComponents.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/gobuster"
      to: "{{.InstallDir}}/bin/gobuster"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/gobuster", "--version"]
