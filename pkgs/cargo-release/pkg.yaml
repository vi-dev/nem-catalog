schema: 3
name: cargo-release
description: Cargo subcommand for releasing Rust crates
homepage: https://github.com/crate-ci/cargo-release
license: Apache-2.0

versionDiscovery:
  github:
    repo: crate-ci/cargo-release
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/crate-ci/cargo-release/releases/download/v{{.Version}}/cargo-release-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cargo-release", dst: "bin/cargo-release", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-release release --version 2>&1 | grep -q "$NEM_VERSION"

