schema: 3
name: yarn
description: Yarn package manager for Node.js
homepage: https://yarnpkg.com
license: BSD-2-Clause

versionDiscovery:
  github:
    repo: yarnpkg/berry
    filter: '^@yarnpkg/cli/\d+\.\d+\.\d+$'
    prefix: "@yarnpkg/cli/"

deps:
  - node

artifact:
  url: "https://repo.yarnpkg.com/{{.Version}}/packages/yarnpkg-cli/bin/yarn.js"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/yarn", mode: 0o755}
  - copy: {src: "{{.Artifact}}", dst: "bin/yarnpkg", mode: 0o755}

bins: ["bin"]

