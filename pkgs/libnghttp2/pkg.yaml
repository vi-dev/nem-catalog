schema: 3

name: libnghttp2
description: HTTP/2 C library from the nghttp2 project
homepage: https://nghttp2.org
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

libs: [lib]

versionDiscovery:
  github:
    repo: nghttp2/nghttp2
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.70.0
    sourceSha256: "aa317e2cf9dca6afa0aed68f8fad6ff303ec6982e25a78c75c0b65e2b9b3ded5"

build:
  source:
    url: 'https://github.com/nghttp2/nghttp2/releases/download/v{{.Version}}/nghttp2-{{.Version}}.tar.gz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --libdir=/lib --enable-lib-only --disable-static --disable-dependency-tracking
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la

test:
  - run: |
      set -e
      grep -q "define NGHTTP2_VERSION \"$NEM_VERSION\"" "$NEM_PREFIX/include/nghttp2/nghttp2ver.h"
      ls "$NEM_PREFIX"/lib/libnghttp2.* >/dev/null
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libnghttp2.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <nghttp2/nghttp2.h>
      #include <stdio.h>
      int main(void) {
        puts(nghttp2_version(0)->version_str);
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -lnghttp2 -o probe
      [ "$(./probe)" = "$NEM_VERSION" ]
