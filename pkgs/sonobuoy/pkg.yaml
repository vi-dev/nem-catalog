schema: 2
name: sonobuoy
description: Kubernetes conformance testing and cluster diagnostics
homepage: https://sonobuoy.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: vmware-tanzu/sonobuoy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/vmware-tanzu/sonobuoy/releases/download/v{{.Version}}/sonobuoy_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "sonobuoy", dst: "bin/sonobuoy", mode: 0o755}

bins: ["bin"]

test:
  - run: sonobuoy version | grep -q "$NEM_VERSION"

versions:
