schema: 3
name: govc
description: vSphere command-line interface built on govmomi
homepage: https://github.com/vmware/govmomi
license: Apache-2.0

versionDiscovery:
  github:
    repo: vmware/govmomi
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/vmware/govmomi/releases/download/v{{.Version}}/govc_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "govc", dst: "bin/govc", mode: 0o755}

