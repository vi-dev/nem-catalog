build:
  deps:
    - python
  source:
    url: 'https://github.com/aws/aws-cli/archive/refs/tags/{{.Version}}.tar.gz'
  output: out
  steps:
    # portable-exe is the frozen, relocatable install type; the default
    # system-sandbox type is a venv wired to build-time absolute paths.
    - run: ./configure --prefix=/ --with-download-deps --with-install-type=portable-exe && make && make install DESTDIR="$NEM_OUTPUT"
    # The installed bin/ symlinks point at absolute prefix paths, which
    # archive extraction rejects — rewrite them relative.
    - run: cd "$NEM_OUTPUT/bin" && ln -sf ../lib/aws-cli/aws aws && ln -sf ../lib/aws-cli/aws_completer aws_completer
