schema: 3
name: jaq
description: jq clone focussed on correctness, speed, and simplicity
homepage: https://github.com/01mf02/jaq
license: MIT

versionDiscovery:
  github:
    repo: 01mf02/jaq
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/01mf02/jaq/releases/download/v{{.Version}}/jaq-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/jaq", mode: 0o755}

bins: ["bin"]

