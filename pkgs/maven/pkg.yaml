schemaVersion: 1
name: maven
description: Apache Maven build and dependency-management tool for Java
homepage: https://maven.apache.org
license: Apache-2.0

env:
  # mvn self-locates its home; MAVEN_HOME is exported for IDEs and tooling
  # that read it to discover the Maven installation.
  - name: MAVEN_HOME
    value: "{{.InstallDir}}"

dependsOn:
  - temurin21

archive:
  fetch:
    http:
      url: 'https://archive.apache.org/dist/maven/maven-3/{{.Version}}/binaries/apache-maven-{{.Version}}-bin.tar.gz'
      versionsFrom:
        github_tag:
          repo: apache/maven
          tagFilter: '^maven-(3\.\d+\.\d+)$'
  verify:
    checksumURL: 'https://archive.apache.org/dist/maven/maven-3/{{.Version}}/binaries/apache-maven-{{.Version}}-bin.tar.gz.sha512'
    algorithm: sha512

versions:
  - version: 3.9.16

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}"
      to: "{{.InstallDir}}"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/mvn", "--version"]
