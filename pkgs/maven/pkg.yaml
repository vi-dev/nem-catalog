schema: 3
name: maven
description: Apache Maven build tool for Java
homepage: https://maven.apache.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: apache/maven
    filter: '^maven-\d+\.\d+\.\d+$'
    prefix: "maven-"

deps:
  - jdk25

artifact:
  url: "https://archive.apache.org/dist/maven/maven-3/{{.Version}}/binaries/apache-maven-{{.Version}}-bin.tar.gz"

install:
  - extract: {strip: 1}

bins: ["bin"]

