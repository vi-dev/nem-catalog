schema: 3
name: himalaya
description: CLI to manage emails over IMAP, Maildir, and JMAP
homepage: https://github.com/pimalaya/himalaya
license: Apache-2.0

versionDiscovery:
  github:
    repo: pimalaya/himalaya
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pimalaya/himalaya/releases/download/v{{.Version}}/himalaya.{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{.OS}}.tgz"

install:
  - extract: {strip: 0}
  - copy: {src: "himalaya", dst: "bin/himalaya", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.2.1
    sha256:
      darwin/arm64: "a5d97a1f7bbca45e58bddde3f9f17325f614c9cd6d5f17fabf38ddcb030869ab"
      darwin/amd64: "24e226bc6bccfeadc89608953ffc0fcb46623d1d4cd4689734cbace243cc8d2e"
      linux/arm64: "1dc21c3dd6d948929e22e5cae49b9d0b3b30ff88fafd4493fd4460c6252e9d90"
      linux/amd64: "5c5ba2724c162f82d0a0c71b6c03224ed44f8bef7b14ace5da0635d3af2665a0"
  - version: 2.1.0
    sha256:
      darwin/arm64: "a5a787b7c4dbf065408e7772908fc75c799626f4cebab8e9c78fafe3e2fa585c"
      darwin/amd64: "0e61604709e7e84b5142ebebc85c52d7beb38f09ffd3506fae6041245c35d2a7"
      linux/arm64: "c41adab4bc220ba816cdbf865a5df8dc3b358b39ec58b4be0ed2f64e46b1d182"
      linux/amd64: "683a2ab8e1534f01e6bda3a69e204d564c31fbfbe20511fc7bc60b67f2e85884"

test:
  - run: himalaya --version | grep -q "$NEM_VERSION"
