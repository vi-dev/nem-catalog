schema: 2
name: gping
description: Ping with a graph in the terminal
homepage: https://github.com/orf/gping
license: MIT

versionDiscovery:
  github:
    repo: orf/gping
    filter: '^gping-v\d+\.\d+\.\d+$'
    prefix: "gping-v"

artifact:
  url: "https://github.com/orf/gping/releases/download/gping-v{{.Version}}/gping-{{replace (replace .OS \"darwin\" \"macOS\") \"linux\" \"Linux-gnu\"}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "gping", dst: "bin/gping", mode: 0o755}

bins: ["bin"]

