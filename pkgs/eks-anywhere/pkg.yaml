schema: 2
name: eks-anywhere
description: Run Amazon EKS on your own infrastructure
homepage: https://anywhere.eks.amazonaws.com
license: Apache-2.0

deps:
  - eksctl

versionDiscovery:
  github:
    repo: aws/eks-anywhere
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/aws/eks-anywhere/releases/download/v{{.Version}}/eksctl-anywhere-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "eksctl-anywhere", dst: "bin/eksctl-anywhere", mode: 0o755}

bins: ["bin"]

test:
  - run: eksctl anywhere version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.26.2
    sha256:
      darwin/arm64: "d4fdd1efe851ea66162c17959ceadb4f733bdc437985e0563b302791822a4241"
