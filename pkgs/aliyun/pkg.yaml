schema: 3
name: aliyun
description: Alibaba Cloud CLI
homepage: https://help.aliyun.com/zh/cli/
license: Apache-2.0

versionDiscovery:
  github:
    repo: aliyun/aliyun-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/aliyun/aliyun-cli/releases/download/v{{.Version}}/aliyun-cli-{{replace .OS \"darwin\" \"macosx\"}}-{{.Version}}-{{.Arch}}.tgz"

install:
  - extract: {strip: 0}
  - copy: {src: "aliyun", dst: "bin/aliyun", mode: 0o755}

bins: ["bin"]

test:
  - run: aliyun version 2>&1 | grep -q "$NEM_VERSION"

