schema: 3
name: nancy
description: Check Go dependencies for known vulnerabilities
homepage: https://github.com/sonatype-nexus-community/nancy
license: Apache-2.0

versionDiscovery:
  github:
    repo: sonatype-nexus-community/nancy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sonatype-nexus-community/nancy/releases/download/v{{.Version}}/nancy-v{{.Version}}-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/nancy", mode: 0o755}

bins: ["bin"]

test:
  - run: nancy --version 2>&1 | grep -q "$NEM_VERSION"

