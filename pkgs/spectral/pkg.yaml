schema: 3
name: spectral
description: JSON/YAML linter for OpenAPI, AsyncAPI, and Arazzo
homepage: https://stoplight.io/spectral
license: Apache-2.0

versionDiscovery:
  github:
    repo: stoplightio/spectral
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/stoplightio/spectral/releases/download/v{{.Version}}/spectral-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x64\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/spectral", mode: 0o755}

bins: ["bin"]

versions:
