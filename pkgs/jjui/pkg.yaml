schema: 2
name: jjui
description: Terminal UI for the Jujutsu version control system
homepage: https://github.com/idursun/jjui
license: MIT

versionDiscovery:
  github:
    repo: idursun/jjui
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/idursun/jjui/releases/download/v{{.Version}}/jjui-{{.Version}}-{{.OS}}-{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "jjui-{{.Version}}-{{.OS}}-{{.Arch}}", dst: "bin/jjui", mode: 0o755}

bins: ["bin"]

