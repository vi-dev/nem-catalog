schema: 3

name: gpgmepp
description: C++ bindings for GPGME (libgpgmepp)
homepage: https://www.gnupg.org/software/gpgme/
license: LGPL-2.1-or-later

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat is the version-major float; gpgmepp tracks gpgme's major and shares
# the libgpgmepp.6 soname across 2.x. libgpg-error is direct, not only
# transitive via gpgme, so the loader path is complete.
deps:
  - name: gpgme
    kind: link
    compat: "2"
  - name: libgpg-error
    kind: link
    compat: "1"

libs: [lib]

versionDiscovery:
  http:
    url: https://gnupg.org/ftp/gcrypt/gpgmepp/
    filter: 'gpgmepp-(\d+\.\d+\.\d+)\.tar\.xz'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 2.2.0
    sourceSha256: "6651c5f7f801543d5b676719df9fec8053b0a6f5aba40b98ca0d2bee11136f30"

build:
  deps:
    - cmake
    - pkgconf
    - name: gpgme
      kind: link
      compat: "2"
    - name: libgpg-error
      kind: link
      compat: "1"
  source:
    url: 'https://gnupg.org/ftp/gcrypt/gpgmepp/gpgmepp-{{.Version}}.tar.xz'
  output: out
  steps:
    # The output dir is the install prefix, with relative dirs, so the
    # exported CMake targets (GpgmeppConfig, which poppler consumes) stay
    # relocatable; nem re-roots the .pc file. CMake's find modules ignore
    # CPPFLAGS/LDFLAGS, so the dep prefixes are passed explicitly.
    - run: |
        set -e
        CXXFLAGS="$CPPFLAGS $CXXFLAGS" cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$NEM_OUTPUT" \
          -DCMAKE_PREFIX_PATH="$NEM_DEP_GPGME_PREFIX;$NEM_DEP_LIBGPG_ERROR_PREFIX" \
          -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_INCLUDEDIR=include \
          -DENABLE_SHARED=ON -DENABLE_STATIC=OFF
        cmake --build build -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        cmake --install build

test:
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/gpgme++/context.h" ]
      [ -f "$NEM_PREFIX/lib/cmake/Gpgmepp/GpgmeppConfig.cmake" ]
      ls "$NEM_PREFIX"/lib/libgpgmepp.* >/dev/null
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/gpgmepp.pc"
  # No gpg engine is needed: creating a context only needs the library.
  - run: |
      set -e
      command -v c++ >/dev/null || exit 0
      cat > probe.cpp <<'CEOF'
      #include <gpgme++/global.h>
      #include <gpgme++/context.h>
      #include <gpgme++/data.h>
      #include <iostream>
      int main() {
        GpgME::initializeLibrary();
        GpgME::Data d("nem", 3);
        std::cout << d.toString() << '\n';
        return 0;
      }
      CEOF
      c++ -std=c++17 $CPPFLAGS probe.cpp $LDFLAGS -lgpgmepp -lgpgme -o probe
      [ "$(./probe)" = nem ]
