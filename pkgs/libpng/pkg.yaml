schema: 3

name: libpng
description: Reference library for reading and writing PNG images
homepage: http://www.libpng.org/pub/png/libpng.html
license: libpng-2.0

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat "1.6" floats within 1.6.x; releases share the libpng16 soname.
deps:
  - name: zlib
    kind: link
    compat: "1"

bins: [bin]
libs: [lib]

# Tags mix 1.6.x releases with 1.7 betas; the filter keeps the stable line.
versionDiscovery:
  github:
    repo: pnggroup/libpng
    filter: '^v1\.6\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.6.59
    sourceSha256: "2540302a1844ad2b2b501977abecfa850f265f97b78f065a712ab4074a89f5b5"

build:
  deps:
    - cmake
    - name: zlib
      kind: link
      compat: "1"
  source:
    url: 'https://github.com/pnggroup/libpng/archive/refs/tags/v{{.Version}}.tar.gz'
  output: out
  steps:
    # The output dir is the install prefix, with relative dirs, so the
    # exported CMake targets stay relocatable (a bare "/" prefix forces
    # usr/ and bakes absolute paths into them); nem re-roots the .pc files.
    # CMake's find modules ignore CPPFLAGS/LDFLAGS, so the dep prefix is
    # passed explicitly, ahead of any system zlib.
    # On macOS libpng defaults to a framework bundle beside the dylib, which
    # CMake consumers then prefer; dependents link the dylib only.
    - run: |
        set -e
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$NEM_OUTPUT" \
          -DCMAKE_PREFIX_PATH="$NEM_DEP_ZLIB_PREFIX" \
          -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_INCLUDEDIR=include -DCMAKE_INSTALL_DATAROOTDIR=share \
          -DPNG_SHARED=ON -DPNG_STATIC=OFF -DPNG_FRAMEWORK=OFF -DPNG_TESTS=OFF -DPNG_TOOLS=ON
        cmake --build build -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        cmake --install build

test:
  - run: libpng16-config --version | grep -qx "$NEM_VERSION"
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/png.h" ]
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libpng16.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <png.h>
      #include <stdio.h>
      int main(void) {
        puts(png_get_header_ver(NULL));
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -lpng16 -o probe
      [ "$(./probe)" = "$NEM_VERSION" ]
