schema: 2
name: doctl
description: Command-line interface for the DigitalOcean API
homepage: https://docs.digitalocean.com/reference/doctl/
license: Apache-2.0

versionDiscovery:
  github:
    repo: digitalocean/doctl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/digitalocean/doctl/releases/download/v{{.Version}}/doctl-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "doctl", dst: "bin/doctl", mode: 0o755}

bins: ["bin"]

