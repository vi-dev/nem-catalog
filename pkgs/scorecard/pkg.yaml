schema: 3
name: scorecard
description: Security health metrics for open source projects
homepage: https://github.com/ossf/scorecard
license: Apache-2.0

versionDiscovery:
  github:
    repo: ossf/scorecard
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ossf/scorecard/releases/download/v{{.Version}}/scorecard_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "scorecard", dst: "bin/scorecard", mode: 0o755}

bins: ["bin"]

versions:
  - version: 5.6.0
    sha256:
      darwin/arm64: "1537183c0fcc6d8d1572aabc7a949091a36a2ee6be5bcb65f487cbb0a7b40381"
      darwin/amd64: "6eb92048bc537810d383d7e28233b2f118e78b6fef9e47b2c427c4d01fc096ad"
      linux/arm64: "3eacaceb3fdee6d0ba5df6ede45d1ada73321949029921bb63633802e8ec5951"
      linux/amd64: "19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a"
  - version: 5.5.0
    sha256:
      darwin/arm64: "bac6371a4f810d6bdd0b65d63c3311906bdfe3ba0d76a5ea743ce24ced170fcf"
      darwin/amd64: "979487ca20e726f6a4d2bd63a0a4c544184f589724b3d12d2ba8d0ea80889063"
      linux/arm64: "3ce59d20c1d53e540c4a14e0da1e0d96b3b294e8ddc96a3c5a7b8a637b32991e"
      linux/amd64: "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff"

test:
  - run: scorecard version | grep -q "$NEM_VERSION"
