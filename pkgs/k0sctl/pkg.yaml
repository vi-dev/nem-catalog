schemaVersion: 1
name: k0sctl
description: Bootstrap and manage k0s Kubernetes clusters over SSH
homepage: https://github.com/k0sproject/k0sctl
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: k0sproject/k0sctl
      # Raw per-platform binaries named k0sctl-<os>-<arch>; nem's default OS/arch
      # tokens (darwin/linux, amd64/arm64) already match the asset names.
      assetName: 'k0sctl-{{.OS}}-{{.Arch}}'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'checksums.txt'

install:
  - copy:
      from: "{{.Archive}}"
      to: "{{.InstallDir}}/bin/k0sctl"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/k0sctl", "version"]
