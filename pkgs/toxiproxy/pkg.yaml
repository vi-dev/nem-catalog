schema: 3
name: toxiproxy
description: TCP proxy for simulating network and system conditions
homepage: https://github.com/Shopify/toxiproxy
license: MIT

versionDiscovery:
  github:
    repo: Shopify/toxiproxy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Shopify/toxiproxy/releases/download/v{{.Version}}/toxiproxy_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "toxiproxy-server", dst: "bin/toxiproxy-server", mode: 0o755}
  - copy: {src: "toxiproxy-cli", dst: "bin/toxiproxy-cli", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.13.0
    sha256:
      darwin/arm64: "0890e2eef1ed4d269411a8eca591112b7401f61b04c7abc5c7d0cb2da33e2484"
      darwin/amd64: "00aa04549b98d158b5aa9c72eb1d6e269f7baffae50adfb626074ff708421c65"
      linux/arm64: "57f19b56ce146aa4e65e5363e42d8fd61bd01f586f710b9b4f75dbf27eeb99f0"
      linux/amd64: "08fd7b3d677bd11358d16a5ce8fd9e1a08f69aa24984bc16781c84200d6b3b4d"
  - version: 2.12.0
    sha256:
      darwin/arm64: "cece3905c06ad84d6b3bb4cd024c344e6466736b2a8cbaf9ef4fe45e62aba9b2"
      darwin/amd64: "52ac1f99d7204b4b523f910b791bc86318b50ef94822c79a6157606704003ced"
      linux/arm64: "ab417dafc77ae8b54ec8461cc5da5180d0465a61dcbda86c72da72ee4ab843b7"
      linux/amd64: "65e042d3fc2290c099527bc506446a6fd863a09f113b8944b636ece70221c2b3"

test:
  - run: toxiproxy-server --version | grep -q "$NEM_VERSION"
