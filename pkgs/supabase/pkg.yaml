schemaVersion: 1
name: supabase
description: Supabase CLI for managing local development and deployments
homepage: https://supabase.com
license: MIT

archive:
  fetch:
    github_release:
      repo: supabase/cli
      assetName: 'supabase_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'checksums.txt'

install:
  # Ships two root binaries: the user-invoked `supabase` dispatcher and the
  # `supabase-go` impl it spawns; both go on the install bin dir.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/supabase"
      to: "{{.InstallDir}}/bin/supabase"
  - copy:
      from: "{{.Var.src}}/supabase-go"
      to: "{{.InstallDir}}/bin/supabase-go"

test:
  - run:
      # supabase --version writes ~/.supabase; redirect HOME under the writable cwd.
      cmd: ["{{.InstallDir}}/bin/supabase", "--version"]
      env:
        HOME: nem-supabase-home
