schema: 2
name: pgroll
description: Zero-downtime, reversible schema migrations for Postgres
homepage: https://pgroll.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: xataio/pgroll
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/xataio/pgroll/releases/download/v{{.Version}}/pgroll.{{replace .OS \"darwin\" \"macos\"}}.{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/pgroll", mode: 0o755}

bins: ["bin"]

