schema: 2
name: bom
description: Generate SPDX bills of materials
homepage: https://kubernetes-sigs.github.io/bom/
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubernetes-sigs/bom
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubernetes-sigs/bom/releases/download/v{{.Version}}/bom-{{.Arch}}-{{.OS}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/bom", mode: 0o755}

bins: ["bin"]

test:
  - run: bom version 2>&1 | grep -q "$NEM_VERSION"

versions:
