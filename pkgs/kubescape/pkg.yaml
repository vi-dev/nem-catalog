schema: 2
name: kubescape
description: Kubernetes security, compliance, and misconfiguration scanner
homepage: https://kubescape.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubescape/kubescape
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubescape/kubescape/releases/download/v{{.Version}}/kubescape_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubescape", dst: "bin/kubescape", mode: 0o755}

bins: ["bin"]

