schemaVersion: 1
name: diskus
description: Minimal, fast alternative to du -sh
homepage: https://github.com/sharkdp/diskus
license: Apache-2.0 OR MIT

archive:
  fetch:
    github_release:
      repo: sharkdp/diskus
      assetName: 'diskus-{{.Version}}-{{.Arch}}-{{if eq .OS "darwin"}}apple-darwin{{else}}unknown-linux-gnu{{end}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        amd64: x86_64
        arm64: aarch64
  # diskus publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/diskus"
      to: "{{.InstallDir}}/bin/diskus"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/diskus", "--version"]
