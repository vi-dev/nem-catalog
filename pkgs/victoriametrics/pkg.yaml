schema: 2
name: victoriametrics
description: Time series database and monitoring solution
homepage: https://victoriametrics.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: VictoriaMetrics/VictoriaMetrics
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# The plain asset is the single-node build; -cluster and -enterprise
# variants share the same version and differ only by this suffix.
artifact:
  url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{.Version}}/victoria-metrics-{{.OS}}-{{.Arch}}-v{{.Version}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "victoria-metrics-prod", dst: "bin/victoria-metrics", mode: 0o755}

bins: ["bin"]

