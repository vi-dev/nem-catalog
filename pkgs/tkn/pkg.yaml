schema: 2
name: tkn
description: Tekton Pipelines CLI
homepage: https://tekton.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: tektoncd/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/tektoncd/cli/releases/download/v{{.Version}}/tkn_{{.Version}}_{{if eq .OS \"darwin\"}}Darwin_all{{else}}Linux_{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tkn", dst: "bin/tkn", mode: 0o755}

bins: ["bin"]

test:
  - run: tkn version | grep -q "$NEM_VERSION"

versions:
