schema: 3

name: brotli
description: Brotli lossless compression — CLI and libbrotli
homepage: https://github.com/google/brotli
license: MIT

platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: google/brotli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

bins: [bin]
libs: [lib]

versions:
  - version: 1.2.1
    sourceSha256: "98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f"
  - version: 1.2.0
    sourceSha256: "816c96e8e8f193b40151dad7e8ff37b1221d019dbcb9c35cd3fadbfe6477dfec"

build:
  deps:
    - cmake
  source:
    url: 'https://github.com/google/brotli/archive/refs/tags/v{{.Version}}.tar.gz'
  output: out
  steps:
    - run: |
        set -e
        # GNUInstallDirs remaps a bare "/" prefix onto /usr; absolute dirs
        # keep bin/ and lib/ at the archive root.
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/ \
          -DCMAKE_INSTALL_BINDIR=/bin -DCMAKE_INSTALL_LIBDIR=/lib \
          -DCMAKE_INSTALL_INCLUDEDIR=/include -DCMAKE_INSTALL_DATAROOTDIR=/share \
          -DBUILD_SHARED_LIBS=ON -DBROTLI_DISABLE_TESTS=ON
        cmake --build build -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        DESTDIR="$NEM_OUTPUT" cmake --install build

test:
  - run: brotli --version | grep -q "brotli $NEM_VERSION"
  - run: |
      set -e
      printf 'nem compresses' > plain.txt
      brotli plain.txt -o packed.br
      [ "$(brotli -dc packed.br)" = 'nem compresses' ]
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/brotli/encode.h" ]
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libbrotlienc.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <brotli/encode.h>
      #include <stdio.h>
      int main(void) {
        unsigned v = BrotliEncoderVersion();
        printf("%u.%u.%u\n", v >> 24, (v >> 12) & 0xFFF, v & 0xFFF);
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -lbrotlienc -lbrotlicommon -o probe
      [ "$(./probe)" = "$NEM_VERSION" ]
