schema: 2
name: earthly
description: Build automation with repeatable containerized builds
homepage: https://earthly.dev
license: BUSL-1.1

versionDiscovery:
  github:
    repo: earthly/earthly
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/earthly/earthly/releases/download/v{{.Version}}/earthly-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/earthly", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.8.16
    sha256:
      darwin/arm64: "4ac88e47414778f0a5af0f59637148c9b0eabc7c77cd77890e6cd99e3040a2b4"
      darwin/amd64: "1592cb497256577a76dda4e827010876eeeec05e76e3a203f60a68c71a80fc3a"
      linux/arm64: "dfdc3957f24754d66cea0c19a46bb542941132c9ccc81df7d71009ed79be54e8"
      linux/amd64: "3ef3163c81bdd10e28ab31cd96e35c1856d97478c8ce7f20954b8bea7a598404"

test:
  - run: earthly --version | grep -q "$NEM_VERSION"
