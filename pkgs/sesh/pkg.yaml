schema: 2
name: sesh
description: Smart session manager for tmux
homepage: https://github.com/joshmedeski/sesh
license: MIT

versionDiscovery:
  github:
    repo: joshmedeski/sesh
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/joshmedeski/sesh/releases/download/v{{.Version}}/sesh_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "sesh", dst: "bin/sesh", mode: 0o755}

bins: ["bin"]

