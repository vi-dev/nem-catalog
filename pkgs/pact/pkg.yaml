schema: 2
name: pact
description: Pact contract testing CLI, mock server and broker client
homepage: https://pact.io
license: MIT

versionDiscovery:
  github:
    repo: pact-foundation/pact-ruby-standalone
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/pact-foundation/pact-ruby-standalone/releases/download/v{{.Version}}/pact-{{.Version}}-{{replace .OS \"darwin\" \"macos\"}}-{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["bin"]

test:
  - run: pact-mock-service --help 2>&1 | grep -qi pact

