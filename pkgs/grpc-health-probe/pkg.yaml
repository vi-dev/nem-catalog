schema: 3
name: grpc-health-probe
description: Health checks for gRPC applications
homepage: https://github.com/grpc-ecosystem/grpc-health-probe
license: Apache-2.0

versionDiscovery:
  github:
    repo: grpc-ecosystem/grpc-health-probe
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/v{{.Version}}/grpc_health_probe-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/grpc_health_probe", mode: 0o755}

bins: ["bin"]

test:
  - run: grpc_health_probe -version 2>&1 | grep -q "$NEM_VERSION"

