schema: 3
name: atac
description: Terminal API client inspired by Postman
homepage: https://atac.julien-cpsn.com
license: MIT

versionDiscovery:
  github:
    repo: Julien-cpsn/ATAC
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Julien-cpsn/ATAC/releases/download/v{{.Version}}/atac-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "atac", dst: "bin/atac", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.24.0
    sha256:
      darwin/arm64: "1e7eca299b166215cf8aac346384e8be22694acb37c4384b5bda9d04afea7334"
      darwin/amd64: "33a6d9e2cd3201700c25dc289bbb5a1b64752b1860d9acce719d024efb81d8e6"
      linux/arm64: "b18b23addd2e2bd57a634fe50aac63c9ff324e2cfa39f0fd6bb7fdc27f53b8e7"
      linux/amd64: "cc9561783c82b317c1e2781c164fd46b65cd65db610cc2e67b39ab63d76014d1"
  - version: 0.23.1
    sha256:
      darwin/arm64: "a3204b7ccea12c2674762dea91ae14bdbd6395fac1ccad06a3728e257a94247d"
      darwin/amd64: "7505659829e026982de368b2a17fc0087dd0d83ee275da1c42575eaefa8dc3fa"
      linux/arm64: "fea0eb4adb7d3df156b94e95d74c59c7489da6d8c6ad5c0be0ca1e3b910952e4"
      linux/amd64: "dcd61727c3871e3643439dd32d3182995bb5337feeba5bdbbcd3d6432cf00618"

test:
  - run: atac --version | grep -q "$NEM_VERSION"
