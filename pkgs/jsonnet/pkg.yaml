schema: 2
name: jsonnet
description: Jsonnet configuration language interpreter and tools
homepage: https://jsonnet.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: google/go-jsonnet
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/google/go-jsonnet/releases/download/v{{.Version}}/go-jsonnet_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "jsonnet", dst: "bin/jsonnet", mode: 0o755}
  - copy: {src: "jsonnetfmt", dst: "bin/jsonnetfmt", mode: 0o755}
  - copy: {src: "jsonnet-lint", dst: "bin/jsonnet-lint", mode: 0o755}
  - copy: {src: "jsonnet-deps", dst: "bin/jsonnet-deps", mode: 0o755}

bins: ["bin"]

test:
  - run: jsonnet --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.22.0
    sha256:
      darwin/arm64: "112534191b6e27f2ae01bb80c6ab82950fb7bf5772e2e81c5472f59a069700f5"
      darwin/amd64: "2ada40ece13e8b4e1f37c06315783110c84b496963b0b8b90809daf69df7dfc9"
      linux/arm64: "3016b049254cb92548ba99304b6f44ec3795e6173f908e3ce3c5add57243fe20"
      linux/amd64: "e87a93ea44e34da92c15636205c7f2240bf3ac92d00ccb855dbb4e7e03ea6941"
