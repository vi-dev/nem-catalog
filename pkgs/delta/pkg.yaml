schemaVersion: 1
name: delta
description: Syntax-highlighting pager for git, diff, grep, and blame output
homepage: https://github.com/dandavison/delta
license: MIT

archive:
  fetch:
    github_release:
      repo: dandavison/delta
      assetName: 'delta-{{.Version}}-{{.Arch}}-{{.OS}}.tar.gz'
      # Tags are bare semver (0.19.2); capture it as the version.
      releaseFilter: '^(\d+\.\d+\.\d+)$'
      versionTemplate: "{{.Capture}}"
      templateOverrides:
        amd64: x86_64
        arm64: aarch64
        darwin: apple-darwin
        linux: unknown-linux-gnu
  # delta publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/delta"
      to: "{{.InstallDir}}/bin/delta"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/delta", "--version"]
