schemaVersion: 1
name: subfinder
description: Fast passive subdomain enumeration tool
homepage: https://github.com/projectdiscovery/subfinder
license: MIT

archive:
  fetch:
    github_release:
      repo: projectdiscovery/subfinder
      assetName: 'subfinder_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.zip'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: macOS
  verify:
    checksumGitHubAsset: 'subfinder_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/subfinder"
      to: "{{.InstallDir}}/bin/subfinder"

test:
  - run:
      # subfinder resolves its config dir from XDG_CONFIG_HOME before HOME; a CI
      # runner sets XDG_CONFIG_HOME to a read-only ~/.config, so a HOME-only
      # redirect is ignored. Point HOME and the XDG dirs at writable dirs under
      # the scratch cwd and pre-create them.
      script: |
        export HOME="$PWD/nem-subfinder-home"
        export XDG_CONFIG_HOME="$HOME/.config"
        export XDG_CACHE_HOME="$HOME/.cache"
        mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
        "$NEM_INSTALL_DIR/bin/subfinder" -version
