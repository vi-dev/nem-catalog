schema: 2
name: spacectl
description: Spacelift CLI
homepage: https://github.com/spacelift-io/spacectl
license: MIT

versionDiscovery:
  github:
    repo: spacelift-io/spacectl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/spacelift-io/spacectl/releases/download/v{{.Version}}/spacectl_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "spacectl", dst: "bin/spacectl", mode: 0o755}

bins: ["bin"]

test:
  - run: spacectl version | grep -q "$NEM_VERSION"

versions:
