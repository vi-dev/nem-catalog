schema: 2
name: tenv
description: Version manager for OpenTofu, Terraform, Terragrunt and Atmos
homepage: https://tofuutils.github.io/tenv/
license: Apache-2.0

versionDiscovery:
  github:
    repo: tofuutils/tenv
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/tofuutils/tenv/releases/download/v{{.Version}}/tenv_v{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tenv", dst: "bin/tenv", mode: 0o755}

bins: ["bin"]

test:
  - run: tenv version | grep -q "$NEM_VERSION"

versions:
