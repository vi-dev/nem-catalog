schema: 3
name: pscale
description: PlanetScale CLI
homepage: https://planetscale.com/cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: planetscale/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/planetscale/cli/releases/download/v{{.Version}}/pscale_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "pscale", dst: "bin/pscale", mode: 0o755}

bins: ["bin"]

test:
  - run: pscale version 2>&1 | grep -q "$NEM_VERSION"

