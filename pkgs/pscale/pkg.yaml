schemaVersion: 1
name: pscale
description: Command-line tool for the PlanetScale database platform
homepage: https://github.com/planetscale/cli
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: planetscale/cli
      # macOS assets use the token "macOS"; linux/amd64/arm64 use the defaults.
      assetName: 'pscale_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: macOS
  verify:
    checksumGitHubAsset: 'pscale_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # The binary sits at the archive root (no leading version dir).
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/pscale"
      to: "{{.InstallDir}}/bin/pscale"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/pscale", "--version"]
