schema: 2
name: statsd-exporter
description: StatsD to Prometheus metrics exporter
homepage: https://github.com/prometheus/statsd_exporter
license: Apache-2.0

versionDiscovery:
  github:
    repo: prometheus/statsd_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/prometheus/statsd_exporter/releases/download/v{{.Version}}/statsd_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "statsd_exporter", dst: "bin/statsd_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: statsd_exporter --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 0.31.0
    sha256:
      darwin/arm64: "ed6e6ea35b7c9eb83bd745071dad53d13fbf4cd70131145694040e29cb438975"
