schema: 2
name: jreleaser
description: Release projects to many targets from one config
homepage: https://jreleaser.org
license: Apache-2.0

versionDiscovery:
  github:
    repo: jreleaser/jreleaser
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/jreleaser/jreleaser/releases/download/v{{.Version}}/jreleaser-native-{{.Version}}-{{replace .OS \"darwin\" \"osx\"}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}.zip"

install:
  - extract: {strip: 1}

bins: ["bin"]

test:
  - run: jreleaser --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 1.26.0
    sha256:
