schema: 3
name: sbomqs
description: SBOM quality and compliance scoring
homepage: https://github.com/interlynk-io/sbomqs
license: Apache-2.0

versionDiscovery:
  github:
    repo: interlynk-io/sbomqs
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/interlynk-io/sbomqs/releases/download/v{{.Version}}/sbomqs_{{.Version}}_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "sbomqs", dst: "bin/sbomqs", mode: 0o755}

bins: ["bin"]

test:
  - run: sbomqs version 2>&1 | grep -q "$NEM_VERSION"

