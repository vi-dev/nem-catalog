schema: 2
name: kubectl-cnpg
description: Kubectl plugin for the CloudNativePG operator
homepage: https://cloudnative-pg.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: cloudnative-pg/cloudnative-pg
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v{{.Version}}/kubectl-cnpg_{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "kubectl-cnpg", dst: "bin/kubectl-cnpg", mode: 0o755}

bins: ["bin"]

test:
  - run: kubectl-cnpg version | grep -q "$NEM_VERSION"

versions:
  - version: 1.30.0
    sha256:
      darwin/arm64: "88bb6da8ca5b63b5a4e60dae88b320bdcba3a8843536ad86e0fe077765ff2bbc"
      darwin/amd64: "3325ff39ab3ab198753440f330fff2bcd02d72b00804d97e4257933c078942e5"
      linux/arm64: "633eec5eb13ec640284804338e64c09d3bdbf907734675dea9e30689eb77654a"
      linux/amd64: "33784dc3b61edb0ddb1a68db6ef045bd32daace5db2ec1f0a02e0e8185eef7eb"
