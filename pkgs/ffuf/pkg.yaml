schema: 2
name: ffuf
description: Web fuzzer for content and parameter discovery
homepage: https://github.com/ffuf/ffuf
license: MIT

versionDiscovery:
  github:
    repo: ffuf/ffuf
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/ffuf/ffuf/releases/download/v{{.Version}}/ffuf_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "ffuf", dst: "bin/ffuf", mode: 0o755}

bins: ["bin"]

