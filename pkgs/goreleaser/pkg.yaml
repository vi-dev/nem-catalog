schema: 3
name: goreleaser
description: Release automation for Go projects
homepage: https://goreleaser.com
license: MIT

deps:
  - go

versionDiscovery:
  github:
    repo: goreleaser/goreleaser
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/goreleaser/goreleaser/releases/download/v{{.Version}}/goreleaser_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "goreleaser", dst: "bin/goreleaser", mode: 0o755}

bins: ["bin"]

