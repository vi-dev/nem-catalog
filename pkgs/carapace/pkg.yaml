schema: 2
name: carapace
description: Multi-shell command completion binary
homepage: https://carapace.sh
license: MIT

versionDiscovery:
  github:
    repo: carapace-sh/carapace-bin
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/carapace-sh/carapace-bin/releases/download/v{{.Version}}/carapace-bin_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "carapace", dst: "bin/carapace", mode: 0o755}

bins: ["bin"]

test:
  - run: carapace --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 1.7.3
    sha256:
      darwin/arm64: "a7e79d8787ffc63c26568e8d8256d12df91f5cda0d9dc83d50e90b8567028a9d"
