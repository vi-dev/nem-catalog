schema: 2
name: restish
description: CLI for interacting with REST-ish HTTP APIs
homepage: https://rest.sh
license: MIT

versionDiscovery:
  github:
    repo: danielgtaylor/restish
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/danielgtaylor/restish/releases/download/v{{.Version}}/restish-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "restish", dst: "bin/restish", mode: 0o755}

bins: ["bin"]

test:
  - run: restish --version 2>&1 | grep -q "$NEM_VERSION"

versions:
