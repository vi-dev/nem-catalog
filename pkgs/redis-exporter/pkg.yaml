schema: 2
name: redis-exporter
description: Prometheus exporter for Redis and Valkey metrics
homepage: https://github.com/oliver006/redis_exporter
license: MIT

versionDiscovery:
  github:
    repo: oliver006/redis_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/oliver006/redis_exporter/releases/download/v{{.Version}}/redis_exporter-v{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "redis_exporter", dst: "bin/redis_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: redis_exporter --version 2>&1 | grep -q "$NEM_VERSION"

