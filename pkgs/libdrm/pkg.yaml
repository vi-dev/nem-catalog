schema: 3
name: libdrm
description: Direct Rendering Manager user-space library
homepage: https://dri.freedesktop.org/wiki/DRM/
license: MIT

platforms: [linux/arm64, linux/amd64]

libs: [lib]

versionDiscovery:
  http:
    url: https://dri.freedesktop.org/libdrm/
    filter: 'libdrm-(\d+\.\d+\.\d+)\.tar\.xz'

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 2.4.134
    sourceSha256: "ac5e74d157830eb8bee44c6a6bf3ad49774ef0dd2a72bdad74a8f20308b52a95"

build:
  deps:
    - meson
    - ninja
    - pkgconf
  source:
    url: 'https://dri.freedesktop.org/libdrm/libdrm-{{.Version}}.tar.xz'
  output: out
  steps:
    - run: |
        set -e
        meson setup build --prefix=/ --libdir=lib --buildtype=release \
          -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled \
          -Dvmwgfx=disabled -Domap=disabled -Dexynos=disabled -Dfreedreno=disabled \
          -Dtegra=disabled -Dvc4=disabled -Detnaviv=disabled \
          -Dudev=false -Dtests=false -Dman-pages=disabled -Dvalgrind=disabled -Dcairo-tests=disabled
        meson compile -C build
        meson install -C build --destdir "$NEM_OUTPUT"

test:
  - run: |
      set -e
      grep -q "^Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libdrm.pc"
      ls "$NEM_PREFIX"/lib/libdrm.so.2 >/dev/null
