schema: 2
name: cargo-shear
description: Remove unused dependencies from a Rust project
homepage: https://github.com/Boshen/cargo-shear
license: MIT

versionDiscovery:
  github:
    repo: Boshen/cargo-shear
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Boshen/cargo-shear/releases/download/v{{.Version}}/cargo-shear-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cargo-shear", dst: "bin/cargo-shear", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-shear --version 2>&1 | grep -q "$NEM_VERSION"

versions:
