schema: 2
name: azd
description: Azure Developer CLI
homepage: https://aka.ms/azd
license: MIT

versionDiscovery:
  github:
    repo: Azure/azure-dev
    filter: '^azure-dev-cli_\d+\.\d+\.\d+$'
    prefix: "azure-dev-cli_"

artifact:
  url: "https://github.com/Azure/azure-dev/releases/download/azure-dev-cli_{{.Version}}/azd-{{.OS}}-{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 0}
  - copy: {src: "azd-{{.OS}}-{{.Arch}}", dst: "bin/azd", mode: 0o755}

bins: ["bin"]

test:
  - run: azd version 2>&1 | grep -q "$NEM_VERSION"

