schema: 3
name: pike
description: Determine the IAM permissions required by infrastructure-as-code
homepage: https://github.com/JamesWoolfenden/pike
license: Apache-2.0

versionDiscovery:
  github:
    repo: JamesWoolfenden/pike
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/JamesWoolfenden/pike/releases/download/v{{.Version}}/pike_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "pike", dst: "bin/pike", mode: 0o755}

bins: ["bin"]

test:
  - run: pike version | grep -q "$NEM_VERSION"

