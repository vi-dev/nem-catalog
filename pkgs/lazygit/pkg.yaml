schema: 3
name: lazygit
description: Simple terminal UI for git commands
homepage: https://github.com/jesseduffield/lazygit
license: MIT

versionDiscovery:
  github:
    repo: jesseduffield/lazygit
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/jesseduffield/lazygit/releases/download/v{{.Version}}/lazygit_{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "lazygit", dst: "bin/lazygit", mode: 0o755}

bins: ["bin"]

