schemaVersion: 1
name: sqruff
description: Fast SQL formatter and linter
homepage: https://github.com/quarylabs/sqruff
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: quarylabs/sqruff
      # macOS ships glibc-agnostic builds; Linux is musl-only (…-<arch>-musl).
      assetName: 'sqruff-{{.OS}}-{{.Arch}}{{if eq .OS "linux"}}-musl{{end}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        amd64: x86_64
        arm64: aarch64
  verify:
    # Each asset has a single-line <asset>.tar.gz.sha256 sidecar.
    checksumGitHubAsset: 'sqruff-{{.OS}}-{{.Arch}}{{if eq .OS "linux"}}-musl{{end}}.tar.gz.sha256'

install:
  # Archive is a single flat sqruff binary.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/sqruff"
      to: "{{.InstallDir}}/bin/sqruff"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/sqruff", "--version"]
