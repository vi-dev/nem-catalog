schema: 2
name: groovy
description: The Apache Groovy programming language
homepage: https://groovy-lang.org
license: Apache-2.0

deps:
  - jdk25

versionDiscovery:
  http:
    url: https://archive.apache.org/dist/groovy/
    filter: 'href="(\d+\.\d+\.\d+)/"'

artifact:
  url: "https://archive.apache.org/dist/groovy/{{.Version}}/distribution/apache-groovy-binary-{{.Version}}.zip"

install:
  - extract: {strip: 1}

bins: ["bin"]

versions:
  - version: 5.1.2
    sha256:
      darwin/arm64: "19cd28c23c34f8b52f1bb602da9186792b7464e35dd8300d84f6735b8ad3965f"
      darwin/amd64: "19cd28c23c34f8b52f1bb602da9186792b7464e35dd8300d84f6735b8ad3965f"
      linux/arm64: "19cd28c23c34f8b52f1bb602da9186792b7464e35dd8300d84f6735b8ad3965f"
      linux/amd64: "19cd28c23c34f8b52f1bb602da9186792b7464e35dd8300d84f6735b8ad3965f"

test:
  - run: groovy --version | grep -q "$NEM_VERSION"
