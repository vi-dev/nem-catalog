schema: 3
name: slumber
description: Terminal-based HTTP and REST client
homepage: https://slumber.lucaspickering.me
license: MIT

versionDiscovery:
  github:
    repo: LucasPickering/slumber
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/LucasPickering/slumber/releases/download/v{{.Version}}/slumber-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.xz"

install:
  - extract: {strip: 1}
  - copy: {src: "slumber", dst: "bin/slumber", mode: 0o755}

bins: ["bin"]

versions:
  - version: 5.4.0
    sha256:
      darwin/arm64: "abe708e776c6dc76b1b5c3ff64b29d5554eb6d66d3d2a12dbe50fe58fb7605c1"
      darwin/amd64: "c8480c5095d85d5140be7c9216d5927f93b60151ce8f5f761bef0f9f38010131"
      linux/arm64: "e070a543943607a52995d7770aed6017f5e890394ff2dc85dd33b70c81a2e4e8"
      linux/amd64: "21eb7ed8e4c329a26252de1ccda5dcee86664d29cb6a6bbdaf696261662b8810"
  - version: 5.3.0
    sha256:
      darwin/arm64: "c34cd826d7bc32e640e8b435172a4487b37d3cdce18c59914dee06e215d9b26a"
      darwin/amd64: "96d5b3a226b2c309e9985568d5ea0b4cd6e9a72ed2cff9e884999c66b3ab724e"
      linux/arm64: "b85f6bbfd47ca3f04065aee0cb92ee04cef0a234c8a2971ee2a6fc81278675ad"
      linux/amd64: "3a813dcbed2b28a4438f9cb777566d8c06f026aa74e0623706ca4a2c48e2a8b4"

test:
