schema: 3
name: dufs
description: File server with static serving, upload, search and WebDAV
homepage: https://github.com/sigoden/dufs
license: Apache-2.0

versionDiscovery:
  github:
    repo: sigoden/dufs
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sigoden/dufs/releases/download/v{{.Version}}/dufs-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "dufs", dst: "bin/dufs", mode: 0o755}

bins: ["bin"]

test:
  - run: dufs --version 2>&1 | grep -q "$NEM_VERSION"

