schemaVersion: 1
name: kube-linter
description: Static analysis tool for Kubernetes YAML and Helm charts
homepage: https://github.com/stackrox/kube-linter
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: stackrox/kube-linter
      # amd64 assets carry no arch token (kube-linter-<os>.tar.gz); arm64 assets
      # append _arm64. Emitting _arm64 only for arm64 keeps the arch encoded so a
      # missing platform 404s instead of serving a wrong-arch binary.
      assetName: 'kube-linter-{{.OS}}{{if eq .Arch "arm64"}}_arm64{{end}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  # kube-linter publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  # The tarball roots at LICENSE, README.md, and the kube-linter binary (no dir).
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/kube-linter"
      to: "{{.InstallDir}}/bin/kube-linter"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/kube-linter", "version"]
