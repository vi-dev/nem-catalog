schema: 3
name: fd
description: Simple, fast and user-friendly alternative to find
homepage: https://github.com/sharkdp/fd
license: MIT OR Apache-2.0

# Upstream stopped shipping x86_64-apple-darwin binaries after 10.3.0.
platforms: [darwin/arm64, linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: sharkdp/fd
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sharkdp/fd/releases/download/v{{.Version}}/fd-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "fd", dst: "bin/fd", mode: 0o755}

bins: ["bin"]

versions:
  - version: 10.5.2
    sha256:
      darwin/arm64: "81bf98a16d3d7230e4a9123fcede243d71ea31a577113476ed43f1cdf4773162"
      linux/arm64: "63ea52cb31586e6d98efa2f06d73d542f16c7d0c4af0f07b579aaf9714cf907a"
      linux/amd64: "7e2d07fa2b8807642aaec67b7e2972a9fbe4db26fcb340a7372392db42b26694"
  - version: 10.5.1
    sha256:
      darwin/arm64: "2d336895ed27b14c5cc9fc5eb22df03b3ee842b5dce80060e99d9cdc1b1b9fc7"
      linux/arm64: "64c20b9b154c9d4b36d4b7df3521de771c499c4768b4b5b045ef6b01532117be"
      linux/amd64: "f6c95edb190c241df6fddc815a5bab4051444993ac5d92ddc6eec0e0dc2342c7"
  - version: 10.5.0
    sha256:
      darwin/arm64: "b67e1836c468e42e411984b56e52fa7abec08c2bd22c867398e7cc134aac5e12"
      linux/arm64: "d76c4317f7d5dba69f8a2a15856c90c777e7f0dd4e85f0de8c76de6992c374d4"
      linux/amd64: "761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7"
  - version: 10.4.2
    sha256:
      darwin/arm64: "623dc0afc81b92e4d4606b380d7bc91916ba7b97814263e554d50923a39e480a"
      linux/arm64: "f32d3657473fba74e2600babc8db0b93420d51169223b7e8143b2ed55d8fd9e8"
      linux/amd64: "e3257d48e29a6be965187dbd24ce9af564e0fe67b3e73c9bdcd180f4ec11bdde"

test:
  - run: fd --version | grep -q "$NEM_VERSION"
  - run: |
      set -e
      mkdir -p tree/sub && : > tree/sub/needle.txt && : > tree/other.md
      [ "$(fd --base-directory tree needle)" = "sub/needle.txt" ]
