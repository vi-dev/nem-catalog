schemaVersion: 1
name: vals
description: Helm-like configuration values loader with support for various sources
homepage: https://github.com/helmfile/vals
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: helmfile/vals
      assetName: 'vals_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: 'vals_{{.Version | trimPrefix "v"}}_checksums.txt'

install:
  # Archive roots directly at vals + LICENSE + README.md, no leading dir.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/vals"
      to: "{{.InstallDir}}/bin/vals"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/vals", "version"]
