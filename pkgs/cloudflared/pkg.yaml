schema: 2
name: cloudflared
description: Cloudflare Tunnel client
homepage: https://github.com/cloudflare/cloudflared
license: Apache-2.0

versionDiscovery:
  github:
    repo: cloudflare/cloudflared
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/cloudflare/cloudflared/releases/download/{{.Version}}/cloudflared-{{.OS}}-{{.Arch}}{{if eq .OS \"darwin\"}}.tgz{{end}}"

install:
  # darwin ships a tarball, linux a raw binary
  - extract: {strip: 0}
    platforms: [darwin]
  - copy: {src: "cloudflared", dst: "bin/cloudflared", mode: 0o755}
    platforms: [darwin]
  - copy: {src: "{{.Artifact}}", dst: "bin/cloudflared", mode: 0o755}
    platforms: [linux]

bins: ["bin"]

