schema: 2
name: sshs
description: Terminal user interface for SSH
homepage: https://github.com/quantumsheep/sshs
license: MIT

versionDiscovery:
  github:
    repo: quantumsheep/sshs
    filter: '^\d+\.\d+\.\d+$'
    prefix: ""

artifact:
  url: "https://github.com/quantumsheep/sshs/releases/download/{{.Version}}/sshs-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/sshs", mode: 0o755}

bins: ["bin"]

test:
  - run: sshs --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 4.8.0
    sha256:
      darwin/arm64: "457c41e2965807c64aaaf96fac4d8393fb3761b697f6c339bd21450835f22e05"
