schema: 2
name: cloudquery
description: Data integration platform syncing sources into destinations
homepage: https://www.cloudquery.io
license: MPL-2.0

versionDiscovery:
  github:
    repo: cloudquery/cloudquery
    # Monorepo: plugins tag alongside the CLI, so match the cli- tags only.
    filter: '^cli-v\d+\.\d+\.\d+$'
    prefix: "cli-v"

artifact:
  url: "https://github.com/cloudquery/cloudquery/releases/download/cli-v{{.Version}}/cloudquery_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/cloudquery", mode: 0o755}

bins: ["bin"]

