schema: 2
name: tfswitch
description: Switch between Terraform versions
homepage: https://tfswitch.warrensbox.com
license: MIT

versionDiscovery:
  github:
    repo: warrensbox/terraform-switcher
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/warrensbox/terraform-switcher/releases/download/v{{.Version}}/terraform-switcher_v{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "tfswitch", dst: "bin/tfswitch", mode: 0o755}

bins: ["bin"]

test:
  - run: tfswitch --version | grep -q "$NEM_VERSION"

versions:
