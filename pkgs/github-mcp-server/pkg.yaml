schema: 2
name: github-mcp-server
description: MCP server for GitHub repositories, issues, and pull requests
homepage: https://github.com/github/github-mcp-server
license: MIT

versionDiscovery:
  github:
    repo: github/github-mcp-server
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/github/github-mcp-server/releases/download/v{{.Version}}/github-mcp-server_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "github-mcp-server", dst: "bin/github-mcp-server", mode: 0o755}

bins: ["bin"]

