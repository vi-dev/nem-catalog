schemaVersion: 1
name: reflex
description: Run a command when files change
homepage: https://github.com/cespare/reflex
license: MIT

archive:
  fetch:
    github_release:
      repo: cespare/reflex
      assetName: 'reflex_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  # Each asset ships a single-line <asset>.tar.gz.sha256 sidecar; nem reads the
  # first field as the digest, so the sidecar's release/ path prefix is irrelevant.
  verify:
    checksumGitHubAsset: 'reflex_{{.OS}}_{{.Arch}}.tar.gz.sha256'

install:
  # Archive roots at reflex_<os>_<arch>/ holding the binary and its LICENSE.
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/reflex"
      to: "{{.InstallDir}}/bin/reflex"

test:
  # reflex is a long-running file watcher with no --version/--help exit-0 path:
  # every flag/config error is a log.Fatal (exit 1), and it exits 0 only through
  # its SIGTERM/SIGINT cleanup handler. So the smoke test starts the real watcher,
  # gives it a moment, then SIGTERMs it. Exit 0 (handler was up, clean shutdown)
  # and exit 143 (our own TERM landed before the handler — the 1s grace can be
  # outrun on a loaded host, e.g. parallel batch lint) both prove the watcher
  # started and stayed alive; any other exit is a real startup failure. It
  # watches the sandbox scratch cwd and writes nothing.
  - run:
      script: |
        "$NEM_INSTALL_DIR/bin/reflex" -r 'zzz_nem_smoke_no_match_zzz' true &
        pid=$!
        sleep 1
        kill -TERM "$pid"
        rc=0
        wait "$pid" || rc=$?
        [ "$rc" -eq 0 ] || [ "$rc" -eq 143 ]
