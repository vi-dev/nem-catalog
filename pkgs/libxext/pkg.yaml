schema: 3
name: libxext
description: X11 miscellaneous extensions library
homepage: https://gitlab.freedesktop.org/xorg/lib/libxext
license: MIT

platforms: [linux/arm64, linux/amd64]

# compat "1" floats within 1.x; releases share the libXext.so.6 soname.
deps:
  - name: libx11
    kind: link
    compat: "1"
  - name: xorgproto
    kind: link

libs: [lib]

versionDiscovery:
  git:
    url: https://gitlab.freedesktop.org/xorg/lib/libxext.git
    filter: '^libXext-\d+\.\d+\.\d+$'
    prefix: "libXext-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 1.3.7
    sourceSha256: "6c643c7035cdacf67afd68f25d01b90ef889d546c9fcd7c0adf7c2cf91e3a32d"

build:
  deps:
    - pkgconf
    - name: xorgproto
      kind: link
    - name: libx11
      kind: link
      compat: "1"
  source:
    url: 'https://xorg.freedesktop.org/archive/individual/lib/libXext-{{.Version}}.tar.xz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --disable-static --disable-dependency-tracking --disable-specs
        make -j"$(nproc)"
        make install DESTDIR="$NEM_OUTPUT"

test:
  - run: |
      set -e
      grep -q "^Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/xext.pc"
      ls "$NEM_PREFIX"/lib/libXext.so.6 >/dev/null
