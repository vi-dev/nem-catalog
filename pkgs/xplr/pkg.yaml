schema: 2
name: xplr
description: Hackable TUI file explorer
homepage: https://xplr.dev
license: MIT

versionDiscovery:
  github:
    repo: sayanarijit/xplr
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

# amd64 assets carry no arch suffix; only arm64 is spelled out.
artifact:
  url: "https://github.com/sayanarijit/xplr/releases/download/v{{.Version}}/xplr-{{if eq .OS \"darwin\"}}macos{{else}}linux{{end}}{{if eq .Arch \"arm64\"}}-aarch64{{end}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "xplr", dst: "bin/xplr", mode: 0o755}

bins: ["bin"]

