schema: 3
name: code-server
description: VS Code in the browser
homepage: https://coder.com
license: MIT

versionDiscovery:
  github:
    repo: coder/code-server
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/coder/code-server/releases/download/v{{.Version}}/code-server-{{.Version}}-{{replace .OS \"darwin\" \"macos\"}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["bin"]

test:
  - run: code-server --version 2>&1 | grep -q "$NEM_VERSION"

