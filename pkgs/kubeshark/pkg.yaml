schema: 2
name: kubeshark
description: Network observability and API traffic analyzer for Kubernetes
homepage: https://kubeshark.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: kubeshark/kubeshark
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/kubeshark/kubeshark/releases/download/v{{.Version}}/kubeshark_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/kubeshark", mode: 0o755}

bins: ["bin"]

test:
  - run: kubeshark version | grep -q "$NEM_VERSION"

