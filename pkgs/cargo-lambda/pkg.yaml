schema: 2
name: cargo-lambda
description: Cargo subcommand for AWS Lambda functions in Rust
homepage: https://www.cargo-lambda.info
license: MIT

versionDiscovery:
  github:
    repo: cargo-lambda/cargo-lambda
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/cargo-lambda/cargo-lambda/releases/download/v{{.Version}}/cargo-lambda-v{{.Version}}.{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cargo-lambda", dst: "bin/cargo-lambda", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-lambda lambda --version 2>&1 | grep -q "$NEM_VERSION"

versions:
