schema: 3

name: pcre2
description: Perl-compatible regular expression library with JIT
homepage: https://github.com/PCRE2Project/pcre2
license: BSD-3-Clause

platforms: [darwin/arm64, linux/arm64, linux/amd64]

bins: [bin]
libs: [lib]

versionDiscovery:
  github:
    repo: PCRE2Project/pcre2
    filter: '^pcre2-\d+\.\d+$'
    prefix: "pcre2-"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 10.49
    sourceSha256: "929f0b20e62879252a15886b06c89f1edef61a363cbd5826fb041080a5e557ae"
  - version: 10.48
    sourceSha256: "ebcc25aadf2a51fa1fefa9b8bc9e7a79b3dae86870a0f1152a22e42befd46888"
  - version: 10.47
    sourceSha256: "c08ae2388ef333e8403e670ad70c0a11f1eed021fd88308d7e02f596fcd9dc16"

build:
  source:
    url: 'https://github.com/PCRE2Project/pcre2/releases/download/pcre2-{{.Version}}/pcre2-{{.Version}}.tar.gz'
  output: out
  steps:
    - run: |
        set -e
        # Extraction skews mtimes; one shared stamp stops make regenerating
        # pregenerated files.
        find . -exec touch -t 202001010000 {} +
        ./configure --prefix=/ --libdir=/lib --disable-static --disable-dependency-tracking \
          --enable-jit --enable-pcre2-16 --enable-pcre2-32
        make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        make install DESTDIR="$NEM_OUTPUT"
        rm -f "$NEM_OUTPUT/lib/"*.la

test:
  - run: pcre2-config --version | grep -qx "$NEM_VERSION"
  - run: pcre2test --version | grep -q "PCRE2 version $NEM_VERSION "
  - run: |
      set -e
      [ "$(echo abc123 | pcre2grep -o '\d+')" = 123 ]
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/pcre2.h" ]
      ls "$NEM_PREFIX"/lib/libpcre2-8.* >/dev/null
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libpcre2-8.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #define PCRE2_CODE_UNIT_WIDTH 8
      #include <pcre2.h>
      #include <stdio.h>
      int main(void) {
        char buf[64];
        if (pcre2_config(PCRE2_CONFIG_VERSION, buf) < 0) return 1;
        puts(buf);
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -lpcre2-8 -o probe
      ./probe | grep -q "^$NEM_VERSION "
