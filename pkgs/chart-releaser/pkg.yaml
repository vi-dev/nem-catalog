schema: 3
name: chart-releaser
description: Host Helm charts via GitHub Pages and Releases
homepage: https://github.com/helm/chart-releaser
license: Apache-2.0

versionDiscovery:
  github:
    repo: helm/chart-releaser
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/helm/chart-releaser/releases/download/v{{.Version}}/chart-releaser_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "cr", dst: "bin/cr", mode: 0o755}

bins: ["bin"]

test:
  - run: cr version | grep -q "$NEM_VERSION"

