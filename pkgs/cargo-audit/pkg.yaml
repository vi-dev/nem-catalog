schema: 2
name: cargo-audit
description: Audit Cargo.lock for crates with security vulnerabilities
homepage: https://rustsec.org
license: MIT OR Apache-2.0

versionDiscovery:
  github:
    repo: rustsec/rustsec
    filter: '^cargo-audit/v\d+\.\d+\.\d+$'
    prefix: "cargo-audit/v"

artifact:
  url: "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v{{.Version}}/cargo-audit-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}-v{{.Version}}.tgz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-audit", dst: "bin/cargo-audit", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-audit --version 2>&1 | grep -q "$NEM_VERSION"

versions:
