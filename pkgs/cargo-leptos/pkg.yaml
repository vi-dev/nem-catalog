schema: 2
name: cargo-leptos
description: Build tool for Leptos web applications
homepage: https://github.com/leptos-rs/cargo-leptos
license: MIT

versionDiscovery:
  github:
    repo: leptos-rs/cargo-leptos
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/leptos-rs/cargo-leptos/releases/download/v{{.Version}}/cargo-leptos-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "cargo-leptos", dst: "bin/cargo-leptos", mode: 0o755}

bins: ["bin"]

test:
  - run: cargo-leptos --version 2>&1 | grep -q "$NEM_VERSION"

versions:
