schema: 3
name: turso
description: Command-line interface for the Turso database platform
homepage: https://turso.tech
license: MIT

versionDiscovery:
  github:
    repo: tursodatabase/turso-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/tursodatabase/turso-cli/releases/download/v{{.Version}}/turso-cli_{{replace (replace .OS \"darwin\" \"Darwin\") \"linux\" \"Linux\"}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "turso", dst: "bin/turso", mode: 0o755}

