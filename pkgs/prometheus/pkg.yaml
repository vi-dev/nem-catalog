schema: 2
name: prometheus
description: Monitoring system and time series database
homepage: https://prometheus.io
license: Apache-2.0

versionDiscovery:
  github:
    repo: prometheus/prometheus
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/prometheus/prometheus/releases/download/v{{.Version}}/prometheus-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "prometheus", dst: "bin/prometheus", mode: 0o755}
  - copy: {src: "promtool", dst: "bin/promtool", mode: 0o755}

bins: ["bin"]

