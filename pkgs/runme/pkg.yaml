schema: 3
name: runme
description: Run commands and workflows defined in markdown documents
homepage: https://runme.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: runmedev/runme
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/runmedev/runme/releases/download/v{{.Version}}/runme_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "runme", dst: "bin/runme", mode: 0o755}

