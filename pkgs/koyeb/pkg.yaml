schema: 2
name: koyeb
description: Koyeb CLI
homepage: https://github.com/koyeb/koyeb-cli
license: Apache-2.0

versionDiscovery:
  github:
    repo: koyeb/koyeb-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/koyeb/koyeb-cli/releases/download/v{{.Version}}/koyeb-cli_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "koyeb", dst: "bin/koyeb", mode: 0o755}

bins: ["bin"]

test:
  - run: koyeb version 2>&1 | grep -q "$NEM_VERSION"

versions:
