schemaVersion: 1
name: process-compose
description: Scheduler and orchestrator to manage non-containerized applications
homepage: https://github.com/F1bonacc1/process-compose
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: F1bonacc1/process-compose
      assetName: 'process-compose_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  verify:
    checksumGitHubAsset: process-compose_checksums.txt

install:
  # The tarball holds the binary at its root alongside LICENSE/README, no leading dir.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/process-compose"
      to: "{{.InstallDir}}/bin/process-compose"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/process-compose", "version"]
