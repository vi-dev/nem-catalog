schema: 3
name: process-compose
description: Scheduler and orchestrator for non-containerized processes
homepage: https://github.com/F1bonacc1/process-compose
license: Apache-2.0

versionDiscovery:
  github:
    repo: F1bonacc1/process-compose
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/F1bonacc1/process-compose/releases/download/v{{.Version}}/process-compose_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "process-compose", dst: "bin/process-compose", mode: 0o755}

bins: ["bin"]

