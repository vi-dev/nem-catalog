schema: 3
name: katana
description: Web crawling and spidering framework
homepage: https://github.com/projectdiscovery/katana
license: MIT

versionDiscovery:
  github:
    repo: projectdiscovery/katana
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/projectdiscovery/katana/releases/download/v{{.Version}}/katana_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "katana", dst: "bin/katana", mode: 0o755}

bins: ["bin"]

