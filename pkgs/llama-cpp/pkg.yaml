schema: 2
name: llama-cpp
description: LLM inference in C/C++ with the llama.cpp toolset
homepage: https://github.com/ggml-org/llama.cpp
license: MIT

deps:
  - name: libgomp
    kind: link
    platforms: [linux/arm64, linux/amd64]

versionDiscovery:
  github:
    repo: ggml-org/llama.cpp
    filter: '^b\d+$'

artifact:
  url: "https://github.com/ggml-org/llama.cpp/releases/download/{{.Version}}/llama-{{.Version}}-bin-{{replace (replace .OS \"darwin\" \"macos\") \"linux\" \"ubuntu\"}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["."]

test:
  - run: llama-cli --version 2>&1 | grep -q "${NEM_VERSION#b}"

