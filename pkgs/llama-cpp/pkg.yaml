schema: 3
name: llama-cpp
description: LLM inference in C/C++ with the llama.cpp toolset
homepage: https://github.com/ggml-org/llama.cpp
license: MIT

deps:
  - name: libgomp
    kind: link
    platforms: [linux/arm64, linux/amd64]

versionDiscovery:
  http:
    url: https://api.github.com/repos/ggml-org/llama.cpp/releases/latest
    filter: '"tag_name":\s*"v(?P<version>\d+\.\d+\.\d+)"[\s\S]*?\*\*Nightly build:\*\*\s*\[(?P<build>b\d+)\]'

artifact:
  url: "https://github.com/ggml-org/llama.cpp/releases/download/{{.Meta.build}}/llama-{{.Meta.build}}-bin-{{replace (replace .OS \"darwin\" \"macos\") \"linux\" \"ubuntu\"}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 1}

bins: ["."]

test:
  - run: 'llama-cli --version 2>&1 | grep -q "version: ${NEM_VERSION}"'

