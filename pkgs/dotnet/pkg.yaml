schema: 3
name: dotnet
description: The .NET SDK and runtime
homepage: https://dotnet.microsoft.com
license: MIT

versionDiscovery:
  http:
    url: https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json
    filter: '"latest-sdk": "(\d+\.\d+\.\d+)"'

artifact:
  url: "https://builds.dotnet.microsoft.com/dotnet/Sdk/{{.Version}}/dotnet-sdk-{{.Version}}-{{replace (replace .OS \"darwin\" \"osx\") \"linux\" \"linux\"}}-{{replace .Arch \"amd64\" \"x64\"}}.tar.gz"

install:
  - extract: {strip: 0}

bins: ["."]

env:
  - name: DOTNET_ROOT
    value: "{{.InstallDir}}"
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: "1"
  - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
    value: "1"
    platforms: [linux]

