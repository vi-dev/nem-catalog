schema: 3
name: zls
description: Language server for Zig
homepage: https://zigtools.org
license: MIT

versionDiscovery:
  github:
    repo: zigtools/zls
    filter: '^\d+\.\d+\.\d+$'

artifact:
  url: "https://github.com/zigtools/zls/releases/download/{{.Version}}/zls-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace .OS \"darwin\" \"macos\"}}.tar.xz"

install:
  - extract: {strip: 0}
  - copy: {src: "zls", dst: "bin/zls", mode: 0o755}

