schema: 2
name: upctl
description: UpCloud CLI
homepage: https://upcloudltd.github.io/upcloud-cli/
license: MIT

versionDiscovery:
  github:
    repo: UpCloudLtd/upcloud-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/UpCloudLtd/upcloud-cli/releases/download/v{{.Version}}/upcloud-cli_{{.Version}}_{{.OS}}_{{replace .Arch \"amd64\" \"x86_64\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "upctl", dst: "bin/upctl", mode: 0o755}

bins: ["bin"]

test:
  - run: upctl version 2>&1 | grep -q "$NEM_VERSION"

versions:
