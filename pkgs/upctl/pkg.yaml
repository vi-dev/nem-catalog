schemaVersion: 1
name: upctl
description: Command-line interface for managing UpCloud services
homepage: https://github.com/UpCloudLtd/upcloud-cli
license: MIT

archive:
  fetch:
    github_release:
      repo: UpCloudLtd/upcloud-cli
      # darwin/linux keep the default .OS; arch is x86_64 or arm64 (arm64 needs no override).
      assetName: 'upcloud-cli_{{.Version | trimPrefix "v"}}_{{.OS}}_{{.Arch}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
      templateOverrides:
        amd64: x86_64
  verify:
    checksumGitHubAsset: 'checksums.txt'

install:
  # Binary sits at the archive root alongside LICENSE/README; no leading dir.
  - extract:
      from: "{{.Archive}}"
      as: src
  - copy:
      from: "{{.Var.src}}/upctl"
      to: "{{.InstallDir}}/bin/upctl"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/upctl", "version"]
