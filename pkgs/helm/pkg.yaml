schema: 2
name: helm
description: The Kubernetes package manager
homepage: https://helm.sh
license: Apache-2.0

versionDiscovery:
  github:
    repo: helm/helm
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
