schema: 3
name: rekor-cli
description: CLI for the Rekor transparency log
homepage: https://sigstore.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: sigstore/rekor
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/sigstore/rekor/releases/download/v{{.Version}}/rekor-cli-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/rekor-cli", mode: 0o755}

bins: ["bin"]

test:
  - run: rekor-cli version 2>&1 | grep -q "$NEM_VERSION"

