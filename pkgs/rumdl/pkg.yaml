schema: 2
name: rumdl
description: Fast Markdown linter and formatter
homepage: https://github.com/rvben/rumdl
license: MIT

versionDiscovery:
  github:
    repo: rvben/rumdl
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/rvben/rumdl/releases/download/v{{.Version}}/rumdl-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "rumdl", dst: "bin/rumdl", mode: 0o755}

bins: ["bin"]

test:
  - run: rumdl --version 2>&1 | grep -q "$NEM_VERSION"

versions:
