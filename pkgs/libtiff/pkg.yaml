schema: 3

name: libtiff
description: TIFF image library and tools (tiffinfo, tiffcp, ppm2tiff, …)
homepage: https://libtiff.gitlab.io/libtiff/
license: libtiff

platforms: [darwin/arm64, linux/arm64, linux/amd64]

# compat "4" floats within 4.x; releases share the libtiff.6 soname.
deps:
  - name: zlib
    kind: link
    compat: "1"
  - name: libjpeg-turbo
    kind: link
    compat: "3"
  - name: zstd
    kind: link
    compat: "1"
  - name: xz
    kind: link
    compat: "5"

bins: [bin]
libs: [lib]

versionDiscovery:
  gitlab:
    repo: libtiff/libtiff
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  oci: ":{{.Version}}"

install:
  - extract: {strip: 0}

versions:
  - version: 4.7.2
    sourceSha256: "4996f0c4f93094719b1ca5c6279b20e588773ba8a247533e486416fb662ddb88"

build:
  deps:
    - cmake
    - pkgconf
    - name: zlib
      kind: link
      compat: "1"
    - name: libjpeg-turbo
      kind: link
      compat: "3"
    - name: zstd
      kind: link
      compat: "1"
    - name: xz
      kind: link
      compat: "5"
  source:
    url: 'https://download.osgeo.org/libtiff/tiff-{{.Version}}.tar.xz'
  output: out
  steps:
    # The output dir is the install prefix, with relative dirs, so the
    # exported CMake targets stay relocatable (a bare "/" prefix forces
    # usr/ and bakes absolute paths into them); nem re-roots the .pc files.
    # CMake's find modules ignore CPPFLAGS/LDFLAGS, so the dep prefixes are
    # passed explicitly. Codecs are pinned so a missing dependency fails the
    # build; libdeflate, WebP, JBIG and LERC are not in the catalog.
    - run: |
        set -e
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$NEM_OUTPUT" \
          -DCMAKE_PREFIX_PATH="$NEM_DEP_ZLIB_PREFIX;$NEM_DEP_LIBJPEG_TURBO_PREFIX;$NEM_DEP_ZSTD_PREFIX;$NEM_DEP_XZ_PREFIX" \
          -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_INCLUDEDIR=include -DCMAKE_INSTALL_DATAROOTDIR=share \
          -Dtiff-static=OFF -Dtiff-cxx=OFF -Dtiff-tools=ON -Dtiff-tests=OFF -Dtiff-contrib=OFF -Dtiff-docs=OFF \
          -Dzlib=ON -Djpeg=ON -Dzstd=ON -Dlzma=ON \
          -Dlibdeflate=OFF -Dwebp=OFF -Djbig=OFF -Dlerc=OFF
        cmake --build build -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc || echo 4)"
        cmake --install build

test:
  - run: tiffinfo 2>&1 | grep -q "LIBTIFF, Version $NEM_VERSION"
  - run: |
      set -e
      printf 'P6\n2 2\n255\n' > in.ppm
      printf '\377\0\0\0\377\0\0\0\377\377\377\377' >> in.ppm
      ppm2tiff in.ppm plain.tif
      tiffinfo plain.tif | grep -q 'Image Width: 2 Image Length: 2'
      for c in zip zstd lzma; do
        tiffcp -c "$c" plain.tif "$c.tif"
      done
      tiffinfo zip.tif | grep -q 'Compression Scheme: AdobeDeflate'
      tiffinfo zstd.tif | grep -q 'Compression Scheme: ZSTD'
      tiffinfo lzma.tif | grep -q 'Compression Scheme: LZMA'
  - run: |
      set -e
      [ -f "$NEM_PREFIX/include/tiffio.h" ]
      grep -q "Version: $NEM_VERSION" "$NEM_PREFIX/lib/pkgconfig/libtiff-4.pc"
  - run: |
      set -e
      command -v cc >/dev/null || exit 0
      cat > probe.c <<'CEOF'
      #include <tiffio.h>
      #include <stdio.h>
      int main(void) {
        puts(TIFFGetVersion());
        return 0;
      }
      CEOF
      cc $CPPFLAGS probe.c $LDFLAGS -ltiff -o probe
      ./probe | grep -q "LIBTIFF, Version $NEM_VERSION"
