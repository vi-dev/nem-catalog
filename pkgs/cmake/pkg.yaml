schema: 3
name: cmake
description: Cross-platform build system generator
homepage: https://cmake.org
license: BSD-3-Clause

versionDiscovery:
  github:
    repo: Kitware/CMake
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Kitware/CMake/releases/download/v{{.Version}}/cmake-{{.Version}}-{{if eq .OS \"darwin\"}}macos-universal{{else}}linux-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}{{end}}.tar.gz"

# Linux ships bin/ and share/ under a single version dir; the macOS archive
# nests the same tree under CMake.app/Contents, one extra level down.
install:
  - platforms: [linux]
    extract: {strip: 1}
  - platforms: [darwin]
    extract: {strip: 3}

bins: ["bin"]

