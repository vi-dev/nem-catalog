schema: 2
name: hcl2json
description: Convert HCL to JSON
homepage: https://github.com/tmccombs/hcl2json
license: Apache-2.0

versionDiscovery:
  github:
    repo: tmccombs/hcl2json
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/tmccombs/hcl2json/releases/download/v{{.Version}}/hcl2json_{{.OS}}_{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/hcl2json", mode: 0o755}

bins: ["bin"]

test:
  - run: hcl2json --version | grep -q "$NEM_VERSION"

versions:
