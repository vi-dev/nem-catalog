schema: 3
name: naabu
description: Port scanner for attack surface discovery
homepage: https://github.com/projectdiscovery/naabu
license: MIT

versionDiscovery:
  github:
    repo: projectdiscovery/naabu
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/projectdiscovery/naabu/releases/download/v{{.Version}}/naabu_{{.Version}}_{{replace .OS \"darwin\" \"macOS\"}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "naabu", dst: "bin/naabu", mode: 0o755}

bins: ["bin"]

versions:
  - version: 2.7.0
    sha256:
      darwin/arm64: "25caf00cfbba2b36aa5285c7605909e2bb668dac98729ba939ad3061df9551cf"
      darwin/amd64: "97eed2223ba5bc0958621569dc92e8c4c257ec3d3ee3c1a9baddf23f152eb825"
      linux/arm64: "e88af9bbfd777e2ffab6f84696747ba74de98fafeda882c078d158a610dbd86e"
      linux/amd64: "0cc77c0ca32d2f519ffbaa7665bb0e7c88c40753ab22f03551d453a1a823e9f0"
  - version: 2.6.1
    sha256:
      darwin/arm64: "2f3a100210ddd42d8cf49ae30210c9823488b4687e2b7a869ab0ffc64b26cfba"
      darwin/amd64: "b26e2d7fb91b833ac38cb7abb810cb8af6e7f6489a1c298cb63e584cd1f890a2"
      linux/arm64: "3adc2bb2395c3efff89623499b20eea66ef54924c485d3ae86762393a31736ea"
      linux/amd64: "018c4c9884dea971eda860435ede3021d1150732f34cfd245498c6726d8cab90"

test:
  - run: naabu --version 2>&1 | grep -q "$NEM_VERSION"
