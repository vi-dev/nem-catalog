schemaVersion: 1
name: dnsproxy
description: Simple DNS proxy with DoH, DoT, DoQ, and DNSCrypt support
homepage: https://github.com/AdguardTeam/dnsproxy
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: AdguardTeam/dnsproxy
      assetName: 'dnsproxy-{{.OS}}-{{.Arch}}-{{.Version}}.tar.gz'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  # No checksum file is published; verify against GitHub's per-asset SHA-256 digest.
  verify:
    githubAssetDigest: true

install:
  # Archive roots at a single <os>-<arch>/ dir holding the dnsproxy binary
  # alongside LICENSE and README; strip it and copy the binary.
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/dnsproxy"
      to: "{{.InstallDir}}/bin/dnsproxy"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/dnsproxy", "--version"]
