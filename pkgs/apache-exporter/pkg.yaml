schema: 2
name: apache-exporter
description: Prometheus exporter for Apache httpd
homepage: https://github.com/Lusitaniae/apache_exporter
license: MIT

versionDiscovery:
  github:
    repo: Lusitaniae/apache_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Lusitaniae/apache_exporter/releases/download/v{{.Version}}/apache_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "apache_exporter", dst: "bin/apache_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: apache_exporter --version 2>&1 | grep -q "$NEM_VERSION"

versions:
  - version: 1.1.1
    sha256:
      darwin/arm64: "8461619fbef4f0157a5427dbdbc3ef4d6490ac7da44336ee1d59142ccf788d37"
      darwin/amd64: "88c6277d866dc1ee267617c1a530ad11c61eb9649f664e4829368b971a2e0eca"
      linux/arm64: "1373ed217d325344436e5fea8084466e571fff422c5d8b6b23d1e4e645eea655"
      linux/amd64: "e3e62891e817f1b257893d9d5f94921fb9bb30dcffedb031b1c100374078500c"
