schema: 2
name: golang-migrate
description: Database migrations CLI
homepage: https://github.com/golang-migrate/migrate
license: MIT

versionDiscovery:
  github:
    repo: golang-migrate/migrate
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/golang-migrate/migrate/releases/download/v{{.Version}}/migrate.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "migrate", dst: "bin/migrate", mode: 0o755}

bins: ["bin"]

