schema: 2
name: dua
description: Disk usage analyzer with interactive deletion
homepage: https://github.com/Byron/dua-cli
license: MIT

versionDiscovery:
  github:
    repo: Byron/dua-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Byron/dua-cli/releases/download/v{{.Version}}/dua-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "dua", dst: "bin/dua", mode: 0o755}

bins: ["bin"]

