schema: 3
name: fossa-cli
description: Dependency, license and vulnerability analysis for any codebase
homepage: https://fossa.com
license: MPL-2.0

versionDiscovery:
  github:
    repo: fossas/fossa-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/fossas/fossa-cli/releases/download/v{{.Version}}/fossa_{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "fossa", dst: "bin/fossa", mode: 0o755}

bins: ["bin"]

test:
  - run: fossa --version 2>&1 | grep -q "$NEM_VERSION"

