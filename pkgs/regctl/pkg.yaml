schemaVersion: 1
name: regctl
description: Command-line client for Docker and OCI registries
homepage: https://regclient.org
license: Apache-2.0

archive:
  fetch:
    github_release:
      repo: regclient/regclient
      # Assets are raw per-platform binaries named regctl-<os>-<arch>, matching
      # the default .OS/.Arch tokens directly (no templateOverrides needed).
      assetName: 'regctl-{{.OS}}-{{.Arch}}'
      releaseFilter: '^(v\d+\.\d+\.\d+)$'
  # regctl publishes no checksum file; verify against GitHub's per-asset digest.
  verify:
    githubAssetDigest: true

install:
  # The asset is the executable itself; copy it straight in (nem sets +x).
  - copy:
      from: "{{.Archive}}"
      to: "{{.InstallDir}}/bin/regctl"

test:
  - run:
      cmd: ["{{.InstallDir}}/bin/regctl", "version"]
