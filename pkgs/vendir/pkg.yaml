schema: 2
name: vendir
description: Declaratively vendor git repos, releases, charts and images
homepage: https://carvel.dev/vendir
license: Apache-2.0

versionDiscovery:
  github:
    repo: carvel-dev/vendir
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/carvel-dev/vendir/releases/download/v{{.Version}}/vendir-{{.OS}}-{{.Arch}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/vendir", mode: 0o755}

bins: ["bin"]

test:
  - run: vendir version | grep -q "$NEM_VERSION"

versions:
