schemaVersion: 1
name: zig
description: General-purpose programming language and toolchain for robust, optimal, reusable software
homepage: https://ziglang.org
license: MIT

archive:
  fetch:
    http:
      url: 'https://ziglang.org/download/{{.Version}}/zig-{{.Arch}}-{{.OS}}-{{.Version}}.tar.xz'
      versionsFrom:
        github_tag:
          repo: ziglang/zig
          tagFilter: '^(\d+\.\d+\.\d+)$'
      templateOverrides:
        darwin: macos
        amd64: x86_64
        arm64: aarch64

# Zig is distributed off-GitHub with no checksum sidecar; the per-platform
# SHA-256s from ziglang.org/download/index.json are embedded here (matched by
# asset filename). Bump the version and all four hashes together on a new release.
versions:
  - version: "0.15.2"
    archive:
      verify:
        checksum: |
          02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig-x86_64-linux-0.15.2.tar.xz
          958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f  zig-aarch64-linux-0.15.2.tar.xz
          375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f  zig-x86_64-macos-0.15.2.tar.xz
          3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  zig-aarch64-macos-0.15.2.tar.xz

# The tarball roots at zig-<arch>-<os>-<ver>/ with the `zig` binary and its
# `lib/` standard library side by side. zig locates lib/ relative to its own
# exe, so install the binary at bin/zig and lib/ at the install root — zig then
# resolves it via bin/../lib.
install:
  - extract:
      from: "{{.Archive}}"
      as: src
      stripComponents: 1
  - copy:
      from: "{{.Var.src}}/lib"
      to: "{{.InstallDir}}/lib"
  - copy:
      from: "{{.Var.src}}/zig"
      to: "{{.InstallDir}}/bin/zig"

test:
  - run:
      # `zig env` exercises both the binary and lib-dir resolution; it needs a
      # writable cache dir, redirected to a relative path under the sandbox cwd.
      cmd: ["{{.InstallDir}}/bin/zig", "env"]
      env:
        ZIG_GLOBAL_CACHE_DIR: zig-cache
        ZIG_LOCAL_CACHE_DIR: zig-cache
