schema: 3
name: gojq
description: Pure Go implementation of jq
homepage: https://github.com/itchyny/gojq
license: MIT

versionDiscovery:
  github:
    repo: itchyny/gojq
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/itchyny/gojq/releases/download/v{{.Version}}/gojq_v{{.Version}}_{{.OS}}_{{.Arch}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 1}
  - copy: {src: "gojq", dst: "bin/gojq", mode: 0o755}

bins: ["bin"]

versions:
  - version: 0.12.20
    sha256:
      darwin/arm64: "54be17aae49787bb92759bb8662b80f66b9655d42fe3b9e4c39a0c3587962afd"
      darwin/amd64: "142a0c2f17802ca9a290ca8498adfcf5ec19d8c14b13303c9329511e70dae5bc"
      linux/arm64: "14384db99511f57f0dcb35c7b825f8afd5407f9c203631aad4dd163af1856c35"
      linux/amd64: "92ce2328ce3099532d2b23abfa25a348ecdc48caa584d821feab563f7df4a856"
  - version: 0.12.19
    sha256:
      darwin/arm64: "40208d4c385c5cebe3798f9d5a30ff1123537d66e171f2450a110347933482f7"
      darwin/amd64: "e8816cd2e1a276a03ed8f902475d2ed641043295f420aadc623929d717cd4314"
      linux/arm64: "b22794b4bebad11c42af52550bda317c5cd7ee79aaa729eb6ec91a63f623d8b5"
