schema: 2
name: oxipng
description: Multithreaded PNG optimizer
homepage: https://github.com/oxipng/oxipng
license: MIT

versionDiscovery:
  github:
    repo: oxipng/oxipng
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/oxipng/oxipng/releases/download/v{{.Version}}/oxipng-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "oxipng", dst: "bin/oxipng", mode: 0o755}

bins: ["bin"]

