schema: 3
name: snmp-exporter
description: Prometheus exporter for SNMP
homepage: https://github.com/prometheus/snmp_exporter
license: Apache-2.0

versionDiscovery:
  github:
    repo: prometheus/snmp_exporter
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/prometheus/snmp_exporter/releases/download/v{{.Version}}/snmp_exporter-{{.Version}}.{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "snmp_exporter", dst: "bin/snmp_exporter", mode: 0o755}

bins: ["bin"]

test:
  - run: snmp_exporter --version 2>&1 | grep -q "$NEM_VERSION"

