schema: 3
name: jdk25
description: Eclipse Temurin JDK 25 (LTS)
homepage: https://adoptium.net
license: GPL-2.0-only WITH Classpath-exception-2.0

versionDiscovery:
  github:
    repo: adoptium/temurin25-binaries
    filter: '^jdk-25(\.\d+){1,3}\+\d+(\.\d+)?$'
    prefix: "jdk-"

# Upstream releases are "25.0.4+7", but a version doubles as an OCI tag in
# the catalog's archives repo, where "+" is invalid — it is spelled "_" here
# and mapped back in the URL.
artifact:
  url: "https://api.adoptium.net/v3/binary/version/jdk-{{replace .Version \"_\" \"+\"}}/{{replace .OS \"darwin\" \"mac\"}}/{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x64\"}}/jdk/hotspot/normal/eclipse"

install:
  - extract: {strip: 1}

# Temurin macOS archives nest the JDK under Contents/Home; Linux archives
# don't. The entry absent on a platform contributes a dir that never exists.
bins: ["bin", "Contents/Home/bin"]

env:
  - name: JAVA_HOME
    value: "{{.InstallDir}}"
    platforms: [linux]
  - name: JAVA_HOME
    value: "{{.InstallDir}}/Contents/Home"
    platforms: [darwin]

versions:
  - version: 25.0.5_8
    sha256:
      darwin/arm64: "36dc14d797aaff6d89aab302cd053fdba6207dfdcf772052fa7b023a94b0e857"
      darwin/amd64: "32cd4d2151c91aa00d0fc911edfd05245ed40fa6b1aa894d5f35c928cd67a59d"
      linux/arm64: "bb5b2ded252f21c6090cf780b0a408ad0d83bbb557e702955643557f13231880"
      linux/amd64: "68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb"
  - version: 25.0.4_7
    sha256:
      darwin/arm64: "5a101c54abf5a9f16c0f70d8c38ba99e6567c1ba213378f0bb04497284f051bd"
      darwin/amd64: "a5ac9c46dad47ac06df35e36d096913195d8da1f3f71918828bcc2cfe33869b7"
      linux/arm64: "621f7196f0b682fb557da58bec89bd7dfe5419811fe1c0ba75c9cc8432f084c7"
      linux/amd64: "e58fcdcd637b25c03ca84cbbcefc70d11efb8f4b4cbd05decc9f661769d77f94"

test:
  - run: java --version | grep -q "Temurin-$(printf '%s' "$NEM_VERSION" | tr _ +)"
  - run: |
      set -e
      [ -x "$JAVA_HOME/bin/java" ]
      printf 'public class P { public static void main(String[] a) { System.out.print("ok"); } }\n' > P.java
      [ "$(java P.java)" = ok ]
