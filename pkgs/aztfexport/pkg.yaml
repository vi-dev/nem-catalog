schema: 3
name: aztfexport
description: Bring existing Azure resources under Terraform management
homepage: https://azure.github.io/aztfexport/
license: MPL-2.0

versionDiscovery:
  github:
    repo: Azure/aztfexport
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Azure/aztfexport/releases/download/v{{.Version}}/aztfexport_v{{.Version}}_{{.OS}}_{{.Arch}}.zip"

install:
  - extract: {strip: 0}
  - copy: {src: "aztfexport", dst: "bin/aztfexport", mode: 0o755}

bins: ["bin"]

test:
  - run: aztfexport --version 2>&1 | grep -q "$NEM_VERSION"

