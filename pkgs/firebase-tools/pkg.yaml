schema: 2
name: firebase-tools
description: Command line interface for Firebase projects
homepage: https://firebase.google.com/docs/cli
license: MIT

# Upstream ships one x86_64 macOS binary; darwin/arm64 runs it under Rosetta 2.
platforms: [darwin/arm64, darwin/amd64, linux/amd64]

versionDiscovery:
  github:
    repo: firebase/firebase-tools
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/firebase/firebase-tools/releases/download/v{{.Version}}/firebase-tools-{{replace .OS \"darwin\" \"macos\"}}"

install:
  - copy: {src: "{{.Artifact}}", dst: "bin/firebase", mode: 0o755}

bins: ["bin"]

