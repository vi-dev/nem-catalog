schema: 3
name: qovery
description: Qovery CLI
homepage: https://www.qovery.com
license: Apache-2.0

versionDiscovery:
  github:
    repo: Qovery/qovery-cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Qovery/qovery-cli/releases/download/v{{.Version}}/qovery-cli_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "qovery", dst: "bin/qovery", mode: 0o755}

bins: ["bin"]

test:
  - run: qovery version 2>&1 | grep -q "$NEM_VERSION"

