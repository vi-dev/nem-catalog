schema: 3
name: hurl
description: Run and test HTTP requests defined in plain text
homepage: https://hurl.dev
license: Apache-2.0

versionDiscovery:
  github:
    repo: Orange-OpenSource/hurl
    filter: '^\d+\.\d+\.\d+$'

deps:
  - name: libxml2
    kind: link
    compat: "2.13"
    platforms: [linux/arm64, linux/amd64]
  - name: curl
    kind: link
    compat: "8"
    platforms: [linux/arm64, linux/amd64]

artifact:
  url: "https://github.com/Orange-OpenSource/hurl/releases/download/{{.Version}}/hurl-{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-gnu\"}}.tar.gz"

install:
  # the tarball already lays out bin/ (hurl and hurlfmt)
  - extract: {strip: 1}

bins: ["bin"]

versions:
  - version: 8.1.0
    sha256:
      darwin/arm64: "f5c6bf73172779e9d22b87249727d1c0ac232137f07df0c7d73b3ec4bcaa9f3b"
      darwin/amd64: "54b1101ab2a8912b9ec5730981ed59900dc4d9de3cdd8bdd2d457df5258b961e"
      linux/arm64: "33c39409d4a24febb91d3766d3a5cb4074b7b86ad89d612f26fa35ab5e8cec79"
      linux/amd64: "b497e7ab328100c507f1f3323ebe7cc5990d831ae4f9473b74d40b02971da4ca"
  - version: 8.0.1
    sha256:
      darwin/arm64: "b57928e246617df73cb1b2157f31f507dcbde6ae12e828cc53dde0e40e05bbbb"
      darwin/amd64: "55e95bb7a8d61ae6919eaaf96f260f0836f5b34c1b0f7731e38be803f6984367"
      linux/arm64: "bc4732df4754748e9bf296aa3832ec019f798afb399f1279b72ed37b6e04525c"
      linux/amd64: "cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06"

test:
  - run: hurl --version | grep -q "$NEM_VERSION"
