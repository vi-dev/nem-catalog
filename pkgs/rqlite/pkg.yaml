schema: 3
name: rqlite
description: Lightweight distributed database built on SQLite
homepage: https://rqlite.io
license: MIT

platforms: ["linux/arm64", "linux/amd64"]

versionDiscovery:
  github:
    repo: rqlite/rqlite
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/rqlite/rqlite/releases/download/v{{.Version}}/rqlite-v{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz"

install:
  - extract: {strip: 1}
  - copy: {src: "rqlited", dst: "bin/rqlited", mode: 0o755}
  - copy: {src: "rqlite", dst: "bin/rqlite", mode: 0o755}

bins: ["bin"]

test:
  - run: rqlited -version 2>&1 | grep -q "$NEM_VERSION"

