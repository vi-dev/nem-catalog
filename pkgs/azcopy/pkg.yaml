schema: 2
name: azcopy
description: Azure Storage data transfer utility
homepage: https://github.com/Azure/azure-storage-azcopy
license: MIT

versionDiscovery:
  github:
    repo: Azure/azure-storage-azcopy
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/Azure/azure-storage-azcopy/releases/download/v{{.Version}}/azcopy_{{.OS}}_{{.Arch}}_{{.Version}}.{{if eq .OS \"darwin\"}}zip{{else}}tar.gz{{end}}"

install:
  - extract: {strip: 1}
  - copy: {src: "azcopy", dst: "bin/azcopy", mode: 0o755}

bins: ["bin"]

test:
  - run: azcopy --version 2>&1 | grep -q "$NEM_VERSION"

versions:
