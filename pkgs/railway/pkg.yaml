schema: 2
name: railway
description: Railway CLI
homepage: https://railway.com
license: MIT

versionDiscovery:
  github:
    repo: railwayapp/cli
    filter: '^v\d+\.\d+\.\d+$'
    prefix: "v"

artifact:
  url: "https://github.com/railwayapp/cli/releases/download/v{{.Version}}/railway-v{{.Version}}-{{replace (replace .Arch \"arm64\" \"aarch64\") \"amd64\" \"x86_64\"}}-{{replace (replace .OS \"darwin\" \"apple-darwin\") \"linux\" \"unknown-linux-musl\"}}.tar.gz"

install:
  - extract: {strip: 0}
  - copy: {src: "railway", dst: "bin/railway", mode: 0o755}

bins: ["bin"]

test:
  - run: railway --version 2>&1 | grep -q "$NEM_VERSION"

versions:
