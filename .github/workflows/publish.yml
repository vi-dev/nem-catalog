name: Publish

on:
  push:
    branches: [main]
    paths: ["pkgs/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  changes:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-nem
      - id: detect
        uses: ./.github/actions/changed-packages
      - id: plan
        name: Compute smoke plan
        shell: bash
        env:
          BUILD: ${{ steps.detect.outputs.build }}
          PREBUILT: ${{ steps.detect.outputs.prebuilt }}
        run: echo "smoke=$(jq -c --argjson p "$PREBUILT" '. + $p' <<< "$BUILD")" >> "$GITHUB_OUTPUT"

  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-nem
      - run: nem catalog publish ghcr.io/vi-dev/nem-catalog . --tag v2-staging

  archives:
    needs: stage
    uses: ./.github/workflows/build-archives.yml
    with:
      catalog: ghcr.io/vi-dev/nem-catalog:v2-staging
      missing: true
      push: true

  smoke:
    needs: [changes, archives]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.smoke != '[]' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-packages.yml
    with:
      catalog: ghcr.io/vi-dev/nem-catalog:v2-staging
      entries: ${{ needs.changes.outputs.smoke }}

  promote:
    needs: [stage, archives, smoke]
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.archives.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.smoke.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
      - name: Promote v2-staging to v2
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras tag ghcr.io/vi-dev/nem-catalog:v2-staging v2
