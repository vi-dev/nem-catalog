name: Smoke

on:
  schedule:
    - cron: "0 6 * * 2" # Tuesdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    uses: ./.github/workflows/test-packages.yml
    with:
      catalog: ghcr.io/vi-dev/nem-catalog:v2
      all: true
      timeout-minutes: 180
