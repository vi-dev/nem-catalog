name: Build

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: Space- or comma-separated name[@version] entries to force-build (empty = only missing archives)
        default: ""
      force:
        description: With package, overwrite archives even when a rebuilt platform entry is unchanged
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  archives:
    uses: ./.github/workflows/build-archives.yml
    with:
      catalog: ghcr.io/vi-dev/nem-catalog:v2
      missing: ${{ inputs.package == '' }}
      packages: ${{ inputs.package }}
      push: true
      force: ${{ inputs.force || false }}
