name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
  workflow_dispatch:
    inputs:
      nem_version:
        description: nem version to run with — a release tag, or 'unstable' to build the latest main.
        type: string
        default: unstable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEM_VERSION: unstable
  REGISTRY_BASE: ghcr.io/vi-dev/nem-catalog

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-nem
        with:
          version: ${{ inputs.nem_version || env.NEM_VERSION }}
      - name: Offline-lint all manifests
        run: nem author lint pkgs
      - name: Dry-run publish (assemble index, no push)
        run: nem author publish "${REGISTRY_BASE}" . --dry-run

  install-lint:
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nem
        with:
          version: ${{ inputs.nem_version || env.NEM_VERSION }}
      - name: Set up bubblewrap (Linux sandbox)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # which stops bwrap from creating the sandbox ("Creating new namespace
          # failed: Operation not permitted"). Re-allow them so the install pass
          # runs under the real sandbox instead of failing to start it.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Configure GitHub auth for the install pass
        run: |
          mkdir -p "${HOME}/.nem"
          cat > "${HOME}/.nem/config.yaml" <<'EOF'
          auth:
            github:
              token: '{{ env "GITHUB_TOKEN" }}'
          EOF
      - name: Install-lint changed packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          NEM_BUILD_TIMEOUT: 20m
        run: |
          set -euo pipefail
          diff_out="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- pkgs/ \
                      | awk -F/ 'NF>=2 {print $2}' | sort -u)"
          changed=()
          while IFS= read -r p; do
            [ -n "${p}" ] && [ -d "pkgs/${p}" ] && changed+=("${p}")
          done <<< "${diff_out}"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No package manifests changed; nothing to install-lint."
            exit 0
          fi
          echo "Install-linting: ${changed[*]}"
          # Stage only the changed packages so one `nem author lint --install`
          # run probes them all in parallel (bounded by its --jobs default).
          # Dependencies outside the changed set resolve from the published
          # official catalog, exactly as they would for a real install.
          staging="$(mktemp -d)"
          mkdir -p "${staging}/pkgs"
          for p in "${changed[@]}"; do
            cp -R "pkgs/${p}" "${staging}/pkgs/${p}"
          done
          nem author lint "${staging}" --install
