name: CI

on:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-nem
      - run: nem catalog lint .
      - name: Assert canonical manifest formatting
        shell: bash
        run: |
          nem catalog fmt .
          git diff --exit-code -- pkgs

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-nem
      - name: Publish dry-run
        shell: bash
        run: |
          nem catalog publish ghcr.io/vi-dev/nem-catalog . --dry-run \
            > /tmp/publish-plan.txt
          {
            echo "### Publish plan (dry-run)"
            echo '```'
            cat /tmp/publish-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.detect.outputs.build }}
      prebuilt: ${{ steps.detect.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-nem
      - id: detect
        uses: ./.github/actions/changed-packages

  archives:
    needs: changes
    if: needs.changes.outputs.build != '[]'
    uses: ./.github/workflows/build-archives.yml
    with:
      catalog: "."
      packages: ${{ join(fromJSON(needs.changes.outputs.build), ' ') }}
      push: false
      prune: true
      official: ghcr.io/vi-dev/nem-catalog:v2

  prebuilt:
    needs: changes
    if: needs.changes.outputs.prebuilt != '[]'
    uses: ./.github/workflows/test-packages.yml
    with:
      catalog: "."
      entries: ${{ needs.changes.outputs.prebuilt }}
      prune: true
      official: ghcr.io/vi-dev/nem-catalog:v2
      timeout-minutes: 60

  ci-ok:
    needs: [lint, plan, changes, archives, prebuilt]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS_JSON" >/dev/null
