name: Changed packages
description: Classify packages whose manifests differ from the published catalog into built and prebuilt name@version entries
inputs:
  catalog-ref:
    description: Published catalog ref the working tree is diffed against (the diff target)
    default: ghcr.io/vi-dev/nem-catalog:v2
outputs:
  build:
    description: JSON array of name@version strings for packages built from source, one per version to act on
    value: ${{ steps.detect.outputs.build }}
  prebuilt:
    description: JSON array of name@version strings for prebuilt packages, one per version to act on
    value: ${{ steps.detect.outputs.prebuilt }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        CATALOG_REF: ${{ inputs['catalog-ref'] }}
      run: ${{ github.action_path }}/detect.sh
