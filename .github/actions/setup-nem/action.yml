name: Setup nem
description: Install nem onto PATH from a GitHub release — a pinned tag, or the rolling 'unstable' release built from main.

inputs:
  version:
    description: nem release tag to install, or 'unstable' for the rolling release built from the latest main.
    required: true

runs:
  using: composite
  steps:
    - name: Install nem ${{ inputs.version }}
      shell: bash
      env:
        NEM_VERSION: ${{ inputs.version }}
        NEM_INSTALL_DIR: ${{ runner.temp }}/nem-bin
      run: |
        set -euo pipefail
        curl -fsSL "https://raw.githubusercontent.com/vi-dev/nem/${NEM_VERSION}/install.sh" | bash
        echo "${NEM_INSTALL_DIR}" >> "${GITHUB_PATH}"
        "${NEM_INSTALL_DIR}/nem" version
