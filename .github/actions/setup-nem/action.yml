name: Setup nem
description: Install nem (unstable channel), write ghcr.io credentials and optionally configure the official catalog
inputs:
  catalog:
    description: OCI catalog ref to configure and sync as "official"
    default: ""
  ghcr-token:
    description: Token written to ~/.docker/config.json for ghcr.io
    default: ${{ github.token }}
  install:
    description: Install nem onto the runner
    default: "true"
runs:
  using: composite
  steps:
    - name: Pin NEM_HOME to the step home
      shell: bash
      run: echo "NEM_HOME=$HOME/.nem" >> "$GITHUB_ENV"
    - name: Install nem
      if: inputs.install == 'true'
      shell: bash
      run: |
        # Job containers built from ghcr.io/vi-dev/nem ship nem already.
        if command -v nem >/dev/null; then
          nem version
          exit 0
        fi
        curl -fsSL https://raw.githubusercontent.com/vi-dev/nem/main/install.sh \
          | NEM_VERSION=unstable bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Write ghcr.io credentials
      if: inputs['ghcr-token'] != ''
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs['ghcr-token'] }}
      run: |
        # A credentials file instead of `docker login`: macOS runners have no
        # docker CLI, and nem reads the standard config file via oras-go.
        mkdir -p "$HOME/.docker"
        auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 | tr -d '\n')
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$HOME/.docker/config.json"
    - name: Configure the official catalog
      if: inputs.catalog != ''
      shell: bash
      env:
        CATALOG_REF: ${{ inputs.catalog }}
      run: .github/scripts/configure-official.sh
